/* =========================================================
   FINAL BOSS
   ========================================================= */

class ChaosFinalBoss{

    constructor(){

        this.x=
            player.x+
            900;

        this.y=
            world.floor-180;

        this.vx=0;
        this.vy=0;

        this.hp=5000;
        this.maxHp=5000;

        this.radius=85;

        this.phase=1;

        this.timer=0;

        this.attack=2;

        this.dead=false;

        this.flash=0;

        this.spin=0;
    }

    update(delta){

        if(this.dead)
            return;

        this.timer+=delta;

        this.flash=
            Math.max(
                0,
                this.flash-delta
            );

        const ratio=
            this.hp/
            this.maxHp;

        this.phase=
            ratio>.66
            ? 1
            : ratio>.33
            ? 2
            : 3;

        const dx=
            player.x-this.x;

        const dir=
            Math.sign(dx)||1;

        this.vx+=
            dir*
            150*
            delta;

        this.vx=
            c8Clamp(
                this.vx,
                -420,
                420
            );

        this.vy+=
            world.gravity*
            delta;

        this.x+=
            this.vx*
            delta;

        this.y+=
            this.vy*
            delta;

        this.spin+=
            this.vx*.002;

        if(
            this.y+
            this.radius>
            world.floor
        ){

            this.y=
                world.floor-
                this.radius;

            if(
                Math.abs(
                    this.vy
                )>250
            ){

                this.vy*=-.5;

                chaos8Shock(
                    this.x,
                    this.y,
                    900
                );
            }
            else{

                this.vy=0;
            }
        }

        this.attack-=delta;

        if(
            this.attack<=0
        ){

            this.performAttack();

            this.attack=
                this.phase===1
                ? 2.2
                : this.phase===2
                ? 1.45
                : .8;
        }

        if(
            this.timer>5 &&
            this.phase>=2
        ){

            this.timer=0;

            chaos8ArenaBurst();
        }
    }

    performAttack(){

        const attacks=
            this.phase===1
            ? ["slam","charge"]
            : this.phase===2
            ? ["slam","charge","ring"]
            : [
                "slam",
                "charge",
                "ring",
                "storm"
            ];

        const a=
            c8Random(attacks);

        if(a==="slam"){

            this.vy=-1050;

            setTimeout(()=>{

                if(
                    !this.dead
                ){

                    chaos8Shock(
                        this.x,
                        world.floor,
                        1600
                    );
                }

            },500);
        }

        if(a==="charge"){

            this.vx+=
                Math.sign(
                    player.x-this.x
                )*
                1200;

            chaos8Shock(
                this.x,
                this.y,
                700
            );
        }

        if(a==="ring"){

            for(let i=0;i<14;i++){

                const angle=
                    i/14*TAU;

                chaos8.finalProjectiles.push({

                    x:this.x,
                    y:this.y,

                    vx:
                        Math.cos(angle)*
                        700,

                    vy:
                        Math.sin(angle)*
                        700,

                    life:3,
                    radius:9
                });
            }
        }

        if(a==="storm"){

            chaos8.warning=
                "FINAL CHAOS";

            chaos8.warningTimer=2;

            for(let i=0;i<18;i++){

                chaos7.meteors.push({

                    x:
                        player.x+
                        rand(
                            -800,
                            800
                        ),

                    y:
                        player.y-
                        rand(
                            500,
                            1000
                        ),

                    vx:
                        rand(
                            -200,
                            200
                        ),

                    vy:
                        rand(
                            600,
                            1000
                        ),

                    radius:
                        rand(
                            10,
                            28
                        ),

                    life:5
                });
            }
        }
    }

    damage(amount){

        if(this.dead)
            return;

        this.hp=
            Math.max(
                0,
                this.hp-
                amount
            );

        this.flash=.1;

        chaos8Shock(
            this.x,
            this.y,
            amount*8
        );

        if(
            this.hp<=0
        ){

            this.die();
        }
    }

    die(){

        this.dead=true;

        chaos8.finalMode=false;

        chaos8.stats.bossesDefeated++;

        chaos8.stats.totalScore+=
            10000;

        player.score+=10000;

        chaos8.warning=
            "CHAOS TERMINÉ";

        chaos8.warningTimer=5;

        chaos8Cinematic();

        for(let i=0;i<25;i++){

            setTimeout(()=>{

                chaos5Explosion(
                    this.x+
                    rand(
                        -300,
                        300
                    ),
                    this.y+
                    rand(
                        -250,
                        150
                    ),
                    rand(
                        100,
                        260
                    )
                );

            },i*100);
        }

        chaos8Save();
    }

    draw(){

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.spin
        );

        ctx.strokeStyle="#fff";

        ctx.fillStyle=
            this.flash>0
            ? "#fff"
            : "#111";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            -30,
            48,
            0,
            TAU
        );

        ctx.fill();
        ctx.stroke();

        ctx.fillRect(
            -45,
            15,
            90,
            105
        );

        ctx.strokeRect(
            -45,
            15,
            90,
            105
        );

        /* arms */

        ctx.beginPath();

        ctx.moveTo(
            -40,
            35
        );

        ctx.lineTo(
            -105,
            90
        );

        ctx.moveTo(
            40,
            35
        );

        ctx.lineTo(
            105,
            90
        );

        /* legs */

        ctx.moveTo(
            -25,
            115
        );

        ctx.lineTo(
            -55,
            190
        );

        ctx.moveTo(
            25,
            115
        );

        ctx.lineTo(
            55,
            190
        );

        ctx.stroke();

        /* eyes */

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            -18,
            -35,
            7,
            0,
            TAU
        );

        ctx.arc(
            18,
            -35,
            7,
            0,
            TAU
        );

        ctx.fill();

        ctx.restore();

        /* boss bar */

        const w=420;

        const ratio=
            this.hp/
            this.maxHp;

        ctx.save();

        ctx.fillStyle=
            "rgba(0,0,0,.8)";

        ctx.fillRect(
            this.x-w/2,
            this.y-250,
            w,
            22
        );

        ctx.strokeStyle="#fff";

        ctx.strokeRect(
            this.x-w/2,
            this.y-250,
            w,
            22
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            this.x-w/2+3,
            this.y-247,
            (w-6)*ratio,
            16
        );

        ctx.fillStyle="#fff";

        ctx.font=
            "bold 17px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "FINAL CHAOS BOSS",
            this.x,
            this.y-260
        );

        ctx.restore();
    }
}

/* =========================================================
   FINAL BOSS PROJECTILES
   ========================================================= */

chaos8.finalProjectiles=[];

function chaos8UpdateFinalProjectiles(delta){

    for(
        let i=
            chaos8.finalProjectiles.length-1;
        i>=0;
        i--
    ){

        const p=
            chaos8.finalProjectiles[i];

        p.x+=
            p.vx*
            delta;

        p.y+=
            p.vy*
            delta;

        p.life-=delta;

        if(
            c8Dist(
                p.x,
                p.y,
                player.x,
                player.y-25
            )<
            p.radius+28
        ){

            damagePlayer(
                12,
                Math.sign(
                    p.vx
                )*500
            );

            chaos8Shock(
                p.x,
                p.y,
                400
            );

            p.life=0;
        }

        if(
            p.life<=0
        ){

            chaos8.finalProjectiles.splice(
                i,
                1
            );
        }
    }
}

const chaos8Attack=

    if(

    const b=
        chaos8FinalBoss;

    const d=
        c8Dist(
            player.x+
            player.facing*
            65,
            player.y-30,
            b.x,
            b.y
        );

    if(d<125){

        b.damage(
            rand(
                20,
                38
            )
        );

        player.score+=50;
    }
};

/* =========================================================
   OBJECTS VS FINAL BOSS
   ========================================================= */

function chaos8BossObjects(){

    if(
        !chaos8FinalBoss ||
        chaos8FinalBoss.dead
    )
        return;

    const b=
        chaos8FinalBoss;

    for(const o of objects){

        if(
            o.dead ||
            o.held
        )
            continue;

        const d=
            c8Dist(
                b.x,
                b.y,
                o.x,
                o.y
            );

        if(
            d<
            b.radius+
            Math.max(
                o.w,
                o.h
            )/2
        ){

            const speed=
                Math.hypot(
                    o.vx,
                    o.vy
                );

            if(speed>300){

                b.damage(
                    Math.min(
                        50,
                        speed*.04
                    )
                );

                o.vx*=.3;
                o.vy*=.3;
            }
        }
    }
}

/* =========================================================
   SHOCK
   ========================================================= */

function chaos8Shock(
    x,
    y,
    power
){

    if(
        typeof chaos6Impact===
        "function"
    ){

        chaos6Impact(
            x,
            y,
            power
        );
    }

    chaos8.destructionPulse(
        x,
        y,
        power
    );
}

/* =========================================================
   DESTRUCTION PULSE
   ========================================================= */

chaos8.destructionPulse=
function(x,y,power){

    const radius=
        c8Clamp(
            power*.12,
            50,
            280
        );

    for(const o of objects){

        if(
            o.dead ||
            o.held
        )
            continue;

        const dx=
            o.x-x;

        const dy=
            o.y-y;

        const d=
            Math.hypot(
                dx,
                dy
            );

        if(
            d<radius &&
            d>0
        ){

            const n=
                c8Normalize(
                    dx,
                    dy
                );

            const force=
                1-
                d/radius;

            o.vx+=
                n.x*
                power*
                .6*
                force;

            o.vy+=
                n.y*
                power*
                .6*
                force-
                100;
        }
    }
};

/* =========================================================
   ARENA BURST
   ========================================================= */

function chaos8ArenaBurst(){

    for(let i=0;i<4;i++){

        chaos5Explosion(
            player.x+
            rand(
                -500,
                500
            ),
            world.floor-
            rand(
                30,
                200
            ),
            rand(
                70,
                150
            )
        );
    }

    for(let i=0;i<3;i++){

        chaos2SpawnRagdoll(
            player.x+
            rand(
                -600,
                600
            ),
            player.y-
            rand(
                150,
                450
            )
        );
    }
}

/* =========================================================
   CINEMATIC
   ========================================================= */

function chaos8Cinematic(){

    chaos8.cinematic=3;

    camera.shake=40;

    chaos8ArenaBurst();

    setTimeout(()=>{

        showMessage(
            "VICTOIRE"
        );

    },1000);

    setTimeout(()=>{

        chaos8Save();

    },2500);
}

/* =========================================================
   UPDATE FINAL
   ========================================================= */

const chaos8OldUpdate=
    update;

update=function(delta){

    chaos8OldUpdate(delta);

    chaos8.stats.playTime+=delta;

    chaos8UpdateFinalProjectiles(delta);

    chaos8BossObjects();

    if(
        chaos8FinalBoss &&
        !chaos8FinalBoss.dead
    ){

        chaos8FinalBoss.update(delta);
    }

    if(
        chaos8.cinematic>0
    ){

        chaos8.cinematic-=delta;
    }

    if(
        chaos8.settings.autosave &&
        Math.floor(
            chaos8.stats.playTime
        )%10===0
    ){

        chaos8Save();
    }
};

/* =========================================================
   DRAW FINAL
   ========================================================= */

const chaos8OldRender=
    render;

render=function(){

    chaos8OldRender();

    ctx.save();

    if(
        chaos8FinalBoss &&
        !chaos8FinalBoss.dead
    ){

        chaos8FinalBoss.draw();
    }

    for(
        const p of
        chaos8.finalProjectiles
    ){

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            TAU
        );

        ctx.fill();
    }

    if(
        chaos8.cinematic>0
    ){

        const alpha=
            Math.min(
                .8,
                chaos8.cinematic/
                2
            );

        ctx.fillStyle=
            "rgba(255,255,255,"+
            alpha+
            ")";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.fillStyle="#111";

        ctx.font=
            "900 52px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "CHAOS TERMINÉ",
            W/2,
            H/2
        );
    }

    ctx.restore();
};

/* =========================================================
   STATS TRACKING
   ========================================================= */

let chaos8LastScore=0;

const chaos8StatsUpdate=
    update;

update=function(delta){

    chaos8StatsUpdate(delta);

    if(
        typeof player.score==="number"
    ){

        const gained=
            player.score-
            chaos8LastScore;

        if(gained>0){

            chaos8.stats.totalScore+=
                gained;
        }

        chaos8LastScore=
            player.score;
    }

    if(
        typeof player.combo==="number"
    ){

        chaos8.stats.bestCombo=
            Math.max(
                chaos8.stats.bestCombo,
                player.combo
            );
    }
};

/* =========================================================
   PERFORMANCE MONITOR
   ========================================================= */

let chaos8FrameTime=
    performance.now();

const chaos8Frame=
    update;

update=function(delta){

    chaos8Frame(delta);

    const now=
        performance.now();

    const frameDelta=
        now-
        chaos8FrameTime;

    chaos8FrameTime=now;

    if(
        frameDelta>0
    ){

        const fps=
            1000/
            frameDelta;

        chaos8.fpsSamples.push(
            fps
        );

        if(
            chaos8.fpsSamples.length>30
        ){

            chaos8.fpsSamples.shift();
        }

        chaos8.fps=
            chaos8.fpsSamples.reduce(
                (a,b)=>a+b,
                0
            )/
            chaos8.fpsSamples.length;
    }
};
