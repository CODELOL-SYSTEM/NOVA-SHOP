<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STICKMAN CHAOS ARENA</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050509;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    color:white;
}

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
    background:
        radial-gradient(circle at 50% 35%,#151525 0%,#07070d 50%,#020204 100%);
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#top{
    position:absolute;
    top:18px;
    left:18px;
    display:flex;
    gap:10px;
    align-items:center;
}

.panel{
    background:rgba(8,8,15,.78);
    border:1px solid rgba(255,255,255,.13);
    border-radius:12px;
    padding:10px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
    backdrop-filter:blur(8px);
}

#healthBox{
    width:230px;
}

.label{
    font-size:11px;
    letter-spacing:2px;
    opacity:.65;
    margin-bottom:5px;
}

#healthBar{
    height:13px;
    border-radius:20px;
    overflow:hidden;
    background:#20202a;
}

#healthFill{
    height:100%;
    width:100%;
    background:#fff;
    transition:width .12s;
}

#stats{
    display:flex;
    gap:12px;
    font-size:13px;
}

#combo{
    font-size:20px;
    font-weight:900;
}

#message{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%) scale(.8);
    font-size:42px;
    font-weight:1000;
    letter-spacing:5px;
    opacity:0;
    text-shadow:0 5px 30px #000;
    transition:.15s;
}

#crosshair{
    position:absolute;
    width:18px;
    height:18px;
    border:2px solid rgba(255,255,255,.8);
    border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:.7;
}

#damageOverlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    background:
      radial-gradient(circle,
      transparent 35%,
      rgba(255,0,0,.04) 55%,
      rgba(255,0,0,.45) 100%);
    mix-blend-mode:screen;
}

#help{
    position:absolute;
    bottom:18px;
    left:18px;
    max-width:520px;
    font-size:12px;
    line-height:1.6;
    opacity:.55;
}

#pause{
    position:absolute;
    inset:0;
    display:none;
    place-items:center;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(8px);
}

#pause div{
    text-align:center;
    font-size:45px;
    font-weight:1000;
}

#weapon{
    position:absolute;
    right:20px;
    top:20px;
    text-align:right;
}

#weaponName{
    font-size:16px;
    font-weight:900;
}

#weaponInfo{
    font-size:11px;
    opacity:.55;
}

#fps{
    position:absolute;
    right:20px;
    bottom:18px;
    font-size:11px;
    opacity:.35;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="top">

        <div class="panel" id="healthBox">
            <div class="label">STICKMAN</div>
            <div id="healthBar">
                <div id="healthFill"></div>
            </div>
        </div>

        <div class="panel">
            <div class="label">COMBO</div>
            <div id="combo">x0</div>
        </div>

        <div class="panel">
            <div class="label">SCORE</div>
            <div id="score">0</div>
        </div>

        <div class="panel">
            <div class="label">WAVE</div>
            <div id="wave">1</div>
        </div>

    </div>

    <div id="weapon">
        <div id="weaponName">MAINS</div>
        <div id="weaponInfo">Aucun objet</div>
    </div>

    <div id="message"></div>

    <div id="crosshair"></div>

    <div id="damageOverlay"></div>

    <div id="help">
        <b>ZQSD / WASD</b> bouger ·
        <b>ESPACE</b> sauter ·
        <b>CLIC</b> frapper ·
        <b>E</b> prendre/lâcher ·
        <b>CLIC DROIT</b> lancer ·
        <b>R</b> reset ·
        <b>P</b> pause
    </div>

    <div id="fps">FPS: --</div>

    <div id="pause">
        <div>
            PAUSE
            <small style="display:block;font-size:14px;opacity:.5;margin-top:15px">
                Appuie sur P pour continuer
            </small>
        </div>
    </div>

</div>

<script>
"use strict";

/* =========================================================
   STICKMAN CHAOS ARENA
   CORE ENGINE
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = canvas.width = innerWidth * devicePixelRatio;
    H = canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

    W = innerWidth;
    H = innerHeight;
}

addEventListener("resize",resize);
resize();

/* =========================================================
   INPUT
   ========================================================= */

const keys = Object.create(null);

let mouse = {
    x:W/2,
    y:H/2,
    down:false,
    right:false
};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.key === " "){
        e.preventDefault();
    }

    if(e.key.toLowerCase()==="p"){
        togglePause();
    }

    if(e.key.toLowerCase()==="r"){
        resetGame();
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;

    const c=document.getElementById("crosshair");
    c.style.left=e.clientX+"px";
    c.style.top=e.clientY+"px";
});

canvas.addEventListener("mousedown",e=>{
    if(e.button===0) mouse.down=true;
    if(e.button===2) mouse.right=true;
});

canvas.addEventListener("mouseup",e=>{
    if(e.button===0) mouse.down=false;
    if(e.button===2) mouse.right=false;
});

canvas.addEventListener("contextmenu",e=>e.preventDefault());

/* =========================================================
   UTILS
   ========================================================= */

const TAU=Math.PI*2;

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
    return a+(b-a)*t;
}

function dist(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function rand(a,b){
    return Math.random()*(b-a)+a;
}

function choose(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function pointAt(x,y,angle,length){
    return {
        x:x+Math.cos(angle)*length,
        y:y+Math.sin(angle)*length
    };
}

/* =========================================================
   WORLD
   ========================================================= */

const world={
    gravity:1450,
    floor:H-90,
    left:-400,
    right:W+400
};

let camera={
    x:0,
    y:0,
    shake:0,
    zoom:1
};

let paused=false;
let time=0;
let dt=0;
let last=performance.now();

/* =========================================================
   PHYSICS BODY
   ========================================================= */

class Body{

    constructor(x,y,w,h,type="box"){

        this.x=x;
        this.y=y;

        this.vx=0;
        this.vy=0;

        this.ax=0;
        this.ay=0;

        this.w=w;
        this.h=h;

        this.mass=Math.max(.2,(w*h)/500);
        this.invMass=1/this.mass;

        this.rotation=0;
        this.angularVelocity=0;

        this.restitution=.25;
        this.friction=.82;

        this.gravityScale=1;

        this.type=type;

        this.static=false;
        this.held=false;
        this.dead=false;

        this.health=100;
        this.maxHealth=100;

        this.breakable=false;
        this.broken=false;

        this.color="#ddd";

        this.id=Math.random().toString(36).slice(2);
    }

    integrate(delta){

        if(this.static || this.held || this.dead) return;

        this.vx += this.ax*delta;
        this.vy += (this.ay + world.gravity*this.gravityScale)*delta;

        this.vx *= Math.pow(.995,delta*60);
        this.vy *= Math.pow(.999,delta*60);

        this.x += this.vx*delta;
        this.y += this.vy*delta;

        this.rotation += this.angularVelocity*delta;

        this.angularVelocity *= Math.pow(.985,delta*60);

        this.ax=0;
        this.ay=0;

        solveBodyWorld(this);
    }
}

/* =========================================================
   PLAYER
   ========================================================= */

const player={
    x:W/2,
    y:world.floor-90,

    vx:0,
    vy:0,

    width:34,
    height:78,

    speed:900,
    jump:650,

    health:100,
    maxHealth:100,

    grounded:false,

    facing:1,

    attackCooldown:0,
    attackTimer:0,

    invincible:0,

    held:null,

    combo:0,
    comboTimer:0,

    score:0
};

function playerHead(){
    return {
        x:player.x,
        y:player.y-47,
        r:12
    };
}

function playerCenter(){
    return {
        x:player.x,
        y:player.y
    };
}

/* =========================================================
   OBJECTS
   ========================================================= */

const objects=[];
const particles=[];
const sparks=[];
const shockwaves=[];
const texts=[];
const enemies=[];
const glassShards=[];

/* =========================================================
   SPAWN OBJECT
   ========================================================= */

function spawnObject(type,x=player.x+rand(-80,80),y=player.y-100){

    let o;

    if(type==="bottle"){

        o=new Body(x,y,13,42,"bottle");

        o.color="#80d9ff";
        o.mass=.7;
        o.restitution=.45;
        o.breakable=true;
        o.health=35;
        o.maxHealth=35;

    }

    else if(type==="knife"){

        o=new Body(x,y,8,55,"knife");

        o.color="#dfe5ec";
        o.mass=.6;
        o.restitution=.2;

    }

    else if(type==="box"){

        o=new Body(x,y,46,46,"box");

        o.color="#9b6b3d";
        o.mass=5;
        o.restitution=.15;
        o.breakable=true;
        o.health=90;
        o.maxHealth=90;

    }

    else if(type==="ball"){

        o=new Body(x,y,28,28,"ball");

        o.color="#f3f3f3";
        o.mass=1;
        o.restitution=.72;

    }

    else if(type==="metal"){

        o=new Body(x,y,55,28,"metal");

        o.color="#888";
        o.mass=12;
        o.restitution=.08;

    }

    else{

        o=new Body(x,y,35,35,"object");

        o.color="#bbb";
    }

    objects.push(o);

    return o;
}

/* =========================================================
   GLASS
   ========================================================= */

class Glass{

    constructor(x,y,w,h){

        this.x=x;
        this.y=y;

        this.w=w;
        this.h=h;

        this.health=60;

        this.cracks=0;

        this.broken=false;

        this.id=Math.random();
    }

    damage(amount){

        if(this.broken) return;

        this.health-=amount;

        this.cracks++;

        createGlassCrack(this);

        if(this.health<=0){
            breakGlass(this);
        }
    }
}

const glasses=[];

function createGlass(x,y,w,h){

    const g=new Glass(x,y,w,h);

    glasses.push(g);

    return g;
}

function createGlassCrack(g){

    for(let i=0;i<3;i++){

        particles.push({
            x:g.x+rand(-g.w/2,g.w/2),
            y:g.y+rand(-g.h/2,g.h/2),
            vx:rand(-120,120),
            vy:rand(-160,20),
            life:.25,
            maxLife:.25,
            size:rand(1,3),
            color:"rgba(220,245,255,.8)"
        });
    }
}

function breakGlass(g){

    if(g.broken) return;

    g.broken=true;

    camera.shake=Math.max(camera.shake,12);

    for(let i=0;i<35;i++){

        const a=rand(0,TAU);
        const s=rand(80,500);

        glassShards.push({
            x:g.x+rand(-g.w/2,g.w/2),
            y:g.y+rand(-g.h/2,g.h/2),
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            rot:rand(0,TAU),
            vr:rand(-8,8),
            size:rand(3,10),
            life:rand(2,5)
        });
    }

    createShockwave(g.x,g.y,90);

    showMessage("VERRE CASSÉ");
}

/* =========================================================
   PHYSICS WORLD
   ========================================================= */

function solveBodyWorld(o){

    const floor=world.floor;

    const bottom=o.y+o.h/2;

    if(bottom>floor){

        o.y=floor-o.h/2;

        if(Math.abs(o.vy)>100){

            impact(o,Math.abs(o.vy));
        }

        o.vy*=-o.restitution;
        o.vx*=.92;

        if(Math.abs(o.vy)<30){
            o.vy=0;
        }

        o.angularVelocity*=.8;
    }

    if(o.x-o.w/2 < world.left){
        o.x=world.left+o.w/2;
        o.vx=Math.abs(o.vx)*.5;
    }

    if(o.x+o.w/2 > world.right){
        o.x=world.right-o.w/2;
        o.vx=-Math.abs(o.vx)*.5;
    }
}

/* =========================================================
   IMPACT
   ========================================================= */

function impact(o,force){

    if(force<180) return;

    const power=clamp(force/900,0,2);

    camera.shake=Math.max(
        camera.shake,
        3+power*10
    );

    for(let i=0;i<Math.floor(4+power*8);i++){

        sparks.push({
            x:o.x+rand(-o.w/2,o.w/2),
            y:o.y+rand(-o.h/2,o.h/2),
            vx:rand(-250,250)*power,
            vy:rand(-250,50)*power,
            life:rand(.2,.5),
            maxLife:.5,
            size:rand(1,4)
        });
    }

    if(o.breakable && force>550){

        o.health-=force*.06;

        if(o.health<=0){

            if(o.type==="bottle"){
                breakBottle(o);
            }else{
                breakBox(o);
            }
        }
    }
}

/* =========================================================
   BOTTLE BREAK
   ========================================================= */

function breakBottle(o){

    if(o.broken) return;

    o.broken=true;
    o.dead=true;

    for(let i=0;i<15;i++){

        const a=rand(0,TAU);
        const s=rand(100,450);

        glassShards.push({
            x:o.x,
            y:o.y,
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            rot:rand(0,TAU),
            vr:rand(-10,10),
            size:rand(3,8),
            life:rand(1.5,3)
        });
    }

    createShockwave(o.x,o.y,60);

    showMessage("BOUM");

    player.score+=40;
}

function breakBox(o){

    if(o.broken) return;

    o.broken=true;
    o.dead=true;

    for(let i=0;i<18;i++){

        particles.push({
            x:o.x+rand(-o.w/2,o.w/2),
            y:o.y+rand(-o.h/2,o.h/2),
            vx:rand(-400,400),
            vy:rand(-500,100),
            life:rand(.5,1.5),
            maxLife:1.5,
            size:rand(3,9),
            color:"#9b6b3d"
        });
    }

    createShockwave(o.x,o.y,70);

    player.score+=30;
}

/* =========================================================
   SHOCKWAVE
   ========================================================= */

function createShockwave(x,y,r=80){

    shockwaves.push({
        x,
        y,
        r:5,
        max:r,
        life:.35,
        maxLife:.35
    });
}

/* =========================================================
   PARTICLES
   ========================================================= */

function updateParticles(delta){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.life-=delta;

        if(p.life<=0){
            particles.splice(i,1);
            continue;
        }

        p.vy+=world.gravity*.3*delta;

        p.x+=p.vx*delta;
        p.y+=p.vy*delta;

        p.vx*=.97;
        p.vy*=.97;
    }
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);

        ctx.fillStyle=p.color||"#fff";

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,TAU);
        ctx.fill();
    }

    ctx.globalAlpha=1;
}

function updateSparks(delta){

    for(let i=sparks.length-1;i>=0;i--){

        const s=sparks[i];

        s.life-=delta;

        if(s.life<=0){
            sparks.splice(i,1);
            continue;
        }

        s.vy+=world.gravity*.25*delta;

        s.x+=s.vx*delta;
        s.y+=s.vy*delta;

        s.vx*=.94;
        s.vy*=.94;
    }
}

function drawSparks(){

    ctx.lineWidth=2;

    for(const s of sparks){

        ctx.globalAlpha=clamp(s.life/s.maxLife,0,1);

        ctx.strokeStyle="#fff";

        ctx.beginPath();

        ctx.moveTo(s.x,s.y);

        ctx.lineTo(
            s.x-s.vx*.025,
            s.y-s.vy*.025
        );

        ctx.stroke();
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   GLASS SHARDS
   ========================================================= */

function updateGlassShards(delta){

    for(let i=glassShards.length-1;i>=0;i--){

        const s=glassShards[i];

        s.life-=delta;

        if(s.life<=0){
            glassShards.splice(i,1);
            continue;
        }

        s.vy+=world.gravity*delta;

        s.x+=s.vx*delta;
        s.y+=s.vy*delta;

        s.rot+=s.vr*delta;

        if(s.y>world.floor){

            s.y=world.floor;

            s.vy*=-.25;
            s.vx*=.8;
            s.vr*=.8;
        }

        s.vx*=.995;
    }
}

function drawGlassShards(){

    for(const s of glassShards){

        ctx.save();

        ctx.translate(s.x,s.y);
        ctx.rotate(s.rot);

        ctx.globalAlpha=clamp(s.life/1.5,0,1);

        ctx.fillStyle="rgba(180,230,255,.8)";

        ctx.beginPath();

        ctx.moveTo(-s.size,0);
        ctx.lineTo(s.size*.4,-s.size*.6);
        ctx.lineTo(s.size,s.size);
        ctx.closePath();

        ctx.fill();

        ctx.restore();
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   OBJECT UPDATE
   ========================================================= */

function updateObjects(delta){

    for(let i=objects.length-1;i>=0;i--){

        const o=objects[i];

        if(o.dead){

            if(player.held===o){
                player.held=null;
            }

            objects.splice(i,1);
            continue;
        }

        o.integrate(delta);

        if(o.held){

            o.x=player.x+player.facing*42;
            o.y=player.y-18;

            o.vx=player.vx;
            o.vy=player.vy;

            o.rotation=player.facing>0 ? 0 : Math.PI;
        }
    }
}

/* =========================================================
   DRAW OBJECT
   ========================================================= */

function drawObject(o){

    ctx.save();

    ctx.translate(o.x,o.y);
    ctx.rotate(o.rotation);

    if(o.type==="bottle"){

        ctx.fillStyle=o.color;

        ctx.fillRect(
            -o.w/2,
            -o.h/2+7,
            o.w,
            o.h-7
        );

        ctx.fillRect(
            -3,
            -o.h/2,
            6,
            9
        );

        ctx.strokeStyle="rgba(255,255,255,.5)";
        ctx.lineWidth=2;

        ctx.strokeRect(
            -o.w/2,
            -o.h/2+7,
            o.w,
            o.h-7
        );
    }

    else if(o.type==="knife"){

        ctx.fillStyle="#333";

        ctx.fillRect(
            -4,
            5,
            8,
            20
        );

        ctx.fillStyle="#e9edf2";

        ctx.beginPath();

        ctx.moveTo(-3,-27);
        ctx.lineTo(3,-27);
        ctx.lineTo(5,5);
        ctx.lineTo(-5,5);

        ctx.closePath();
        ctx.fill();
    }

    else if(o.type==="ball"){

        ctx.fillStyle=o.color;

        ctx.beginPath();
        ctx.arc(0,0,o.w/2,0,TAU);
        ctx.fill();

        ctx.strokeStyle="rgba(0,0,0,.2)";
        ctx.stroke();
    }

    else{

        ctx.fillStyle=o.color;

        ctx.fillRect(
            -o.w/2,
            -o.h/2,
            o.w,
            o.h
        );

        ctx.strokeStyle="rgba(255,255,255,.12)";
        ctx.strokeRect(
            -o.w/2,
            -o.h/2,
            o.w,
            o.h
        );
    }

    ctx.restore();
}

function drawObjects(){

    for(const o of objects){
        drawObject(o);
    }
}

/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(delta){

    if(player.invincible>0){
        player.invincible-=delta;
    }

    if(player.attackCooldown>0){
        player.attackCooldown-=delta;
    }

    if(player.attackTimer>0){
        player.attackTimer-=delta;
    }

    if(player.comboTimer>0){

        player.comboTimer-=delta;

        if(player.comboTimer<=0){
            player.combo=0;
        }
    }

    let dir=0;

    if(keys["a"] || keys["q"]){
        dir--;
    }

    if(keys["d"]){
        dir++;
    }

    if(dir!==0){

        player.vx=lerp(
            player.vx,
            dir*player.speed,
            1-Math.pow(.001,delta)
        );

        player.facing=dir;
    }
    else{

        player.vx*=Math.pow(.0005,delta);
    }

    player.vy+=world.gravity*delta;

    player.x+=player.vx*delta;
    player.y+=player.vy*delta;

    if(player.y>=world.floor-50){

        player.y=world.floor-50;

        player.vy=0;

        player.grounded=true;
    }
    else{
        player.grounded=false;
    }

    player.x=clamp(
        player.x,
        -300,
        world.right+300
    );

    if(keys[" "] && player.grounded){

        player.vy=-player.jump;
        player.grounded=false;
    }

    if(mouse.down){

        playerAttack();
    }

    if(keys["e"]){

        keys["e"]=false;

        togglePickup();
    }

    if(mouse.right){

        throwHeldObject();
    }
}

/* =========================================================
   PLAYER DRAW
   ========================================================= */

function drawStickman(x,y,scale=1,flip=1,attack=false){

    ctx.save();

    ctx.translate(x,y);
    ctx.scale(flip*scale,scale);

    ctx.strokeStyle="#fff";
    ctx.fillStyle="#fff";

    ctx.lineWidth=5;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    /* head */

    ctx.beginPath();
    ctx.arc(0,-48,12,0,TAU);
    ctx.stroke();

    /* body */

    ctx.beginPath();

    ctx.moveTo(0,-35);
    ctx.lineTo(0,0);

    ctx.stroke();

    /* legs */

    ctx.beginPath();

    ctx.moveTo(0,0);
    ctx.lineTo(-18,35);

    ctx.moveTo(0,0);
    ctx.lineTo(18,35);

    ctx.stroke();

    /* arms */

    ctx.beginPath();

    ctx.moveTo(0,-30);

    if(attack){

        ctx.lineTo(35,-12);

    }else{

        ctx.lineTo(-25,-5);
    }

    ctx.moveTo(0,-30);

    if(attack){

        ctx.lineTo(28,5);

    }else{

        ctx.lineTo(25,-5);
    }

    ctx.stroke();

    ctx.restore();
}

function drawPlayer(){

    drawStickman(
        player.x,
        player.y,
        1,
        player.facing,
        player.attackTimer>0
    );

    if(player.held){

        ctx.save();

        ctx.globalAlpha=.9;

        ctx.strokeStyle="rgba(255,255,255,.2)";

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            player.y-30
        );

        ctx.lineTo(
            player.held.x,
            player.held.y
        );

        ctx.stroke();

        ctx.restore();
    }
}

/* =========================================================
   ATTACK
   ========================================================= */

function playerAttack(){

    if(player.attackCooldown>0) return;

    player.attackCooldown=.24;
    player.attackTimer=.14;

    player.combo++;
    player.comboTimer=1.2;

    const reach=70;

    const hitX=
        player.x+
        player.facing*reach;

    let hitSomething=false;

    for(const e of enemies){

        if(e.dead) continue;

        const d=Math.hypot(
            e.x-hitX,
            e.y-player.y
        );

        if(d<65){

            damageEnemy(
                e,
                rand(12,22),
                player.facing*rand(350,600),
                rand(-250,-100)
            );

            hitSomething=true;
        }
    }

    for(const o of objects){

        if(o.dead || o.held) continue;

        const d=Math.hypot(
            o.x-hitX,
            o.y-player.y
        );

        if(d<65){

            o.vx+=player.facing*rand(400,750);
            o.vy-=rand(100,300);
            o.angularVelocity+=rand(-10,10);

            impact(o,Math.abs(o.vx));

            hitSomething=true;
        }
    }

    for(const g of glasses){

        if(g.broken) continue;

        if(
            Math.abs(g.x-hitX)<g.w/2+25 &&
            Math.abs(g.y-player.y)<g.h/2+50
        ){

            g.damage(25);

            hitSomething=true;
        }
    }

    if(hitSomething){

        createShockwave(
            hitX,
            player.y-25,
            45
        );

        player.score+=10;

        camera.shake=Math.max(
            camera.shake,
            5
        );
    }
}

/* =========================================================
   PICKUP
   ========================================================= */

function togglePickup(){

    if(player.held){

        player.held.held=false;
        player.held.vx=player.facing*400;
        player.held.vy=-120;
        player.held=null;

        return;
    }

    let nearest=null;
    let best=70;

    for(const o of objects){

        if(o.dead || o.held) continue;

        const d=dist(player,o);

        if(d<best){

            best=d;
            nearest=o;
        }
    }

    if(nearest){

        nearest.held=true;
        player.held=nearest;
    }
}

/* =========================================================
   THROW
   ========================================================= */

function throwHeldObject(){

    if(!player.held) return;

    const o=player.held;

    player.held=null;
    o.held=false;

    const angle=Math.atan2(
        mouse.y-player.y,
        mouse.x-player.x
    );

    const power=900;

    o.vx=Math.cos(angle)*power;
    o.vy=Math.sin(angle)*power;

    o.angularVelocity=rand(-15,15);

    camera.shake=5;
}

/* =========================================================
   ENEMY
   ========================================================= */

class Enemy{

    constructor(x,y){

        this.x=x;
        this.y=y;

        this.vx=0;
        this.vy=0;

        this.health=100;
        this.maxHealth=100;

        this.radius=20;

        this.speed=rand(130,220);

        this.attackCooldown=rand(.2,1);

        this.stun=0;

        this.dead=false;

        this.facing=1;

        this.flash=0;
    }

    update(delta){

        if(this.dead) return;

        if(this.flash>0){
            this.flash-=delta;
        }

        if(this.stun>0){

            this.stun-=delta;

            this.vy+=world.gravity*delta;

            this.x+=this.vx*delta;
            this.y+=this.vy*delta;

            this.vx*=.98;

            if(this.y>world.floor-45){

                this.y=world.floor-45;
                this.vy*=-.25;
            }

            return;
        }

        const dx=player.x-this.x;

        this.facing=dx>=0?1:-1;

        if(Math.abs(dx)>55){

            this.vx=lerp(
                this.vx,
                Math.sign(dx)*this.speed,
                delta*5
            );

        }else{

            this.vx*=.8;

            this.attackCooldown-=delta;

            if(this.attackCooldown<=0){

                this.attackCooldown=1.1;

                enemyAttack(this);
            }
        }

        this.vy+=world.gravity*delta;

        this.x+=this.vx*delta;
        this.y+=this.vy*delta;

        if(this.y>world.floor-45){

            this.y=world.floor-45;
            this.vy=0;
        }
    }

    draw(){

        if(this.dead) return;

        ctx.save();

        if(this.flash>0){
            ctx.globalAlpha=.65;
        }

        drawStickman(
            this.x,
            this.y,
            1,
            this.facing,
            false
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            this.x-22,
            this.y-78,
            44,
            4
        );

        ctx.fillStyle="#555";

        ctx.fillRect(
            this.x-22,
            this.y-78,
            44,
            4
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            this.x-22,
            this.y-78,
            44*(this.health/this.maxHealth),
            4
        );

        ctx.restore();
    }
}

function spawnEnemy(x=player.x+rand(-500,500)){

    x=clamp(x,-100,world.right+100);

    const e=new Enemy(
        x,
        world.floor-45
    );

    enemies.push(e);

    return e;
}

function enemyAttack(e){

    const d=dist(e,playerCenter());

    if(d>70) return;

    damagePlayer(
        rand(5,10),
        e.facing*250
    );
}

function damageEnemy(e,amount,vx,vy){

    if(e.dead) return;

    e.health-=amount;

    e.vx+=vx;
    e.vy+=vy;

    e.stun=.25;

    e.flash=.12;

    createShockwave(
        e.x,
        e.y-30,
        35
    );

    for(let i=0;i<8;i++){

        particles.push({
            x:e.x+rand(-15,15),
            y:e.y+rand(-50,20),
            vx:rand(-180,180),
            vy:rand(-250,30),
            life:.3,
            maxLife:.3,
            size:rand(2,5),
            color:"#fff"
        });
    }

    player.score+=15;

    if(e.health<=0){

        e.dead=true;

        e.vy=-500;

        e.vx*=1.5;

        player.score+=100;

        showMessage("KO");

        createShockwave(
            e.x,
            e.y-30,
            80
        );
    }
}

function damagePlayer(amount,knockback=0){

    if(player.invincible>0) return;

    player.health-=amount;

    player.invincible=.3;

    player.vx+=knockback;
    player.vy-=180;

    camera.shake=Math.max(
        camera.shake,
        10
    );

    document.getElementById("damageOverlay").style.opacity=".8";

    setTimeout(()=>{
        document.getElementById("damageOverlay").style.opacity="0";
    },120);

    if(player.health<=0){

        player.health=0;

        showMessage("K.O.");

        setTimeout(resetGame,900);
    }
}

/* =========================================================
   ENEMY UPDATE
   ========================================================= */

function updateEnemies(delta){

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        e.update(delta);

        if(e.dead){

            e.vy+=world.gravity*delta;

            e.x+=e.vx*delta;
            e.y+=e.vy*delta;

            e.vx*=.99;

            if(e.y>world.floor+250){

                enemies.splice(i,1);
            }
        }
    }
}

/* =========================================================
   SHOCKWAVES
   ========================================================= */

function updateShockwaves(delta){

    for(let i=shockwaves.length-1;i>=0;i--){

        const s=shockwaves[i];

        s.life-=delta;
        s.r=lerp(
            s.r,
            s.max,
            delta*10
        );

        if(s.life<=0){
            shockwaves.splice(i,1);
        }
    }
}

function drawShockwaves(){

    for(const s of shockwaves){

        ctx.save();

        ctx.globalAlpha=clamp(
            s.life/s.maxLife,
            0,
            1
        );

        ctx.strokeStyle="#fff";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            TAU
        );

        ctx.stroke();

        ctx.restore();
    }
}

/* =========================================================
   GLASS DRAW
   ========================================================= */

function drawGlasses(){

    for(const g of glasses){

        if(g.broken) continue;

        ctx.save();

        ctx.translate(g.x,g.y);

        ctx.fillStyle="rgba(130,210,255,.08)";
        ctx.fillRect(
            -g.w/2,
            -g.h/2,
            g.w,
            g.h
        );

        ctx.strokeStyle="rgba(170,230,255,.5)";
        ctx.lineWidth=2;

        ctx.strokeRect(
            -g.w/2,
            -g.h/2,
            g.w,
            g.h
        );

        for(let i=0;i<g.cracks;i++){

            const a=i*1.7;

            ctx.beginPath();

            ctx.moveTo(0,0);

            ctx.lineTo(
                Math.cos(a)*g.w*.45,
                Math.sin(a)*g.h*.45
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}

/* =========================================================
   ARENA
   ========================================================= */

function drawArena(){

    /* background */

    const gradient=ctx.createLinearGradient(
        0,0,0,H
    );

    gradient.addColorStop(0,"#090912");
    gradient.addColorStop(1,"#020204");

    ctx.fillStyle=gradient;

    ctx.fillRect(0,0,W,H);

    /* distant lines */

    ctx.strokeStyle="rgba(255,255,255,.035)";
    ctx.lineWidth=1;

    for(let x=-camera.x%80;x<W;x+=80){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();
    }

    /* floor */

    ctx.fillStyle="#111118";

    ctx.fillRect(
        -500,
        world.floor,
        W+1000,
        H-world.floor+500
    );

    ctx.strokeStyle="rgba(255,255,255,.12)";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(-500,world.floor);
    ctx.lineTo(W+500,world.floor);

    ctx.stroke();

    /* floor grid */

    ctx.strokeStyle="rgba(255,255,255,.025)";

    for(let x=-500;x<W+500;x+=70){

        ctx.beginPath();

        ctx.moveTo(x,world.floor);
        ctx.lineTo(x+80,H);

        ctx.stroke();
    }
}

/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(delta){

    const targetX=player.x-W/2;
    const targetY=player.y-H*.55;

    camera.x=lerp(
        camera.x,
        targetX,
        delta*5
    );

    camera.y=lerp(
        camera.y,
        targetY,
        delta*5
    );

    camera.shake=lerp(
        camera.shake,
        0,
        delta*8
    );
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.save();

    const sx=rand(
        -camera.shake,
        camera.shake
    );

    const sy=rand(
        -camera.shake,
        camera.shake
    );

    ctx.translate(
        -camera.x+sx,
        -camera.y+sy
    );

    drawArena();

    drawGlasses();

    drawObjects();

    drawGlassShards();

    for(const e of enemies){
        e.draw();
    }

    drawPlayer();

    drawParticles();
    drawSparks();
    drawShockwaves();

    ctx.restore();
}

/* =========================================================
   UI
   ========================================================= */

function updateUI(){

    document.getElementById("healthFill").style.width=
        clamp(player.health/player.maxHealth,0,1)*100+"%";

    document.getElementById("combo").textContent=
        "x"+player.combo;

    document.getElementById("score").textContent=
        Math.floor(player.score);

    document.getElementById("weaponName").textContent=
        player.held ?
        player.held.type.toUpperCase() :
        "MAINS";

    document.getElementById("weaponInfo").textContent=
        player.held ?
        "Objet tenu · Clic droit pour lancer" :
        "Aucun objet";

    document.getElementById("wave").textContent=
        wave.number;
}

/* =========================================================
   MESSAGE
   ========================================================= */

let messageTimer=0;

function showMessage(text){

    const el=document.getElementById("message");

    el.textContent=text;

    el.style.opacity="1";
    el.style.transform=
        "translate(-50%,-50%) scale(1)";

    messageTimer=.55;
}

function updateMessage(delta){

    if(messageTimer<=0) return;

    messageTimer-=delta;

    const el=document.getElementById("message");

    if(messageTimer<=0){

        el.style.opacity="0";

        el.style.transform=
            "translate(-50%,-50%) scale(.8)";
    }
}

/* =========================================================
   WAVE SYSTEM
   ========================================================= */

const wave={
    number:1,
    timer:0,
    delay:2,
    spawning:false
};

function startWave(){

    wave.spawning=true;

    const amount=
        2+
        Math.min(
            wave.number,
            8
        );

    for(let i=0;i<amount;i++){

        setTimeout(()=>{

            if(!paused){

                const side=
                    Math.random()<.5
                    ? -1
                    : 1;

                spawnEnemy(
                    player.x+
                    side*rand(350,650)
                );
            }

        },i*250);
    }

    showMessage(
        "VAGUE "+wave.number
    );
}

function updateWave(delta){

    const alive=enemies.some(e=>!e.dead);

    if(!alive){

        wave.timer+=delta;

        if(wave.timer>=wave.delay){

            wave.timer=0;
            wave.number++;

            startWave();
        }
    }
}

/* =========================================================
   INITIAL WORLD
   ========================================================= */

function buildWorld(){

    objects.length=0;
    glasses.length=0;
    enemies.length=0;

    player.x=W/2;
    player.y=world.floor-50;

    spawnObject(
        "bottle",
        player.x+140,
        world.floor-130
    );

    spawnObject(
        "box",
        player.x-160,
        world.floor-120
    );

    spawnObject(
        "ball",
        player.x+230,
        world.floor-80
    );

    spawnObject(
        "knife",
        player.x-240,
        world.floor-100
    );

    spawnObject(
        "metal",
        player.x+360,
        world.floor-110
    );

    createGlass(
        player.x+30,
        world.floor-160,
        150,
        190
    );

    createGlass(
        player.x+550,
        world.floor-150,
        120,
        170
    );

    startWave();
}

/* =========================================================
   RESET
   ========================================================= */

function resetGame(){

    player.x=W/2;
    player.y=world.floor-50;

    player.vx=0;
    player.vy=0;

    player.health=100;

    player.combo=0;
    player.comboTimer=0;

    player.held=null;

    player.score=0;

    wave.number=1;
    wave.timer=0;

    objects.length=0;
    glasses.length=0;
    enemies.length=0;
    particles.length=0;
    sparks.length=0;
    shockwaves.length=0;
    glassShards.length=0;

    buildWorld();

    showMessage("RESET");
}

/* =========================================================
   PAUSE
   ========================================================= */

function togglePause(){

    paused=!paused;

    document.getElementById("pause").style.display=
        paused ? "grid" : "none";
}

/* =========================================================
   MAIN UPDATE
   ========================================================= */

function update(delta){

    if(paused) return;

    time+=delta;

    updatePlayer(delta);
    updateObjects(delta);
    updateEnemies(delta);

    updateParticles(delta);
    updateSparks(delta);
    updateGlassShards(delta);
    updateShockwaves(delta);

    updateCamera(delta);
    updateWave(delta);
    updateMessage(delta);

    updateUI();
}

/* =========================================================
   LOOP
   ========================================================= */

let fpsFrames=0;
let fpsTimer=0;

function loop(now){

    dt=Math.min(
        .033,
        (now-last)/1000
    );

    last=now;

    update(dt);
    render();

    fpsFrames++;
    fpsTimer+=dt;

    if(fpsTimer>=1){

        document.getElementById("fps").textContent=
            "FPS: "+fpsFrames;

        fpsFrames=0;
        fpsTimer=0;
    }

    requestAnimationFrame(loop);
}

/* =========================================================
   START
   ========================================================= */

world.floor=H-90;

buildWorld();

requestAnimationFrame(loop);

class ChaosLimb{

    constructor(x,y,r,mass=.5){

        this.x=x;
        this.y=y;

        this.vx*=Math.pow(.998,delta*60);
        this.vy*=Math.pow(.999,delta*60);

        this.x+=this.vx*delta;

        this.fx=0;
        this.fy=0;

        if(this.y+this.r>world.floor){

/* =========================================================

class ChaosConstraint{

    constructor(a,b,length,stiffness=.9){

        this.a=a;
        this.b=b;

        this.length=length;

        this.stiffness=stiffness;

        this.broken=false;
    }

    solve(){

        if(this.broken) return;

        const dx=this.b.x-this.a.x;
        const dy=this.b.y-this.a.y;

        const d=Math.hypot(dx,dy)||.0001;

        const error=d-this.length;

        const nx=dx/d;
        const ny=dy/d;

        const totalInv=
            this.a.invMass+
            this.b.invMass;

        if(!totalInv) return;

        const correction=
            error*this.stiffness/totalInv;

        this.a.x+=nx*correction*this.a.invMass;
        this.a.y+=ny*correction*this.a.invMass;

        this.b.x-=nx*correction*this.b.invMass;
        this.b.y-=ny*correction*this.b.invMass;
    }
}

            rightHand,
            leftFoot,
            rightFoot
        ];

        this.head=head;
        this.chest=chest;
        this.pelvis=pelvis;

        this.leftHand=leftHand;
        this.rightHand=rightHand;

        this.leftFoot=leftFoot;
        this.rightFoot=rightFoot;

        this.constraints=[

            new ChaosConstraint(
                head,
                chest,
                34,
                .95
            ),

            new ChaosConstraint(
                chest,
                pelvis,
                36,
                .95
            ),

            new ChaosConstraint(
                chest,
                leftHand,
                38,
                .85
            ),

            new ChaosConstraint(
                chest,
                rightHand,
                38,
                .85
            ),

            new ChaosConstraint(
                pelvis,
                leftFoot,
                48,
                .9
            ),

            new ChaosConstraint(
                pelvis,
                rightFoot,
                48,
                .9
            )
        ];

        chaos2.ragdolls.push(this);
    }

    impulse(ix,iy){

        for(const p of this.parts){

            p.vx+=ix/p.mass;
            p.vy+=iy/p.mass;
        }
    }

    update(delta){

        if(this.dead) return;

        this.life-=delta;

        if(this.life<=0){

            this.dead=true;
            return;
        }

        for(const p of this.parts){
            p.integrate(delta);
        }

        for(let i=0;i<5;i++){

            for(const c of this.constraints){
                c.solve();
            }
        }

        this.collideObjects();
    }

    collideObjects(){

        for(const p of this.parts){

            for(const o of objects){

                if(o.dead) continue;

                const hw=o.w/2;
                const hh=o.h/2;

                const closestX=
                    clamp(
                        p.x,
                        o.x-hw,
                        o.x+hw
                    );

                const closestY=
                    clamp(
                        p.y,
                        o.y-hh,
                        o.y+hh
                    );

                const dx=p.x-closestX;
                const dy=p.y-closestY;

                const d=Math.hypot(dx,dy);

                if(d<p.r){

                    const n=
                        c2Normalize(
                            dx,
                            dy
                        );

                    const penetration=
                        p.r-d;

                    p.x+=n.x*penetration;
                    p.y+=n.y*penetration;

                    const relative=
                        Math.hypot(
                            p.vx-o.vx,
                            p.vy-o.vy
                        );

                    if(relative>180){

                        o.vx-=n.x*relative*.12;
                        o.vy-=n.y*relative*.12;

                        chaos2Impact(
                            p.x,
                            p.y,
                            n.x*relative,
                            n.y*relative
                        );

                        if(o.breakable){

                            o.health-=relative*.025;

                            if(o.health<=0){

                                if(o.type==="bottle"){
                                    breakBottle(o);
                                }else{
                                    breakBox(o);
                                }
                            }
                        }
                    }
                }
            }
        }
    }

    draw(){

        if(this.dead) return;

        ctx.save();

        ctx.strokeStyle="#fff";
        ctx.fillStyle="#fff";
        ctx.lineWidth=5;
        ctx.lineCap="round";

        const h=this.head;
        const c=this.chest;
        const p=this.pelvis;

        const lh=this.leftHand;
        const rh=this.rightHand;

        const lf=this.leftFoot;
        const rf=this.rightFoot;

        /* connections */

        const line=(a,b)=>{

            ctx.beginPath();
            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
            ctx.stroke();
        };

        line(h,c);
        line(c,p);

        line(c,lh);
        line(c,rh);

        line(p,lf);
        line(p,rf);

        /* head */

        ctx.beginPath();

        ctx.arc(
            h.x,
            h.y,
            h.r,
            0,
            TAU
        );

        ctx.stroke();

        /* joints */

        for(const part of this.parts){

            ctx.beginPath();

            ctx.arc(
                part.x,
                part.y,
                3,
                0,
                TAU
            );

            ctx.fill();
        }

        ctx.restore();
    }
}

/* =========================================================
   CREATE RAGDOLL
   ========================================================= */

function chaos2SpawnRagdoll(
    x=player.x,
    y=player.y-20
){

    const r=
        new ChaosRagdoll(
            x,
            y
        );

    r.impulse(
        rand(-150,150),
        rand(-300,-100)
    );

    return r;
}

/* =========================================================
   IMPACT ENGINE
   ========================================================= */

function chaos2Impact(
    x,
    y,
    vx,
    vy
){

    const speed=
        Math.hypot(vx,vy);

    if(speed<120) return;

    const power=
        clamp(
            speed/700,
            .1,
            3
        );

    camera.shake=
        Math.max(
            camera.shake,
            power*9
        );

    createShockwave(
        x,
        y,
        25+power*35
    );

    for(
        let i=0;
        i<Math.floor(4+power*7);
        i++
    ){

        const a=
            Math.atan2(vy,vx)+
            rand(-1.4,1.4);

        const s=
            rand(80,320)*power;

        sparks.push({

            x,
            y,

            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,

            life:rand(.15,.45),
            maxLife:.45,

            size:rand(1,3)
        });
    }

    chaos2.hitStop=
        Math.max(
            chaos2.hitStop,
            power*.018
        );
}

/* =========================================================
   RAGDOLL COLLISIONS WITH ENEMIES
   ========================================================= */

function chaos2RagdollEnemyCollision(r){

    for(const p of r.parts){

        for(const e of enemies){

            if(e.dead) continue;

            const dx=e.x-p.x;
            const dy=(e.y-30)-p.y;

            const d=Math.hypot(dx,dy);

            if(d<e.radius+p.r){

                const speed=
                    Math.hypot(
                        p.vx,
                        p.vy
                    );

                if(speed>100){

                    damageEnemy(
                        e,
                        clamp(
                            speed*.035,
                            2,
                            25
                        ),
                        p.vx*.7,
                        p.vy*.7
                    );

                    const n=
                        c2Normalize(
                            -dx,
                            -dy
                        );

                    p.vx+=n.x*speed*.4;
                    p.vy+=n.y*speed*.4;

                    chaos2Impact(
                        p.x,
                        p.y,
                        p.vx,
                        p.vy
                    );
                }
            }
        }
    }
}

/* =========================================================
   OBJECT TO ENEMY PHYSICS
   ========================================================= */

function chaos2ObjectEnemyCollision(){

    for(const o of objects){

        if(o.dead || o.held) continue;

        for(const e of enemies){

            if(e.dead) continue;

            const dx=o.x-e.x;
            const dy=o.y-(e.y-25);

            const d=
                Math.hypot(dx,dy);

            const radius=
                Math.max(
                    o.w,
                    o.h
                )*.5;

            if(d<radius+e.radius){

                const speed=
                    Math.hypot(
                        o.vx,
                        o.vy
                    );

                if(speed>150){

                    const damage=
                        clamp(
                            speed*.045*
                            chaos2.settings.objectDamage,
                            2,
                            40
                        );

                    damageEnemy(
                        e,
                        damage,
                        o.vx*.45,
                        o.vy*.45
                    );

                    const n=
                        c2Normalize(
                            -dx,
                            -dy
                        );

                    o.vx+=n.x*speed*.18;
                    o.vy+=n.y*speed*.18;

                    chaos2Impact(
                        o.x,
                        o.y,
                        o.vx,
                        o.vy
                    );
                }
            }
        }
    }
}

/* =========================================================
   OBJECT TO GLASS
   ========================================================= */

function chaos2ObjectGlassCollision(){

    for(const o of objects){

        if(o.dead || o.held) continue;

        for(const g of glasses){

            if(g.broken) continue;

            const inside=

                Math.abs(o.x-g.x)
                <
                g.w/2+o.w/2

                &&

                Math.abs(o.y-g.y)
                <
                g.h/2+o.h/2;

            if(inside){

                const speed=
                    Math.hypot(
                        o.vx,
                        o.vy
                    );

                if(speed>220){

                    g.damage(
                        speed*.025
                    );

                    o.vx*=.72;
                    o.vy*=.72;

                    chaos2Impact(
                        g.x,
                        g.y,
                        o.vx,
                        o.vy
                    );
                }
            }
        }
    }
}

/* =========================================================
   PLAYER TO OBJECT PHYSICS
   ========================================================= */

function chaos2PlayerObjectCollision(){

    const px=player.x;
    const py=player.y-20;

    for(const o of objects){

        if(o.dead || o.held) continue;

        const dx=o.x-px;
        const dy=o.y-py;

        const d=Math.hypot(dx,dy);

        const radius=
            Math.max(
                o.w,
                o.h
            )*.5+20;

        if(d<radius){

            const speed=
                Math.hypot(
                    player.vx,
                    player.vy
                );

            if(speed>250){

                const n=
                    c2Normalize(
                        dx,
                        dy
                    );

                o.vx+=n.x*
                    Math.abs(player.vx)*
                    .6;

                o.vy+=n.y*
                    Math.abs(player.vx)*
                    .25;

                impact(
                    o,
                    Math.abs(player.vx)
                );
            }
        }
    }
}

/* =========================================================
   SPECIAL PUNCH IMPACT
   ========================================================= */

function chaos2HeavyPunch(){

    if(player.attackTimer<=0) return;

    const px=
        player.x+
        player.facing*65;

    const py=
        player.y-25;

    for(const e of enemies){

        if(e.dead) continue;

        const d=
            Math.hypot(
                e.x-px,
                e.y-py
            );

        if(d<55){

            e.vx+=
                player.facing*
                850;

            e.vy-=350;

            e.stun=.4;

            chaos2Impact(
                e.x,
                e.y-25,
                e.vx,
                e.vy
            );
        }
    }
}

/* =========================================================
   COMBO EFFECTS
   ========================================================= */

function chaos2ComboEffects(){

    if(player.combo<=0) return;

    if(player.combo%5===0){

        camera.shake=
            Math.max(
                camera.shake,
                7
            );
    }
}

/* =========================================================
   FLOATING TEXT
   ========================================================= */

function chaos2Text(
    x,
    y,
    text
){

    chaos2.floatingTexts.push({

        x,
        y,

        vy:-45,

        life:.8,

        maxLife:.8,

        text
    });
}

function chaos2UpdateTexts(delta){

    for(
        let i=chaos2.floatingTexts.length-1;
        i>=0;
        i--
    ){

        const t=
            chaos2.floatingTexts[i];

        t.life-=delta;

        if(t.life<=0){

            chaos2.floatingTexts.splice(i,1);
            continue;
        }

        t.y+=t.vy*delta;
    }
}

function chaos2DrawTexts(){

    ctx.save();

    ctx.textAlign="center";
    ctx.font="bold 18px Arial";

    for(const t of chaos2.floatingTexts){

        ctx.globalAlpha=
            clamp(
                t.life/t.maxLife,
                0,
                1
            );

        ctx.fillStyle="#fff";

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );
    }

    ctx.restore();

    ctx.globalAlpha=1;
}

/* =========================================================
   RAGDOLL UPDATE
   ========================================================= */

function chaos2UpdateRagdolls(delta){

    for(
        let i=chaos2.ragdolls.length-1;
        i>=0;
        i--
    ){

        const r=
            chaos2.ragdolls[i];

        r.update(delta);

        chaos2RagdollEnemyCollision(r);

        if(r.dead){

            chaos2.ragdolls.splice(i,1);
        }
    }
}

function chaos2DrawRagdolls(){

    for(const r of chaos2.ragdolls){

        r.draw();
    }
}

/* =========================================================
   DEBRIS BURST
   ========================================================= */

function chaos2DebrisBurst(
    x,
    y,
    amount=15,
    power=350
){

    amount=
        Math.floor(
            amount*
            chaos2.settings.debrisAmount
        );

    for(let i=0;i<amount;i++){

        const a=rand(0,TAU);
        const s=rand(power*.25,power);

        particles.push({

            x:x+rand(-5,5),
            y:y+rand(-5,5),

            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,

            life:rand(.4,1.5),
            maxLife:1.5,

            size:rand(2,7),

            color:choose([
                "#fff",
                "#aaa",
                "#777",
                "#ddd"
            ])
        });
    }
}

/* =========================================================
   AREA DAMAGE
   ========================================================= */

function chaos2AreaForce(
    x,
    y,
    radius,
    force
){

    for(const o of objects){

        if(o.dead) continue;

        const dx=o.x-x;
        const dy=o.y-y;

        const d=Math.hypot(dx,dy);

        if(d<radius){

            const n=
                c2Normalize(
                    dx,
                    dy
                );

            const strength=
                (1-d/radius)*force;

            o.vx+=n.x*strength/o.mass;
            o.vy+=n.y*strength/o.mass;

            o.angularVelocity+=
                rand(-5,5);
        }
    }

    for(const e of enemies){

        if(e.dead) continue;

        const dx=e.x-x;
        const dy=e.y-y;

        const d=Math.hypot(dx,dy);

        if(d<radius){

            const n=
                c2Normalize(
                    dx,
                    dy
                );

            const strength=
                (1-d/radius)*force;

            damageEnemy(
                e,
                strength*.035,
                n.x*strength,
                n.y*strength
            );
        }
    }

    for(const r of chaos2.ragdolls){

        for(const p of r.parts){

            const dx=p.x-x;
            const dy=p.y-y;

            const d=Math.hypot(dx,dy);

            if(d<radius){

                const n=
                    c2Normalize(
                        dx,
                        dy
                    );

                const strength=
                    (1-d/radius)*force;

                p.vx+=
                    n.x*strength/
                    p.mass;

                p.vy+=
                    n.y*strength/
                    p.mass;
            }
        }
    }
}

/* =========================================================

class Destructible{

    constructor(x,y,w,h,type="crate"){

        this.x=x;
        this.y=y;

        this.w=w;
        this.h=h;

        this.type=type;

        this.health=100;
        this.maxHealth=100;

        this.vx=0;
        this.vy=0;

        this.rotation=0;
        this.angularVelocity=0;

        this.static=false;
        this.broken=false;

        this.mass=Math.max(
            .5,
            w*h/600
        );

        this.id=
            Math.random()
            .toString(36)
            .slice(2);
    }

    update(delta){

        if(this.static || this.broken)
            return;

        this.vy+=world.gravity*delta;

        this.x+=this.vx*delta;
        this.y+=this.vy*delta;

        this.rotation+=
            this.angularVelocity*delta;

        this.vx*=.992;
        this.angularVelocity*=.985;

        const bottom=
            this.y+
            this.h/2;

        if(bottom>world.floor){

            this.y=
                world.floor-
                this.h/2;

            if(Math.abs(this.vy)>180){

                chaos3Impact(
                    this.x,
                    this.y,
                    this.vx,
                    this.vy
                );
            }

            this.vy*=-.2;
            this.vx*=.85;
        }
    }

    damage(amount){

        if(this.broken)
            return;

        this.health-=amount;

        if(this.health<=0){

            this.destroy();
        }
    }

    destroy(){

        if(this.broken)
            return;

        this.broken=true;

        chaos3DestructionBurst(
            this.x,
            this.y,
            this.w,
            this.h
        );

        chaos3.destructionScore+=
            Math.floor(
                this.w*this.h/20
            );

        player.score+=
            Math.floor(
                this.w*this.h/20
            );

        camera.shake=
            Math.max(
                camera.shake,
                12
            );
    }
}

                    y
                );

                ctx.lineTo(
                    this.w/2,
                    y
                );

                ctx.stroke();
            }
        }

        else{

            ctx.fillStyle="#80552f";

            ctx.fillRect(
                -this.w/2,
                -this.h/2,
                this.w,
                this.h
            );

            ctx.strokeStyle="#b57c48";

            ctx.strokeRect(
                -this.w/2,
                -this.h/2,
                this.w,
                this.h
            );
        }

        ctx.restore();
    }
}

/* =========================================================
   DOOR
   ========================================================= */

class ChaosDoor{

    constructor(
        x,
        y,
        w=70,
        h=150
    ){

        this.x=x;
        this.y=y;

        this.w=w;
        this.h=h;

        this.health=180;

        this.open=0;
        this.targetOpen=0;

        this.broken=false;

        this.rotation=0;
    }

    damage(amount){

        if(this.broken)
            return;

        this.health-=amount;

        this.targetOpen=
            clamp(
                this.targetOpen+
                amount*.003,
                0,
                1
            );

        if(this.health<=0){

            this.break();
        }
    }

    break(){

        if(this.broken)
            return;

        this.broken=true;

        chaos3DestructionBurst(
            this.x,
            this.y,
            this.w,
            this.h
        );

        createShockwave(
            this.x,
            this.y,
            100
        );

        showMessage("PORTE DÉTRUITE");
    }

    update(delta){

        this.open=lerp(
            this.open,
            this.targetOpen,
            delta*5
        );
    }

    draw(){

        if(this.broken)
            return;

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            -this.open*.9
        );

        ctx.fillStyle="#27272e";

        ctx.fillRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        ctx.strokeStyle="#aaa";
        ctx.lineWidth=2;

        ctx.strokeRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        ctx.fillStyle="#999";

        ctx.beginPath();

        ctx.arc(
            this.w*.25,
            0,
            4,
            0,
            TAU
        );

        ctx.fill();

        ctx.restore();
    }
}

/* =========================================================
   DESTRUCTIBLE WINDOW
   ========================================================= */

class ChaosWindow{

    constructor(
        x,
        y,
        w,
        h
    ){

        this.x=x;
        this.y=y;

        this.w=w;
        this.h=h;

        this.health=100;
        this.maxHealth=100;

        this.cracks=0;

        this.broken=false;
    }

    damage(amount){

        if(this.broken)
            return;

        this.health-=amount;

        this.cracks++;

        for(let i=0;i<4;i++){

            particles.push({

                x:this.x+
                    rand(
                        -this.w/2,
                        this.w/2
                    ),

                y:this.y+
                    rand(
                        -this.h/2,
                        this.h/2
                    ),

                vx:rand(-200,200),
                vy:rand(-250,50),

                life:.35,
                maxLife:.35,

                size:rand(1,3),

                color:
                    "rgba(220,245,255,.8)"
            });
        }

        if(this.health<=0){

            this.break();
        }
    }

    break(){

        if(this.broken)
            return;

        this.broken=true;

        const amount=
            Math.floor(
                30+
                this.w*this.h/1500
            );

        for(let i=0;i<amount;i++){

            const a=rand(0,TAU);
            const s=rand(100,600);

            glassShards.push({

                x:this.x+
                    rand(
                        -this.w/2,
                        this.w/2
                    ),

                y:this.y+
                    rand(
                        -this.h/2,
                        this.h/2
                    ),

                vx:Math.cos(a)*s,
                vy:Math.sin(a)*s,

                rot:rand(0,TAU),
                vr:rand(-15,15),

                size:rand(3,10),

                life:rand(2,5)
            });
        }

        createShockwave(
            this.x,
            this.y,
            120
        );

        camera.shake=
            Math.max(
                camera.shake,
                15
            );

        player.score+=100;

        showMessage("VITRE EXPLOSÉE");
    }

    draw(){

        if(this.broken)
            return;

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.fillStyle=
            "rgba(100,210,255,.09)";

        ctx.fillRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        ctx.strokeStyle=
            "rgba(170,230,255,.7)";

        ctx.lineWidth=2;

        ctx.strokeRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        ctx.strokeStyle=
            "rgba(220,245,255,.55)";

        for(let i=0;i<this.cracks;i++){

            const a=
                i*1.73;

            ctx.beginPath();

            ctx.moveTo(0,0);

            ctx.lineTo(
                Math.cos(a)*
                this.w*.47,

                Math.sin(a)*
                this.h*.47
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}

/* =========================================================
   PLATFORM
   ========================================================= */

class ChaosPlatform{

    constructor(
        x,
        y,
        w,
        h=20
    ){

        this.x=x;
        this.y=y;

        this.w=w;
        this.h=h;

        this.baseX=x;
        this.baseY=y;

        this.time=rand(0,10);

        this.amplitude=rand(20,80);

        this.speed=rand(.5,1.4);

        this.horizontal=
            Math.random()<.5;
    }

    update(delta){

        this.time+=delta*this.speed;

        if(this.horizontal){

            this.x=
                this.baseX+
                Math.sin(this.time)*
                this.amplitude;

        }else{

            this.y=
                this.baseY+
                Math.sin(this.time)*
                this.amplitude;
        }
    }

    draw(){

        ctx.fillStyle="#262631";

        ctx.fillRect(
            this.x-this.w/2,
            this.y-this.h/2,
            this.w,
            this.h
        );

        ctx.strokeStyle=
            "rgba(255,255,255,.15)";

        ctx.strokeRect(
            this.x-this.w/2,
            this.y-this.h/2,
            this.w,
            this.h
        );
    }
}
