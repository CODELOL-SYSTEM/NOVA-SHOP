/* ============================================================
   MANNEQUIN PHYSIQUE
============================================================ */

class P9Dummy {

    constructor(x,y){

        this.x=x;
        this.y=y;

        this.vx=0;
        this.vy=0;

        this.rotation=0;

        this.health=100;

        this.active=true;

        this.parts=[
            {
                x:x,
                y:y-60,
                vx:0,
                vy:0,
                size:20
            },
            {
                x:x,
                y:y,
                vx:0,
                vy:0,
                size:25
            },
            {
                x:x-35,
                y:y,
                vx:0,
                vy:0,
                size:10
            },
            {
                x:x+35,
                y:y,
                vx:0,
                vy:0,
                size:10
            },
            {
                x:x-15,
                y:y+60,
                vx:0,
                vy:0,
                size:12
            },
            {
                x:x+15,
                y:y+60,
                vx:0,
                vy:0,
                size:12
            }
        ];
    }

    update(dt){

        for(const p of this.parts){

            p.vy+=
                gravity*
                dt;

            p.vx*=.99;
            p.vy*=.99;

            p.x+=
                p.vx*
                dt;

            p.y+=
                p.vy*
                dt;

            if(
                p.y>
                H-40
            ){

                p.y=
                    H-40;

                p.vy*=-.25;
                p.vx*=.9;
            }
        }

        this.solve(
            0,
            1,
            60
        );

        this.solve(
            1,
            2,
            38
        );

        this.solve(
            1,
            3,
            38
        );

        this.solve(
            1,
            4,
            62
        );

        this.solve(
            1,
            5,
            62
        );
    }

    solve(a,b,length){

        const A=this.parts[a];
        const B=this.parts[b];

        const dx=B.x-A.x;
        const dy=B.y-A.y;

        const d=
            Math.hypot(dx,dy)||1;

        const error=
            d-length;

        const nx=dx/d;
        const ny=dy/d;

        A.x+=
            nx*
            error*.5;

        A.y+=
            ny*
            error*.5;

        B.x-=
            nx*
            error*.5;

        B.y-=
            ny*
            error*.5;
    }

    hit(power){

        this.health-=
            Math.min(
                40,
                power*.025
            );

        this.parts.forEach(
            p=>{
                p.vx+=
                    rand(-power,power)*.02;

                p.vy-=
                    rand(0,power)*.02;
            }
        );

        if(
            this.health<=0
        ){

            this.active=false;

            p7AddScore(150);

            p7Shockwave(
                this.x,
                this.y,
                300
            );
        }
    }

    draw(){

        ctx.save();

        ctx.strokeStyle="#111";
        ctx.lineWidth=8;
        ctx.lineCap="round";

        const line=(a,b)=>{

            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );

            ctx.stroke();
        };

        line(
            this.parts[0],
            this.parts[1]
        );

        line(
            this.parts[1],
            this.parts[2]
        );

        line(
            this.parts[1],
            this.parts[3]
        );

        line(
            this.parts[1],
            this.parts[4]
        );

        line(
            this.parts[1],
            this.parts[5]
        );

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            this.parts[0].x,
            this.parts[0].y,
            14,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}

/* ============================================================
   MANNEQUINS / OBJETS
============================================================ */

function p9DummyCollision(){

    for(const dummy of p9.dummies){

        if(!dummy.active)continue;

        for(const o of objects){

            if(o.broken)continue;

            for(const part of dummy.parts){

                const dx=
                    o.x-part.x;

                const dy=
                    o.y-part.y;

                const d=
                    Math.hypot(dx,dy);

                if(
                    d<
                    Math.max(
                        o.w,
                        o.h
                    )+
                    20
                ){

                    const force=
                        Math.abs(o.vx)+
                        Math.abs(o.vy);

                    if(force>250){

                        dummy.hit(
                            force
                        );

                        part.vx+=
                            o.vx*.15;

                        part.vy+=
                            o.vy*.15;

                        p7AddScore(
                            Math.floor(
                                force/100
                            )
                        );

                        camera.shake=
                            Math.max(
                                camera.shake,
                                3
                            );
                    }
                }
            }
        }
    }
}
