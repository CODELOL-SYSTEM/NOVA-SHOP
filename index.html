<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STICK PHYSICS ARENA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#11151b}
#hud{
position:fixed;left:18px;top:18px;
color:white;background:rgba(0,0,0,.55);
border:1px solid #343943;border-radius:12px;
padding:12px 15px;font-size:14px;
backdrop-filter:blur(8px);
z-index:5
}
#hint{
position:fixed;left:50%;bottom:18px;
transform:translateX(-50%);
color:#ddd;background:rgba(0,0,0,.65);
padding:9px 15px;border-radius:10px;
font-size:13px;z-index:5
}
#damage{
position:fixed;inset:0;
pointer-events:none;
opacity:0;
background:
radial-gradient(ellipse at center,transparent 45%,rgba(180,0,0,.05) 63%,rgba(210,0,0,.28) 100%);
transition:opacity .08s;
z-index:4
}
#cross{
position:fixed;left:50%;top:50%;
width:8px;height:8px;
transform:translate(-50%,-50%);
border:1px solid rgba(255,255,255,.5);
border-radius:50%;pointer-events:none
}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="damage"></div>
<div id="cross"></div>

<div id="hud">
<b>STICK PHYSICS ARENA</b><br><br>
ZQSD / WASD : bouger<br>
ESPACE : sauter<br>
E : prendre / lâcher<br>
CLIC : frapper<br>
R : recommencer
</div>

<div id="hint">physique active • objets dynamiques • vitre destructible</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
 W=innerWidth;
 H=innerHeight;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="r")reset();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let mouse={x:W/2,y:H/2,down:false};
addEventListener("mousemove",e=>{
 mouse.x=e.clientX;
 mouse.y=e.clientY;
});
addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

const gravity=1450;
const floorY=H-105;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(ax,ay,bx,by){
 return Math.hypot(ax-bx,ay-by);
}
function rand(a,b){
 return a+Math.random()*(b-a);
}

class Particle{
 constructor(x,y,vx,vy,size,life,type="dust"){
  this.x=x;
  this.y=y;
  this.vx=vx;
  this.vy=vy;
  this.size=size;
  this.life=life;
  this.max=life;
  this.type=type;
 }
 update(dt){
  this.vy+=gravity*.45*dt;
  this.x+=this.vx*dt;
  this.y+=this.vy*dt;
  this.vx*=.985;
  this.vy*=.985;
  this.life-=dt;
 }
 draw(){
  let a=clamp(this.life/this.max,0,1);
  ctx.globalAlpha=a;
  ctx.fillStyle=this.type==="glass"?"#aeeaff":"#a9aeb8";
  ctx.fillRect(this.x,this.y,this.size,this.size);
  ctx.globalAlpha=1;
 }
}

let particles=[];

function burst(x,y,count,type="dust"){
 for(let i=0;i<count;i++){
  let a=Math.random()*Math.PI*2;
  let s=rand(80,600);
  particles.push(
   new Particle(
    x,y,
    Math.cos(a)*s,
    Math.sin(a)*s,
    rand(2,6),
    rand(.25,.8),
    type
   )
  );
 }
}

class Body{
 constructor(x,y,w,h,opt={}){
  this.x=x;
  this.y=y;
  this.w=w;
  this.h=h;
  this.vx=opt.vx||0;
  this.vy=opt.vy||0;
  this.mass=opt.mass||1;
  this.dynamic=opt.dynamic!==false;
  this.restitution=opt.restitution??.25;
  this.friction=opt.friction??.82;
  this.rotation=opt.rotation||0;
  this.spin=opt.spin||0;
  this.held=false;
  this.type=opt.type||"box";
  this.broken=false;
 }
 update(dt){
  if(!this.dynamic||this.held||this.broken)return;

  this.vy+=gravity*dt;
  this.x+=this.vx*dt;
  this.y+=this.vy*dt;
  this.rotation+=this.spin*dt;

  if(this.y+this.h/2>floorY){
   this.y=floorY-this.h/2;
   if(Math.abs(this.vy)>120){
    burst(this.x,this.y+this.h/2,4);
   }
   this.vy*=-this.restitution;
   this.vx*=this.friction;
   this.spin*=.75;
   if(Math.abs(this.vy)<25)this.vy=0;
  }

  if(this.x-this.w/2<0){
   this.x=this.w/2;
   this.vx=Math.abs(this.vx)*this.restitution;
  }

  if(this.x+this.w/2>W){
   this.x=W-this.w/2;
   this.vx=-Math.abs(this.vx)*this.restitution;
  }
 }
 draw(){
  if(this.broken)return;

  ctx.save();
  ctx.translate(this.x,this.y);
  ctx.rotate(this.rotation);

  if(this.type==="bottle"){
   ctx.fillStyle="#6fb5d1";
   ctx.strokeStyle="#d5f7ff";
   ctx.lineWidth=2;
   ctx.beginPath();
   ctx.roundRect(-this.w/2,-this.h/2,this.w,this.h,5);
   ctx.fill();
   ctx.stroke();
   ctx.fillStyle="#bcefff";
   ctx.fillRect(-5,-this.h/2-9,10,10);
  }
  else if(this.type==="knife"){
   ctx.fillStyle="#8d939b";
   ctx.beginPath();
   ctx.moveTo(-this.w/2,-4);
   ctx.lineTo(this.w/2,0);
   ctx.lineTo(-this.w/2,4);
   ctx.closePath();
   ctx.fill();

   ctx.fillStyle="#694531";
   ctx.fillRect(-this.w/2-15,-5,15,10);
  }
  else{
   ctx.fillStyle="#737984";
   ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);
   ctx.strokeStyle="#aeb4bd";
   ctx.strokeRect(-this.w/2,-this.h/2,this.w,this.h);
  }

  ctx.restore();
 }
}

class Glass{
 constructor(x,y,w,h){
  this.x=x;
  this.y=y;
  this.w=w;
  this.h=h;
  this.broken=false;
  this.health=100;
  this.cracks=[];
 }
 hit(power){
  if(this.broken)return;

  this.health-=power;

  let cx=rand(this.x-this.w/2,this.x+this.w/2);
  let cy=rand(this.y-this.h/2,this.y+this.h/2);

  this.cracks.push({x:cx,y:cy});

  if(power>15){
   burst(cx,cy,Math.floor(power/2),"glass");
  }

  if(this.health<=0){
   this.break();
  }
 }
 break(){
  if(this.broken)return;
  this.broken=true;
  burst(this.x,this.y,65,"glass");

  for(let i=0;i<18;i++){
   let shard=new Body(
    this.x+rand(-this.w/2,this.w/2),
    this.y+rand(-this.h/2,this.h/2),
    rand(5,16),
    rand(5,16),
    {
     mass:.2,
     restitution:.35,
     type:"box",
     vx:rand(-500,500),
     vy:rand(-600,100)
    }
   );
   objects.push(shard);
  }
 }
 draw(){
  if(this.broken)return;

  ctx.save();
  ctx.globalAlpha=.27;
  ctx.fillStyle="#8edfff";
  ctx.fillRect(
   this.x-this.w/2,
   this.y-this.h/2,
   this.w,
   this.h
  );

  ctx.globalAlpha=.65;
  ctx.strokeStyle="#bdefff";
  ctx.lineWidth=2;
  ctx.strokeRect(
   this.x-this.w/2,
   this.y-this.h/2,
   this.w,
   this.h
  );

  for(const c of this.cracks){
   ctx.beginPath();
   ctx.moveTo(c.x,c.y);
   for(let i=0;i<5;i++){
    ctx.lineTo(
     c.x+rand(-100,100),
     c.y+rand(-100,100)
    );
   }
   ctx.stroke();
  }

  ctx.restore();
 }
}

let objects=[];
let glasses=[];
let held=null;

const player={
 x:W*.28,
 y:floorY-70,
 vx:0,
 vy:0,
 r:25,
 health:100,
 grounded:false,
 facing:1,
 punch:0,
 cooldown:0
};

function createWorld(){
 objects=[];
 glasses=[];

 objects.push(
  new Body(W*.63,floorY-28,38,56,{
   dynamic:true,
   type:"bottle",
   mass:1
  })
 );

 objects.push(
  new Body(W*.72,floorY-18,70,35,{
   dynamic:true,
   type:"box",
   mass:2
  })
 );

 objects.push(
  new Body(W*.55,floorY-15,28,28,{
   dynamic:true,
   type:"knife",
   mass:.5
  })
 );

 glasses.push(
  new Glass(W*.78,floorY-205,220,250)
 );
}

function reset(){
 player.x=W*.28;
 player.y=floorY-70;
 player.vx=0;
 player.vy=0;
 player.health=100;
 player.grounded=false;
 player.punch=0;
 player.cooldown=0;
 held=null;
 particles=[];
 createWorld();
 document.getElementById("damage").style.opacity=0;
}
createWorld();

function playerPhysics(dt){
 let left=keys["q"]||keys["a"];
 let right=keys["d"];
 let jump=keys[" "]||keys["z"]||keys["w"];

 if(left){
  player.vx-=1200*dt;
  player.facing=-1;
 }
 if(right){
  player.vx+=1200*dt;
  player.facing=1;
 }

 player.vx*=Math.pow(.0005,dt);
 player.vx=clamp(player.vx,-420,420);

 if(jump&&player.grounded){
  player.vy=-650;
  player.grounded=false;
 }

 player.vy+=gravity*dt;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;

 if(player.y+player.r>floorY){
  player.y=floorY-player.r;
  player.vy=0;
  player.grounded=true;
 }

 player.x=clamp(player.x,30,W-30);

 if(player.cooldown>0)player.cooldown-=dt;
 if(player.punch>0)player.punch-=dt;
}

function rectHitCircle(o,cx,cy,r){
 let nx=clamp(cx,o.x-o.w/2,o.x+o.w/2);
 let ny=clamp(cy,o.y-o.h/2,o.y+o.h/2);
 return dist(cx,cy,nx,ny)<r;
}

function pickup(){
 if(held){
  held.held=false;
  held.x=player.x+player.facing*55;
  held.y=player.y;
  held.vx=player.vx+player.facing*200;
  held.vy=-100;
  held=null;
  return;
 }

 let nearest=null;
 let best=85;

 for(const o of objects){
  if(o.broken)continue;
  let d=dist(player.x,player.y,o.x,o.y);
  if(d<best){
   best=d;
   nearest=o;
  }
 }

 if(nearest){
  held=nearest;
  held.held=true;
 }
}

let lastE=false;
function controls(){
 let e=keys["e"];

 if(e&&!lastE){
  pickup();
 }
 lastE=e;
}

function updateHeld(){
 if(!held)return;

 held.x=player.x+player.facing*55;
 held.y=player.y-5;
 held.vx=player.vx;
 held.vy=player.vy;
 held.rotation=Math.atan2(
  mouse.y-held.y,
  mouse.x-held.x
 );
}

function attack(){
 if(!mouse.down)return;
 if(player.cooldown>0)return;

 player.cooldown=.42;
 player.punch=.18;

 let ax=player.x+player.facing*65;
 let ay=player.y-5;

 for(const g of glasses){
  if(g.broken)continue;
  if(dist(ax,ay,g.x,g.y)<190){
   g.hit(24);
  }
 }

 for(const o of objects){
  if(o===held||o.broken)continue;

  let d=dist(ax,ay,o.x,o.y);

  if(d<75){
   let force=held?850:500;
   o.vx+=player.facing*force/o.mass;
   o.vy-=180;
   o.spin+=rand(-8,8);

   if(o.type==="bottle"&&force>700){
    o.vy-=180;
   }
  }
 }
}

function playerDamage(amount){
 player.health=clamp(player.health-amount,0,100);

 let damage=document.getElementById("damage");
 damage.style.opacity=.7;

 setTimeout(()=>{
  damage.style.opacity=0;
 },100);

 if(player.health<=0){
  player.health=100;
  player.x=W*.28;
  player.y=floorY-70;
 }
}

function objectCollisions(){
 for(let i=0;i<objects.length;i++){
  for(let j=i+1;j<objects.length;j++){
   let a=objects[i];
   let b=objects[j];

   if(a.broken||b.broken||a.held||b.held)continue;

   let dx=b.x-a.x;
   let dy=b.y-a.y;

   let minX=(a.w+b.w)/2;
   let minY=(a.h+b.h)/2;

   if(Math.abs(dx)<minX&&Math.abs(dy)<minY){
    let overlapX=minX-Math.abs(dx);
    let overlapY=minY-Math.abs(dy);

    if(overlapX<overlapY){
     let dir=dx>=0?1:-1;
     a.x-=overlapX*.5*dir;
     b.x+=overlapX*.5*dir;

     let av=a.vx;
     a.vx=b.vx*a.restitution;
     b.vx=av*b.restitution;
    }else{
     let dir=dy>=0?1:-1;
     a.y-=overlapY*.5*dir;
     b.y+=overlapY*.5*dir;

     let av=a.vy;
     a.vy=b.vy*.25;
     b.vy=av*.25;
    }
   }
  }
 }
}

function playerObjectCollisions(){
 for(const o of objects){
  if(o.broken||o.held)continue;

  if(rectHitCircle(o,player.x,player.y,player.r)){
   let dx=player.x-o.x;

   if(Math.abs(dx)<90){
    player.x+=dx>0?4:-4;

    if(Math.abs(o.vx)>500){
     playerDamage(Math.min(15,Math.abs(o.vx)/80));
     player.vx+=o.vx*.12;
    }
   }
  }
 }

 for(const g of glasses){
  if(!g.broken&&rectHitCircle(
   {x:g.x,y:g.y,w:g.w,h:g.h},
   player.x,
   player.y,
   player.r
  )){
   g.hit(8);
  }
 }
}

function update(dt){
 controls();
 playerPhysics(dt);
 updateHeld();
 attack();

 for(const o of objects)o.update(dt);

 objectCollisions();
 playerObjectCollisions();

 for(let i=particles.length-1;i>=0;i--){
  particles[i].update(dt);
  if(particles[i].life<=0)particles.splice(i,1);
 }
}

function drawBackground(){
 let grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#10141c");
 grad.addColorStop(1,"#050608");

 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="rgba(255,255,255,.035)";
 ctx.lineWidth=1;

 for(let x=0;x<W;x+=45){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,H);
  ctx.stroke();
 }

 for(let y=0;y<H;y+=45){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }

 ctx.fillStyle="#1c2028";
 ctx.fillRect(0,floorY,W,H-floorY);

 ctx.strokeStyle="#4b515b";
 ctx.beginPath();
 ctx.moveTo(0,floorY);
 ctx.lineTo(W,floorY);
 ctx.stroke();
}

function drawPlayer(){
 ctx.save();

 let lean=clamp(player.vx/900,-.25,.25);
 ctx.translate(player.x,player.y);
 ctx.rotate(lean);

 ctx.strokeStyle="#f1f1f1";
 ctx.fillStyle="#f1f1f1";
 ctx.lineWidth=7;
 ctx.lineCap="round";

 ctx.beginPath();
 ctx.arc(0,-35,20,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.moveTo(0,-15);
 ctx.lineTo(0,38);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,0);
 ctx.lineTo(player.facing*35,-3);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,38);
 ctx.lineTo(-20,68);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,38);
 ctx.lineTo(22,68);
 ctx.stroke();

 if(player.punch>0){
  ctx.lineWidth=9;
  ctx.beginPath();
  ctx.moveTo(player.facing*10,-5);
  ctx.lineTo(player.facing*62,-10);
  ctx.stroke();
 }

 ctx.restore();
}

function drawHealth(){
 let x=20;
 let y=H-45;
 let width=250;

 ctx.fillStyle="rgba(0,0,0,.6)";
 ctx.fillRect(x,y,width,17);

 ctx.fillStyle="#ddd";
 ctx.fillRect(x,y,width*player.health/100,17);

 ctx.strokeStyle="#fff";
 ctx.strokeRect(x,y,width,17);

 ctx.fillStyle="#fff";
 ctx.font="12px Arial";
 ctx.fillText(
  "ENERGIE "+Math.round(player.health)+"%",
  x+8,y+13
 );
}

function draw(){
 drawBackground();

 for(const g of glasses)g.draw();
 for(const o of objects)o.draw();
 for(const p of particles)p.draw();

 drawPlayer();
 drawHealth();

 ctx.fillStyle="rgba(255,255,255,.55)";
 ctx.font="12px Arial";

 if(held){
  ctx.fillText(
   "OBJET EN MAIN",
   player.x-42,
   player.y-75
  );
 }
}

let previous=performance.now();

function loop(now){
 let dt=Math.min((now-previous)/1000,.033);
 previous=now;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>

<script>
/* Colle cette partie à la suite de la partie 1 */

/* =========================
   PHYSIQUE AVANCEE
========================= */

const PHYS={
 gravity:1450,
 air:0.995,
 ground:0.82,
 maxSpeed:900,
 impactThreshold:420
};

function physicsStep(o,dt){

 if(!o || o.broken || o.held)return;

 o.vy+=PHYS.gravity*dt;

 o.x+=o.vx*dt;
 o.y+=o.vy*dt;

 o.rotation+=o.spin*dt;

 o.vx*=Math.pow(PHYS.air,dt*60);
 o.spin*=Math.pow(.992,dt*60);

 if(o.y+o.h/2>=floorY){

  const impact=Math.abs(o.vy);

  o.y=floorY-o.h/2;

  if(impact>PHYS.impactThreshold){

   impactEffect(
    o.x,
    floorY,
    impact
   );

   if(o.type==="bottle"&&impact>650){
    breakBottle(o);
   }
  }

  o.vy=-o.vy*o.restitution;
  o.vx*=o.friction;

  if(Math.abs(o.vy)<30)o.vy=0;
 }

 if(o.x-o.w/2<0){
  o.x=o.w/2;
  o.vx=Math.abs(o.vx)*.45;
 }

 if(o.x+o.w/2>W){
  o.x=W-o.w/2;
  o.vx=-Math.abs(o.vx)*.45;
 }
}


/* =========================
   IMPACTS
========================= */

function impactEffect(x,y,power){

 const amount=Math.min(
  35,
  Math.floor(power/35)
 );

 for(let i=0;i<amount;i++){

  const a=Math.random()*Math.PI*2;
  const s=power*.25+Math.random()*power*.5;

  particles.push(
   new Particle(
    x,
    y,
    Math.cos(a)*s,
    Math.sin(a)*s*.45,
    Math.random()*4+2,
    .25+Math.random()*.45,
    "dust"
   )
  );
 }
}


/* =========================
   BOUTEILLE CASSABLE
========================= */

function breakBottle(o){

 if(o.broken)return;

 o.broken=true;

 burst(
  o.x,
  o.y,
  40,
  "glass"
 );

 for(let i=0;i<10;i++){

  const shard={
   x:o.x+rand(-10,10),
   y:o.y+rand(-20,20),
   vx:rand(-500,500),
   vy:rand(-600,50),
   rot:rand(0,6),
   spin:rand(-12,12),
   life:rand(1,2),
   size:rand(4,12)
  };

  glassShards.push(shard);
 }

 if(held===o){
  held=null;
 }

 spawnBottleSmoke(o.x,o.y);
}


/* =========================
   MORCEAUX DE VERRE
========================= */

const glassShards=[];

function updateGlassShards(dt){

 for(let i=glassShards.length-1;i>=0;i--){

  const s=glassShards[i];

  s.vy+=gravity*.75*dt;

  s.x+=s.vx*dt;
  s.y+=s.vy*dt;

  s.rot+=s.spin*dt;

  s.vx*=.985;

  if(s.y>floorY){
   s.y=floorY;
   s.vy*=-.25;
   s.vx*=.65;
   s.spin*=.7;
  }

  s.life-=dt;

  if(s.life<=0){
   glassShards.splice(i,1);
  }
 }
}

function drawGlassShards(){

 for(const s of glassShards){

  ctx.save();

  ctx.translate(s.x,s.y);
  ctx.rotate(s.rot);

  ctx.fillStyle="#b9f1ff";

  ctx.globalAlpha=
   Math.min(1,s.life);

  ctx.beginPath();

  ctx.moveTo(
   -s.size,
   -s.size*.5
  );

  ctx.lineTo(
   s.size,
   0
  );

  ctx.lineTo(
   -s.size*.2,
   s.size
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();
 }

 ctx.globalAlpha=1;
}


/* =========================
   FUMEE BOUTEILLE
========================= */

const smoke=[];

function spawnBottleSmoke(x,y){

 for(let i=0;i<18;i++){

  smoke.push({
   x:x+rand(-8,8),
   y:y+rand(-5,5),
   vx:rand(-40,40),
   vy:rand(-80,-20),
   size:rand(5,16),

function advancedObjectCollision(){

  if(a.broken||a.held)continue;

  for(let j=i+1;j<objects.length;j++){

   const b=objects[j];

   if(b.broken||b.held)continue;

   const dx=b.x-a.x;
   const dy=b.y-a.y;

   const ox=
    (a.w+b.w)/2-
    Math.abs(dx);

   const oy=
    (a.h+b.h)/2-
    Math.abs(dy);

   if(ox<=0||oy<=0)continue;

   if(ox<oy){

    const dir=dx>=0?1:-1;

    a.x-=ox*.5*dir;
    b.x+=ox*.5*dir;

    const av=a.vx;
    const bv=b.vx;

    a.vx=
     bv*a.restitution;

    b.vx=
     av*b.restitution;

    const relative=
     Math.abs(av-bv);

    if(relative>600){

     impactEffect(
      (a.x+b.x)/2,
      (a.y+b.y)/2,
      relative
     );

     if(
      a.type==="bottle"&&
      relative>900
     ){
      breakBottle(a);
     }

     if(
      b.type==="bottle"&&
      relative>900
     ){
      breakBottle(b);
     }
    }

   }else{

    const dir=dy>=0?1:-1;

    a.y-=oy*.5*dir;
    b.y+=oy*.5*dir;

    const av=a.vy;

    a.vy=b.vy*.3;
    b.vy=av*.3;
   }
  }
 }
}

function createRagdoll(x,y){

/* ============================================================
   CONTRAINTES
   ============================================================ */

function getPart(name){

    return ragdoll.parts.find(
        p=>p.name===name
    );
}

function solveConstraint(a,b,length){

    const dx=b.x-a.x;
    const dy=b.y-a.y;

    const d=Math.hypot(dx,dy);

    if(d===0)return;

    const error=d-length;

    const nx=dx/d;
    const ny=dy/d;

    const correction=error*.5;

    a.x+=nx*correction;
    a.y+=ny*correction;

    b.x-=nx*correction;
    b.y-=ny*correction;
}


function solveRagdoll(){

    if(!ragdoll.active)return;

    for(let iteration=0;iteration<5;iteration++){

        for(const c of ragdoll.constraints){

            const a=getPart(c[0]);
            const b=getPart(c[1]);

            if(a&&b){

                solveConstraint(
                    a,
                    b,
                    c[2]
                );
            }
        }
    }
}

function updateRagdoll(dt){

    for(const p of ragdoll.parts){

        if(

                    -1500,
                    1500
                );
        }
    }
}

                p.life=0;

}


/* ============================================================

            player.x,
            player.y,
            dx/d*900,
            dy/d*900,
            "ball"
        )
    );
}

</script><script>
/* ============================================================
   PARTIE 4
   ENVIRONNEMENT DESTRUCTIBLE
   MEUBLES
   PORTES
   VITRES MULTIPLES
   OBJETS PHYSIQUES
   PARTICULES
   ============================================================ */

const environment={
    furniture:[],
    doors:[],
    windows:[],
    debris:[]
};


/* ============================================================
   MEUBLE PHYSIQUE
   ============================================================ */

class Furniture{

    constructor(x,y,w,h,type="table"){

        this.x=x;
        this.y=y;
        this.w=w;
        this.h=h;

        this.vx=0;
        this.vy=0;

        this.angle=0;
        this.va=0;

        this.type=type;
        this.health=100;
        this.destroyed=false;

        this.mass=
            type==="table"
            ?8
            :type==="chair"
            ?4
            :12;
    }

    update(dt){

        if(this.destroyed)return;

        this.vy+=gravity*dt;

        this.x+=this.vx*dt;
        this.y+=this.vy*dt;

        this.angle+=this.va*dt;

        this.vx*=.992;
        this.va*=.985;

        if(
            this.y+
            this.h/2>
            floorY
        ){

            const impact=
                Math.abs(this.vy);

            this.y=
                floorY-
                this.h/2;

            if(impact>450){

                createImpactRing(
                    this.x,
                    floorY
                );

                impactEffect(
                    this.x,
                    floorY,
                    impact
                );
            }

            this.vy*=-.22;
            this.vx*=.82;
            this.va*=.7;

            if(Math.abs(this.vy)<25){
                this.vy=0;
            }
        }

        if(
            this.x-
            this.w/2<0
        ){

            this.x=
                this.w/2;

            this.vx=
                Math.abs(this.vx)*.35;
        }

        if(
            this.x+
            this.w/2>W
        ){

            this.x=
                W-
                this.w/2;

            this.vx=
                -Math.abs(this.vx)*.35;
        }
    }

    hit(force,dir=1){

        if(this.destroyed)return;

        this.health-=force;

        this.vx+=
            dir*
            force*
            3/
            this.mass;

        this.vy-=
            force*
            1.2;

        this.va+=
            rand(-8,8);

        burst(
            this.x,
            this.y,
            Math.min(
                15,
                Math.floor(force/4)
            ),
            "dust"
        );

        if(this.health<=0){

            this.destroy();
        }
    }

    destroy(){

        if(this.destroyed)return;

        this.destroyed=true;

        for(let i=0;i<12;i++){

            environment.debris.push({

                x:this.x+rand(-this.w/2,this.w/2),

                y:this.y+rand(-this.h/2,this.h/2),

                vx:rand(-500,500),

                vy:rand(-600,50),

                rotation:rand(0,6),

                spin:rand(-15,15),

                size:rand(5,18),

                life:rand(1,3)
            });
        }

        burst(
            this.x,
            this.y,
            35,
            "dust"
        );
    }

    draw(){

        if(this.destroyed)return;

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.angle
        );

        ctx.fillStyle=
            this.type==="table"
            ?"#59483a"
            :this.type==="chair"
            ?"#6b5440"
            :"#464b54";

        ctx.strokeStyle="#17191d";

        ctx.lineWidth=3;

        if(this.type==="table"){

            ctx.fillRect(
                -this.w/2,
                -this.h/2,
                this.w,
                this.h
            );

            ctx.fillRect(
                -this.w/2+8,
                this.h/2,
                10,
                55
            );

            ctx.fillRect(
                this.w/2-18,
                this.h/2,
                10,
                55
            );
        }

        else if(this.type==="chair"){

            ctx.fillRect(
                -this.w/2,
                -this.h/2,
                this.w,
                12
            );

            ctx.fillRect(
                -this.w/2,
                -this.h/2,
                12,
                this.h
            );

            ctx.fillRect(
                this.w/2-12,
                -this.h/2,
                12,
                this.h
            );

            ctx.fillRect(
                -this.w/2,
                this.h/2-12,
                this.w,
                12
            );
        }

        else{

            ctx.fillRect(
                -this.w/2,
                -this.h/2,
                this.w,
                this.h
            );
        }

        ctx.strokeRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        ctx.restore();
    }
}


/* ============================================================
   PORTE
   ============================================================ */

class Door{

    constructor(x,y,w,h){

        this.x=x;
        this.y=y;

        this.w=w;
        this.h=h;

        this.open=0;
        this.target=0;

        this.health=100;
        this.broken=false;
    }

    hit(force){

        if(this.broken)return;

        this.health-=force;

        this.target=
            clamp(
                this.target+
                force*.002,
                0,
                1
            );

        if(
            this.health<=0
        ){
            this.break();
        }
    }

    break(){

        this.broken=true;

        burst(
            this.x,
            this.y,
            30,
            "dust"
        );

        for(let i=0;i<8;i++){

            environment.debris.push({

                x:this.x+rand(-this.w/2,this.w/2),

                y:this.y+rand(-this.h/2,this.h/2),

                vx:rand(-500,500),

                vy:rand(-500,100),

                rotation:rand(0,6),

                spin:rand(-10,10),

                size:rand(8,20),

                life:rand(1,2.5)
            });
        }
    }

    update(dt){

        this.open+=
            (this.target-this.open)
            *dt*7;
    }

    draw(){

        if(this.broken)return;

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.fillStyle="#262a31";

        ctx.fillRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        ctx.strokeStyle="#727883";

        ctx.lineWidth=3;

        ctx.strokeRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        ctx.fillStyle="#aaa";

        ctx.beginPath();

        ctx.arc(
            this.w/2-15,
            0,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* ============================================================
   VITRE ENVIRONNEMENTALE
   ============================================================ */

class DestructibleWindow{

    constructor(x,y,w,h){

        this.x=x;
        this.y=y;

        this.w=w;
        this.h=h;

        this.health=100;
        this.broken=false;

        this.cracks=[];
    }

    hit(force,x=this.x,y=this.y){

        if(this.broken)return;

        this.health-=force;

        this.cracks.push({
            x:x,
            y:y
        });

        burst(
            x,
            y,
            Math.min(
                20,
                Math.floor(force/2)
            ),
            "glass"
        );

        if(
            this.health<=0
        ){
            this.break();
        }
    }

    break(){

        if(this.broken)return;

        this.broken=true;

        for(let i=0;i<45;i++){

            environment.debris.push({

                x:this.x+
                    rand(-this.w/2,this.w/2),

                y:this.y+
                    rand(-this.h/2,this.h/2),

                vx:rand(-750,750),

                vy:rand(-800,200),

                rotation:rand(0,6),

                spin:rand(-18,18),

                size:rand(3,10),

                life:rand(.5,2.5),

                glass:true
            });
        }

        createImpactRing(
            this.x,
            this.y
        );
    }

    draw(){

        if(this.broken)return;

        ctx.save();

        ctx.fillStyle=
            "rgba(130,220,255,.18)";

        ctx.fillRect(
            this.x-this.w/2,
            this.y-this.h/2,
            this.w,
            this.h
        );

        ctx.strokeStyle=
            "rgba(180,240,255,.75)";

        ctx.lineWidth=2;

        ctx.strokeRect(
            this.x-this.w/2,
            this.y-this.h/2,
            this.w,
            this.h
        );

        for(const c of this.cracks){

            ctx.beginPath();

            ctx.moveTo(
                c.x,
                c.y
            );

            for(let i=0;i<7;i++){

                ctx.lineTo(
                    c.x+
                    rand(-80,80),

                    c.y+
                    rand(-80,80)
                );
            }

            ctx.stroke();
        }

        ctx.restore();
    }
}


/* ============================================================
   DEBRIS UPDATE
   ============================================================ */

function updateEnvironmentDebris(dt){

    for(
        let i=environment.debris.length-1;
        i>=0;
        i--
    ){

        const d=
            environment.debris[i];

        d.vy+=gravity*.7*dt;

        d.x+=d.vx*dt;
        d.y+=d.vy*dt;

        d.rotation+=
            d.spin*dt;

        d.vx*=.985;
        d.spin*=.98;

        if(
            d.y+d.size/2>
            floorY
        ){

            const impact=
                Math.abs(d.vy);

            d.y=
                floorY-
                d.size/2;

            d.vy*=-.25;
            d.vx*=.65;
            d.spin*=.7;

            if(impact>400){

                createImpactRing(
                    d.x,
                    d.y
                );
            }
        }

        d.life-=dt;

        if(d.life<=0){

            environment.debris.splice(
                i,
                1
            );
        }
    }
}


/* ============================================================
   DEBRIS DRAW
   ============================================================ */

function drawEnvironmentDebris(){

    for(const d of environment.debris){

        ctx.save();

        ctx.translate(
            d.x,
            d.y
        );

        ctx.rotate(
            d.rotation
        );

        ctx.globalAlpha=
            clamp(
                d.life,
                0,
                1
            );

        if(d.glass){

            ctx.fillStyle="#b7edff";

            ctx.beginPath();

            ctx.moveTo(
                -d.size,
                0
            );

            ctx.lineTo(
                d.size,
                -d.size*.5
            );

            ctx.lineTo(
                d.size*.25,
                d.size
            );

            ctx.closePath();

            ctx.fill();
        }

        else{

            ctx.fillStyle="#777";

            ctx.fillRect(
                -d.size/2,
                -d.size/2,
                d.size,
                d.size
            );
        }

        ctx.restore();
    }

    ctx.globalAlpha=1;
}


/* ============================================================
   CREATION ENVIRONNEMENT
   ============================================================ */

function createEnvironment(){

    environment.furniture=[];
    environment.doors=[];
    environment.windows=[];
    environment.debris=[];

    environment.furniture.push(

        new Furniture(
            W*.32,
            floorY-45,
            150,

            "table"
        ),

        new Furniture(

            floorY-35,

/* ============================================================
   ENV UPDATE
   ============================================================ */

function updateEnvironment(dt){

    for(
        const f of environment.furniture
    ){

        f.update(dt);
    }

    for(
        const d of environment.doors
    ){

        d.update(dt);
    }

    updateEnvironmentDebris(dt);
}


/* ============================================================
   ENV DRAW
   ============================================================ */

function drawEnvironment(){

    for(
        const w of environment.windows
    ){

        w.draw();
    }

    for(
        const d of environment.doors
    ){

        d.draw();
    }

    for(
        const f of environment.furniture
    ){

        f.draw();
    }

    drawEnvironmentDebris();
}


/* ============================================================
   COLLISION JOUEUR / MEUBLES
   ============================================================ */

function collidePlayerFurniture(){

    for(
        const f of environment.furniture
    ){

        if(f.destroyed)continue;

        const dx=
            player.x-f.x;

        const dy=
            player.y-f.y;

        const px=
            f.w/2+
            player.r-
            Math.abs(dx);

        const py=
            f.h/2+
            player.r-
            Math.abs(dy);

        if(px>0&&py>0){

            if(px<py){

                const dir=
                    dx>=0?1:-1;

                player.x+=
                    px*dir;

                player.vx*=.55;
            }

            else{

                const dir=
                    dy>=0?1:-1;

                player.y+=
                    py*dir;

                if(dir<0){

                    player.vy=0;
                    player.grounded=true;
                }
            }
        }
    }
}


/* ============================================================
   FRAPPE MEUBLES
   ============================================================ */

function hitEnvironment(){

    if(player.punch<=0)return;

    const dir=
        player.facing;

    const x=
        player.x+
        dir*70;

    const y=
        player.y;

    for(
        const f of environment.furniture
    ){

        if(f.destroyed)continue;

        if(
            Math.abs(x-f.x)<
            f.w/2+50&&
            Math.abs(y-f.y)<
            f.h/2+60
        ){

            f.hit(
                28,
                dir
            );

            createImpactRing(
                x,
                y
            );
        }
    }

    for(
        const d of environment.doors
    ){

        if(d.broken)continue;

        if(
            Math.abs(x-d.x)<
            d.w/2+60&&
            Math.abs(y-d.y)<
            d.h/2
        ){

            d.hit(30);

            createImpactRing(
                x,
                y
            );
        }
    }

    for(
        const w of environment.windows
    ){

        if(w.broken)continue;

        if(
            Math.abs(x-w.x)<
            w.w/2+60&&
            Math.abs(y-w.y)<
            w.h/2+60
        ){

            w.hit(
                32,
                x,
                y
            );

            screenDamage(.05);
        }
    }
}


/* ============================================================
   OBJETS QUI FRAPPENT LES VITRES
   ============================================================ */

function environmentObjectGlassCollision(){

    for(
        const o of objects
    ){

        if(o.broken||o.held)continue;

        const speed=
            Math.hypot(
                o.vx,
                o.vy
            );

        if(speed<300)continue;

        for(
            const w of environment.windows
        ){

            if(w.broken)continue;

            if(
                Math.abs(o.x-w.x)<
                w.w/2+o.w/2&&

                Math.abs(o.y-w.y)<
                w.h/2+o.h/2
            ){

                w.hit(
                    Math.min(
                        80,
                        speed/8
                    ),
                    o.x,
                    o.y
                );

                o.vx*=.55;
                o.vy*=.55;

                impactEffect(
                    o.x,
                    o.y,
                    speed
                );

                if(
                    w.broken
                ){

                    burst(
                        o.x,
                        o.y,
                        30,
                        "glass"
                    );
                }
            }
        }
    }
}


/* ============================================================
   TOUCHES ENVIRONNEMENT
   ============================================================ */

let oldT=false;

function environmentControls(){

    const t=keys["t"];

    if(
        t&&!oldT
    ){

        environment.furniture.push(
            new Furniture(
                player.x+100,
                100,
                100,
                40,
                "table"
            )
        );
    }

    oldT=t;
}

const updatePart4Base=update;

update=function(dt){

    updateEnvironment(dt);

    collidePlayerFurniture();

    hitEnvironment();

    environmentObjectGlassCollision();

/* ============================================================

const drawPart4Base=draw;

draw=function(){

const resetPart4Base=reset;

   ============================================================ */

function drawEnvironmentHUD(){

    ctx.save();

    ctx.fillStyle=
        "rgba(0,0,0,.55)";

    ctx.fillRect(
        W-220,
        18,
        200,
        75
    );

    ctx.fillStyle="#fff";

    ctx.font="12px Arial";

    ctx.fillText(
        "ENVIRONNEMENT DESTRUCTIBLE",
        W-205,
        40
    );

    ctx.fillText(
        "T : SPAWN MEUBLE",
        W-205,
        61
    );

    ctx.fillText(
        "VITRES : IMPACT PHYSIQUE",
        W-205,
        81
    );

    ctx.restore();
}


const drawPart4HUD=draw;

draw=function(){

    drawPart4HUD();

    drawEnvironmentHUD();

/* ============================================================

class Enemy{
 constructor(x,y){

  this.stun=0

 }

 update(dt){

  if(this.dead)return

  if(this.cooldown>0)this.cooldown-=dt
  if(this.hitTimer>0)this.hitTimer-=dt
  if(this.stun>0)this.stun-=dt

  const dx=player.x-this.x
  const distance=Math.abs(dx)

  this.facing=dx>=0?1:-1

  if(this.stun<=0){

   if(distance>110){

    this.state="chase"

    this.vx+=this.facing*500*dt

    this.vx=clamp(
     this.vx,
     -260,
     260
    )

   }else{

    this.state="attack"

    this.vx*=.85

    if(this.cooldown<=0){

     this.attack()

     this.cooldown=1.05
    }
   }
  }else{

   this.state="stunned"

   this.vx*=.96
  }

  this.vy+=gravity*dt

  this.x+=this.vx*dt
  this.y+=this.vy*dt

  this.vx*=.985

  if(this.y+this.h/2>=floorY){

   this.y=floorY-this.h/2

   if(Math.abs(this.vy)>300){

    impactEffect(
     this.x,
     floorY,
     Math.abs(this.vy)
    )
   }

   this.vy*=-.2

   if(Math.abs(this.vy)<20){
    this.vy=0
   }
  }

  this.x=clamp(
   this.x,
   30,
   W-30
  )
 }

 attack(){

  const dx=
   player.x-this.x

  const dy=
   player.y-this.y

  if(
   Math.abs(dx)<105&&
   Math.abs(dy)<100
  ){

   const direction=
    dx>=0?1:-1

   player.vx+=
    direction*280

   player.vy-=130

   screenDamage(.28)

   createImpactRing(
    player.x,
    player.y
   )

   burst(
    player.x,
    player.y,
    12,
    "dust"
   )
  }
 }

 hit(force,direction){

  if(this.dead)return

  this.health-=force

  this.stun=
   Math.min(
    1.8,
    force/35
   )

  this.vx+=
   direction*
   force*
   7

  this.vy-=
   force*
   4

  createImpactRing(
   this.x,
   this.y
  )

  burst(
   this.x,
   this.y,
   Math.min(
    30,
    Math.floor(force/2)
   ),
   "dust"
  )

  if(this.health<=0){
   this.die()
  }
 }

 die(){

  this.dead=true

  createRagdoll(
   this.x,
   this.y
  )

  ragdoll.parts.forEach(
   p=>{
    p.vx+=
     rand(-500,500)

    p.vy+=
     rand(-600,-150)

    p.va+=
     rand(-12,12)
   }
  )

  burst(
   this.x,
   this.y,
   40,
   "dust"
  )
 }

 draw(){

  if(this.dead)return

  ctx.save()

  ctx.translate(
   this.x,
   this.y
  )

  ctx.scale(
   this.facing,
   1
  )

  ctx.strokeStyle=
   this.stun>0
   ?"rgba(255,255,255,.6)"
   :"#cfcfcf"

  ctx.fillStyle=
   this.stun>0
   ?"rgba(255,255,255,.35)"
   :"#cfcfcf"

  ctx.lineWidth=7
  ctx.lineCap="round"

  ctx.beginPath()

  ctx.arc(
   0,
   -50,
   19,
   0,
   Math.PI*2
  )

  ctx.fill()

  ctx.beginPath()

  ctx.moveTo(
   0,
   -30
  )

  ctx.lineTo(
   0,
   25
  )

  ctx.stroke()

  ctx.beginPath()

  ctx.moveTo(
   0,
   -15
  )

  ctx.lineTo(
   35,
   this.state==="attack"
   ?-5
   :10
  )

  ctx.stroke()

  ctx.beginPath()

  ctx.moveTo(
   0,
   -15
  )

  ctx.lineTo(
   -35,
   10
  )

  ctx.stroke()

  ctx.beginPath()

  ctx.moveTo(
   0,
   25
  )

  ctx.lineTo(
   -20,
   65
  )

  ctx.stroke()

  ctx.beginPath()

  ctx.moveTo(
   0,
   25
  )

  ctx.lineTo(
   22,
   65
  )

  ctx.stroke()

  ctx.restore()

  drawEnemyBar(this)
 }
}

function enemyObjectCollision(){

 for(const enemy of enemies){

  if(enemy.dead)continue

  for(const o of objects){

   if(
    o.broken||
    o.held
   )continue

   const dx=
    enemy.x-o.x

   const dy=
    enemy.y-o.y

   const distance=
    Math.hypot(
     dx,
     dy
    )

   if(
    distance<
    65+
    Math.max(
     o.w,
     o.h
    )/2
   ){

    const speed=
     Math.hypot(
      o.vx,
      o.vy
     )

    if(speed>250){

     const direction=
      o.vx>=0
      ?1
      :-1

     enemy.hit(
      Math.min(
       65,
       speed/12
      ),
      direction
     )

     o.vx*=.55
     o.vy*=.45

     if(
      o.type==="bottle"&&
      speed>650
     ){
      breakBottle(o)
     }
    }
   }
  }
 }
}

function enemyPunchCollision(){

 if(player.punch<=0)return

 const direction=
  player.facing

 const px=
  player.x+
  direction*70

 const py=

 for(const enemy of enemies){

/* ============================================================
   ENNEMIS SUR VITRE
============================================================ */

function enemyGlassCollision(){

 for(const enemy of enemies){

  if(enemy.dead)continue

  const speed=
   Math.hypot(
    enemy.vx,
    enemy.vy
   )

  if(speed<350)continue

  for(
   const window
   of environment.windows
  ){

   if(window.broken)continue

   if(
    Math.abs(
     enemy.x-window.x
    )<
    window.w/2+25
    &&
    Math.abs(
     enemy.y-window.y
    )<
    window.h/2+45
   ){

    window.hit(
     Math.min(
      100,
      speed/8
     ),
     enemy.x,
     enemy.y
    )

    enemy.vx*=.45

    enemy.stun=.35

    impactEffect(
     enemy.x,
     enemy.y,
     speed
    )
   }
  }
 }
}


/* ============================================================
   ENNEMI VS MEUBLES
============================================================ */

function enemyFurnitureCollision(){

 for(const enemy of enemies){

  if(enemy.dead)continue

  for(
   const furniture
   of environment.furniture
  ){

   if(furniture.destroyed)continue

   const dx=
    enemy.x-
    furniture.x

   const dy=
    enemy.y-
    furniture.y

   if(
    Math.abs(dx)<
    furniture.w/2+25
    &&
    Math.abs(dy)<
    furniture.h/2+50
   ){

    const speed=
     Math.abs(
      enemy.vx
     )

    if(speed>180){

     furniture.hit(
      speed*.05,
      enemy.facing
     )
    }

    enemy.vx*=-.35
   }
  }
 }
}

   STICKMAN PHYSICS ARENA

const p7={
    ragdolls:[],

/* ============================================================
   UTILITAIRES
============================================================ */

function p7Clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function p7Dist(a,b,c,d){
    return Math.hypot(c-a,d-b);
}

function p7Point(x,y,vx,vy){
    return {
        x,y,vx,vy,
        rotation:0,
        spin:0,
        life:999
    };
}


/* ============================================================
   SCORE
============================================================ */

function p7AddScore(value){

    p7.score+=Math.max(1,Math.floor(value));

    p7.combo++;
    p7.comboTimer=2.5;
}

function p7UpdateScore(dt){

    if(p7.comboTimer>0){

        p7.comboTimer-=dt;

        if(p7.comboTimer<=0){
            p7.combo=0;
        }
    }
}


/* ============================================================
   MULTI RAGDOLL
============================================================ */

class P7Ragdoll{

    constructor(x,y){

        this.x=x;
        this.y=y;

        this.parts=[];

        this.gravity=gravity;

        this.create();
    }

    create(){

        const add=(x,y,w,h,mass)=>{
            const part={
                x,y,
                px:x,
                py:y,
                vx:0,
                vy:0,
                w,
                h,
                mass,
                rotation:0,
                spin:0,
                active:true
            };

            this.parts.push(part);

            return part;
        };

        this.head=
            add(this.x,this.y-80,24,24,1);

        this.body=
            add(this.x,this.y-25,30,55,2);

        this.leftArm=
            add(this.x-38,this.y-20,48,12,1);

        this.rightArm=
            add(this.x+38,this.y-20,48,12,1);

        this.leftLeg=
            add(this.x-16,this.y+45,12,65,1.4);

        this.rightLeg=
            add(this.x+16,this.y+45,12,65,1.4);
    }

    update(dt){

        for(const p of this.parts){

            if(!p.active)continue;

            p.vy+=
                this.gravity*dt;

            p.vx*=.995;
            p.vy*=.995;

            p.x+=p.vx*dt;
            p.y+=p.vy*dt;

            p.rotation+=p.spin*dt;

            const floorY=H-45;

            if(p.y+p.h/2>floorY){

                p.y=floorY-p.h/2;

                if(p.vy>0){
                    p.vy*=-.28;
                }

                p.vx*=.86;
                p.spin*=.85;
            }
        }

        this.solve(
            this.head,
            this.body,
            55
        );

        this.solve(
            this.body,
            this.leftArm,
            43
        );

        this.solve(
            this.body,
            this.rightArm,
            43
        );

        this.solve(
            this.body,
            this.leftLeg,
            55
        );

        this.solve(
            this.body,
            this.rightLeg,
            55
        );
    }

    solve(a,b,length){

        const dx=b.x-a.x;
        const dy=b.y-a.y;

        const d=Math.hypot(dx,dy);

        if(!d)return;

        const error=d-length;

        const nx=dx/d;
        const ny=dy/d;

        const correction=
            error*.5;

        a.x+=nx*correction;
        a.y+=ny*correction;

        b.x-=nx*correction;
        b.y-=ny*correction;
    }

    draw(){

        ctx.save();

        ctx.lineCap="round";

        ctx.strokeStyle="#111";
        ctx.lineWidth=7;

        const line=(a,b)=>{

            ctx.beginPath();
            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
            ctx.stroke();
        };

        line(
            this.head,
            this.body
        );

        line(
            this.body,
            this.leftArm
        );

        line(
            this.body,
            this.rightArm
        );

        line(
            this.body,
            this.leftLeg
        );

        line(
            this.body,
            this.rightLeg
        );

        ctx.fillStyle="#111";

        ctx.beginPath();
        ctx.arc(
            this.head.x,
            this.head.y,
            13,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.restore();
    }
}


function p7SpawnRagdoll(x,y){

/* ============================================================
   CORDE
============================================================ */

class P7Rope{

    constructor(a,b){

        this.a=a;
        this.b=b;

        this.points=[];

        const dx=b.x-a.x;
        const dy=b.y-a.y;

        const d=Math.hypot(dx,dy);

        const count=
            Math.max(
                5,
                Math.floor(d/35)
            );

        for(let i=0;i<count;i++){

            const t=
                i/(count-1);

            this.points.push({
                x:a.x+dx*t,
                y:a.y+dy*t,
                px:a.x+dx*t,
                py:a.y+dy*t,
                vx:0,
                vy:0
            });
        }
    }

    update(dt){

        for(let i=1;i<this.points.length-1;i++){

            const p=this.points[i];

            p.vy+=gravity*dt;

            p.vx*=.995;
            p.vy*=.995;

            p.x+=p.vx*dt;
            p.y+=p.vy*dt;
        }

        for(let iteration=0;iteration<4;iteration++){

            for(let i=0;i<this.points.length-1;i++){

                const a=this.points[i];
                const b=this.points[i+1];

                const dx=b.x-a.x;
                const dy=b.y-a.y;

                const d=Math.hypot(dx,dy);

                if(!d)continue;

                const wanted=30;

                const error=d-wanted;

                const nx=dx/d;
                const ny=dy/d;

                if(i!==0){

                    a.x+=nx*error*.5;
                    a.y+=ny*error*.5;
                }

                if(i+1!==this.points.length-1){

                    b.x-=nx*error*.5;
                    b.y-=ny*error*.5;
                }
            }
        }
    }

    draw(){

        ctx.save();

        ctx.strokeStyle="#555";
        ctx.lineWidth=5;

        ctx.beginPath();

        for(let i=0;i<this.points.length;i++){

            const p=this.points[i];

            if(i===0){
                ctx.moveTo(p.x,p.y);
            }else{
                ctx.lineTo(p.x,p.y);
            }
        }

        ctx.stroke();

        ctx.restore();
    }
}

function p7Shockwave(x,y,power){

    p7.shockwaves.push({

        life:.7
    });

    camera.shake=

function p7UpdateShockwaves(dt){

    for(
        let i=p7.shockwaves.length-1;
        i>=0;
        i--
    ){

        const s=p7.shockwaves[i];

        s.radius+=
            s.max*2.5*dt;

        s.life-=dt;

        for(const o of objects){

            if(o.broken)continue;

            const d=
                p7Dist(
                    s.x,
                    s.y,
                    o.x,
                    o.y
                );

            if(
                d<s.radius+100&&
                d>s.radius-100
            ){

                const dx=o.x-s.x;
                const dy=o.y-s.y;

                const len=
                    Math.hypot(dx,dy)||1;

                const force=
                    s.max/
                    Math.max(30,len);

                o.vx+=
                    dx/len*
                    force*100;

                o.vy+=
                    dy/len*
                    force*100;

                o.spin+=
                    rand(-8,8);
            }
        }

        if(s.life<=0){

            p7.shockwaves.splice(i,1);
        }
    }
}


function p7DrawShockwaves(){

    for(const s of p7.shockwaves){

        ctx.save();

        ctx.globalAlpha=
            p7Clamp(
                s.life/.7,

        ctx.strokeStyle="#aaa";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.radius,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();
    }
}


/* ============================================================
   DEBRIS
============================================================ */

function p7CreateDebris(x,y,count=20){

    for(let i=0;i<count;i++){

        const a=
            Math.random()*
            Math.PI*2;

        const speed=
            rand(
                100,
                600
            );

        p7.debris.push({

            x,
            y,

            vy:
                Math.sin(a)*speed-rand(0,250),

            size:
                rand(3,10),

            rotation:
                rand(0,6),

            spin:
                rand(-10,10),

            life:
                rand(1,3)
        });
    }
}


function p7UpdateDebris(dt){

    for(
        let i=p7.debris.length-1;
        i>=0;
        i--
    ){

        const d=p7.debris[i];

        d.vy+=
            gravity*.7*dt;

        d.vx*=.985;
        d.vy*=.985;

        d.x+=d.vx*dt;
        d.y+=d.vy*dt;

        d.rotation+=
            d.spin*dt;

        if(
            d.y+d.size>
            H-30
        ){

            d.y=
                H-30-d.size;

            d.vy*=-.25;
            d.vx*=.8;
        }

        d.life-=dt;

        if(d.life<=0){

            p7.debris.splice(i,1);
        }
    }

    if(p7.debris.length>700){

        p7.debris.splice(
            0,

        );

        ctx.translate(

        ctx.rotate(

        ctx.fillRect(
            -d.size/2,
            -d.size/2,

/* ============================================================
   EXPLOSION VISUELLE
============================================================ */

function p7Explosion(x,y,power=500){

    p7Shockwave(
        x,
        y,
        power
    );

    p7CreateDebris(
        x,
        y,
        Math.min(
            100,
            Math.floor(power/5)
        )
    );

    p7.explosions.push({
        x,
        y,
        radius:10,
        max:power*.5,
        life:.5
    });

    for(const o of objects){

        if(o.broken)continue;

        const dx=o.x-x;
        const dy=o.y-y;

        const d=
            Math.hypot(dx,dy)||1;

        if(d<power){

            const force=
                (1-d/power)*power;

            o.vx+=
                dx/d*
                force;

            o.vy+=
                dy/d*
                force;

            o.spin+=
                rand(-15,15);
        }
    }

    for(const e of enemies){

        if(e.dead)continue;

        const dx=e.x-x;
        const dy=e.y-y;

        const d=
            Math.hypot(dx,dy)||1;

        if(d<power){

            e.vx+=
                dx/d*
                power*.9;

            e.vy+=
                dy/d*
                power*.9;

            e.health-=
                Math.floor(
                    (1-d/power)*35
                );

            if(e.health<=0){
                e.die();
            }
        }
    }

    flashImpact(power);
}

/* ============================================================
   COLLISION OBJET / RAGDOLL
============================================================ */

function p7ObjectRagdollCollision(){

    for(const r of p7.ragdolls){

        for(const part of r.parts){

            for(const o of objects){

                if(o.broken)continue;

                const dx=
                    o.x-part.x;

                const dy=
                    o.y-part.y;

                const d=
                    Math.hypot(dx,dy);

                const range=
                    Math.max(
                        o.w,
                        o.h
                    )*.6+30;

                if(
                    d<range
                ){

                    const len=d||1;

                    const force=
                        Math.min(
                            1000,
                            Math.abs(o.vx)+
                            Math.abs(o.vy)
                        );

                    part.vx+=
                        dx/len*
                        force*.01;

                    part.vy+=
                        dy/len*
                        force*.01;

                    if(force>400){

                        p7AddScore(
                            Math.floor(
                                force/100
                            )
                        );
                    }
                }
            }
        }
    }
}

/* ============================================================
   STICKMAN PHYSICS ARENA
   PARTIE 8
   PHYSIQUE AVANCEE + VEHICULES + PLATEFORMES

const p8 = {
    vehicles: [],
    springs: [],

};


/* ============================================================
   VEHICULE PHYSIQUE
============================================================ */

class P8Vehicle {

    constructor(x,y){

        this.x=x;
        this.y=y;

        this.vx=0;
        this.vy=0;

        this.angle=0;
        this.angularVelocity=0;

        this.width=150;
        this.height=45;

        this.mass=8;

        this.wheelRadius=18;

        this.wheels=[
            {
                x:-48,
                y:28,
                rotation:0,
                speed:0
            },
            {
                x:48,
                y:28,
                rotation:0,
                speed:0
            }
        ];

        this.controlled=false;
    }


    update(dt){

        const acceleration=
            keys["d"] ? 900 :
            keys["q"] ? -900 :
            0;

        const reverse=
            keys["a"] ? -700 :
            keys["e"] ? 700 :
            0;

        this.vx+=
            (acceleration+reverse)*
            dt;

        this.vx*=.985;

        this.vy+=
            gravity*
            dt;

        this.x+=
            this.vx*
            dt;

        this.y+=
            this.vy*
            dt;

        if(
            this.y+
            this.height/2>
            H-50
        ){

            this.y=
                H-50-
                this.height/2;

            if(this.vy>0){

                this.vy*=-.25;
            }

            this.vx*=.97;
        }

        for(const wheel of this.wheels){

            wheel.rotation+=
                this.vx*
                dt/
                this.wheelRadius;
        }

        this.angularVelocity*=.98;

        this.angle+=
            this.angularVelocity*
            dt;

        this.x=
            p7Clamp(
                this.x,
                -3000,
                3000
            );
    }


    draw(){

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.angle
        );

        ctx.fillStyle="#24282d";

        ctx.fillRect(
            -this.width/2,
            -this.height/2,
            this.width,
            this.height
        );

        ctx.fillStyle="#5d6670";

        ctx.fillRect(
            -55,
            -38,
            70,
            30
        );

        ctx.fillStyle="#15171a";

        for(const wheel of this.wheels){

            ctx.save();

            ctx.translate(
                wheel.x,
                wheel.y
            );

            ctx.rotate(
                wheel.rotation
            );

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                this.wheelRadius,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#9ba2a8";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                7,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.restore();
        }

        ctx.restore();
    }
}

/* ============================================================
   RESSORT
============================================================ */

class P8Spring {

    constructor(a,b,restLength=100){

        this.a=a;
        this.b=b;

        this.restLength=
            restLength;

        this.strength=900;
        this.damping=8;
    }

    update(dt){

        const dx=
            this.b.x-
            this.a.x;

        const dy=
            this.b.y-
            this.a.y;

        const distance=
            Math.hypot(dx,dy);

        if(distance<.001)return;

        const nx=
            dx/distance;

        const ny=
            dy/distance;

        const force=
            (
                distance-
                this.restLength
            )*
            this.strength;

        const relVX=
            this.b.vx-
            this.a.vx;

        const relVY=
            this.b.vy-
            this.a.vy;

        const damping=
            (
                relVX*nx+
                relVY*ny
            )*
            this.damping;

        const finalForce=
            force+damping;

        if(this.a.mass){

            this.a.vx+=
                nx*
                finalForce/
                this.a.mass*
                dt;

            this.a.vy+=
                ny*
                finalForce/
                this.a.mass*
                dt;
        }

        if(this.b.mass){

            this.b.vx-=
                nx*
                finalForce/
                this.b.mass*
                dt;

            this.b.vy-=
                ny*
                finalForce/
                this.b.mass*
                dt;
        }
    }

    draw(){

        ctx.save();

        ctx.strokeStyle="#666";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            this.a.x,
            this.a.y
        );

        ctx.lineTo(
            this.b.x,
            this.b.y
        );

        ctx.stroke();

        ctx.restore();
    }
}


/* ============================================================
   AIMANT
============================================================ */

class P8Magnet {

    constructor(x,y){

        this.x=x;
        this.y=y;

        this.radius=260;

        this.strength=900;

        this.active=true;
    }

    update(dt){

        if(!this.active)return;

        for(const o of objects){

            if(o.broken)continue;

            const dx=
                this.x-o.x;

            const dy=
                this.y-o.y;

            const distance=
                Math.hypot(dx,dy);

            if(
                distance<
                this.radius &&
                distance>10
            ){

                const force=
                    this.strength/
                    Math.max(
                        40,
                        distance
                    );

                o.vx+=
                    dx/distance*
                    force*
                    dt;

                o.vy+=
                    dy/distance*
                    force*
                    dt;
            }
        }
    }

    draw(){

        if(!this.active)return;

        ctx.save();

        ctx.strokeStyle=
            "rgba(255,255,255,.15)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.fillStyle="#ddd";

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            9,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* ============================================================
   PLATEFORMES MOBILES
============================================================ */

class P8Platform {

    constructor(x,y,w,h){

        this.x=x;
        this.y=y;

        this.baseX=x;
        this.baseY=y;

        this.w=w;
        this.h=h;

        this.time=
            Math.random()*
            Math.PI*2;

        this.speed=
            rand(.5,1.5);

        this.distance=
            rand(50,150);
    }

    update(dt){

        this.time+=
            this.speed*
            dt;

        this.x=
            this.baseX+
            Math.sin(
                this.time
            )*
            this.distance;

        this.y=
            this.baseY+
            Math.cos(
                this.time*.7
            )*
            40;
    }

    draw(){

        ctx.save();

        ctx.fillStyle="#353b42";

        ctx.fillRect(
            this.x,
            this.y,
            this.w,
            this.h
        );

        ctx.strokeStyle="#888";

        ctx.strokeRect(
            this.x,
            this.y,
            this.w,
            this.h
        );

        ctx.restore();
    }
}

/* ============================================================
   COLLISION PLATEFORME
============================================================ */

function p8PlatformCollision(){

    for(const platform of p8.platforms){

        for(const o of objects){

            if(o.broken)continue;

            const bottom=
                o.y+
                o.h/2;

            const left=
                o.x-
                o.w/2;

            const right=
                o.x+
                o.w/2;

            if(
                bottom>=platform.y &&
                bottom<=platform.y+30 &&
                right>=platform.x &&
                left<=platform.x+platform.w &&
                o.vy>=0
            ){

                o.y=
                    platform.y-
                    o.h/2;

                o.vy*=-.25;

                o.vx*=.96;
            }
        }
    }
}


/* ============================================================
   VEHICULE / OBJETS
============================================================ */

function p8VehicleCollision(){

    for(const vehicle of p8.vehicles){

        for(const o of objects){

            if(o.broken)continue;

            const dx=
                o.x-
                vehicle.x;

            const dy=
                o.y-
                vehicle.y;

            const distance=
                Math.hypot(dx,dy);

            if(
                distance<
                110
            ){

                const len=
                    distance||1;

                const force=
                    Math.abs(
                        vehicle.vx
                    )+
                    Math.abs(
                        vehicle.vy
                    );

                o.vx+=
                    dx/len*
                    force*.35;

                o.vy+=
                    dy/len*
                    force*.35;

                vehicle.vx-=
                    dx/len*
                    force*.08;

                vehicle.angularVelocity+=
                    rand(-2,2);

                if(force>400){

                    p7Shockwave(
                        o.x,
                        o.y,
                        Math.min(
                            500,
                            force
                        )
                    );

                    p7AddScore(
                        Math.floor(
                            force/30
                        )
                    );
                }
            }
        }
    }
}

    combo: 0,

/* ============================================================
   GRAPPIN
============================================================ */

class P9Hook {

    constructor(x,y,targetX,targetY){

        this.x=x;
        this.y=y;

        this.targetX=targetX;
        this.targetY=targetY;

        this.active=true;

        this.speed=1700;

        this.length=0;

        this.maxLength=1200;

        this.hit=false;
    }

    update(dt){

        if(!this.active)return;

        const dx=
            this.targetX-this.x;

        const dy=
            this.targetY-this.y;

        const distance=
            Math.hypot(dx,dy)||1;

        this.x+=
            dx/distance*
            this.speed*
            dt;

        this.y+=
            dy/distance*
            this.speed*
            dt;

        this.length+=
            this.speed*
            dt;

        for(const o of objects){

            if(o.broken)continue;

            if(
                Math.hypot(
                    o.x-this.x,
                    o.y-this.y
                )<45
            ){

                this.attach(o);

                break;
            }
        }

        if(
            this.length>
            this.maxLength
        ){

            this.active=false;
        }
    }

    attach(o){

        this.attached=o;
        this.hit=true;
    }

    draw(){

        if(!this.active)return;

        ctx.save();

        ctx.strokeStyle="#777";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            player.y-45
        );

        ctx.lineTo(
            this.x,
            this.y
        );

        ctx.stroke();

        ctx.fillStyle="#ddd";

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* ============================================================
   TIR GRAPPIN
============================================================ */

function p9ShootHook(){

    const worldX=
        mouse.x;

    const worldY=
        mouse.y;

    p9.hooks.push(
        new P9Hook(
            player.x,
            player.y-45,
            worldX,
            worldY
        )
    );
}


/* ============================================================
   UPDATE GRAPPINS
============================================================ */

function p9UpdateHooks(dt){

    for(
        let i=p9.hooks.length-1;
        i>=0;
        i--
    ){

        const hook=
            p9.hooks[i];

        hook.update(dt);

        if(
            hook.attached&&
            hook.active
        ){

            const o=
                hook.attached;

            const dx=
                player.x-o.x;

            const dy=
                player.y-o.y;

            const d=
                Math.hypot(dx,dy)||1;

            const force=
                Math.min(
                    1400,
                    d*4
                );

            o.vx+=
                dx/d*
                force*
                dt;

            o.vy+=
                dy/d*
                force*
                dt;

            player.vx-=
                dx/d*
                force*
                .18*
                dt;

            player.vy-=
                dy/d*
                force*
                .18*
                dt;
        }

        if(!hook.active){

            p9.hooks.splice(i,1);
        }
    }

    if(p9.hooks.length>5){

        p9.hooks.splice(
            0,
            p9.hooks.length-5
        );
    }
}


/* ============================================================
   PORTAIL
============================================================ */

class P9Portal {

    constructor(x,y,color){

        this.x=x;
        this.y=y;

        this.color=color;

        this.radius=45;

        this.cooldown=0;
    }

    update(dt){

        this.cooldown=
            Math.max(
                0,
                this.cooldown-dt
            );

        if(this.cooldown>0)return;

        for(const o of objects){

            if(o.broken)continue;

            const d=
                Math.hypot(
                    o.x-this.x,
                    o.y-this.y
                );

            if(d<this.radius){

                this.teleport(o);
            }
        }
    }

    teleport(o){

        const other=
            p9.portals.find(
                p=>
                    p!==this
            );

        if(!other)return;

        o.x=
            other.x+
            rand(-20,20);

        o.y=
            other.y+
            rand(-20,20);

        o.vx*=.9;
        o.vy*=.9;

        this.cooldown=.5;
        other.cooldown=.5;

        createSparks(
            other.x,
            other.y,
            20
        );

        p7Shockwave(
            other.x,
            other.y,
            160
        );
    }

    draw(){

        ctx.save();

        ctx.strokeStyle=
            this.color;

        ctx.lineWidth=6;

        ctx.beginPath();
