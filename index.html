<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070b12;
  color:#fff;
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,11,18,.96);
  border-bottom:1px solid #182334;
  backdrop-filter:blur(14px);
}

.header-inner{
  max-width:1450px;
  margin:auto;
  padding:16px 22px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:#fff;
  white-space:nowrap;
}

.logo span{
  color:#4d8dff;
}

.search{
  flex:1;
  max-width:650px;
  background:#101722;
  border:1px solid #263449;
  color:#fff;
  border-radius:12px;
  padding:12px 16px;
  outline:none;
}

.search:focus{
  border-color:#4d8dff;
}

.nav-buttons{
  display:flex;
  gap:8px;
  margin-left:auto;
}

.nav-btn{
  border:1px solid #263449;
  background:#101722;
  color:#fff;
  padding:10px 12px;
  border-radius:10px;
}

.nav-btn:hover{
  background:#172234;
}

.hero{
  max-width:1450px;
  margin:25px auto;
  padding:55px 30px;
  border:1px solid #1d2b40;
  border-radius:22px;
  background:
    radial-gradient(circle at 80% 30%,rgba(77,141,255,.18),transparent 35%),
    linear-gradient(135deg,#0c1420,#080d15);
}

.hero h1{
  font-size:48px;
  margin-bottom:12px;
}

.hero p{
  color:#9ba8bd;
  font-size:17px;
}

.categories{
  max-width:1450px;
  margin:0 auto 22px;
  padding:0 22px;
  display:flex;
  gap:9px;
  overflow:auto;
}

.category-btn{
  white-space:nowrap;
  background:#101722;
  border:1px solid #263449;
  color:#dce5f4;
  padding:10px 16px;
  border-radius:999px;
}

.category-btn.active,
.category-btn:hover{
  background:#4d8dff;
  border-color:#4d8dff;
  color:#fff;
}

.products{
  max-width:1450px;
  margin:auto;
  padding:0 22px 110px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:18px;
}

.product-card{
  background:#0d141f;
  border:1px solid #1e2b3d;
  border-radius:17px;
  overflow:hidden;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
  border-color:#355987;
}

.product-image{
  width:100%;
  height:230px;
  object-fit:contain;
  background:#fff;
  display:block;
}

.product-info{
  padding:16px;
}

.product-category{
  color:#6388b8;
  font-size:11px;
  text-transform:uppercase;
  font-weight:bold;
}

.product-name{
  margin-top:6px;
  min-height:42px;
  font-weight:700;
  line-height:1.35;
}

.price{
  margin-top:13px;
  font-size:22px;
  font-weight:900;
}

.product-buttons{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.btn{
  border:1px solid #29394f;
  background:#111b28;
  color:#fff;
  border-radius:10px;
  padding:10px 12px;
  flex:1;
}

.btn:hover{
  background:#1a2738;
}

.btn.primary{
  background:#4d8dff;
  border-color:#4d8dff;
}

.btn.danger{
  background:#8d2933;
  border-color:#8d2933;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:#77869d;
  padding:70px 20px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0c131e;
  border:1px solid #29394f;
  border-radius:18px;
  padding:22px;
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.modal-title{
  font-size:23px;
  font-weight:900;
  margin-bottom:18px;
}

.close{
  float:right;
  background:#172231;
  border:1px solid #29394f;
  color:#fff;
  width:36px;
  height:36px;
  border-radius:10px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  background:#101925;
  border:1px solid #2a3b52;
  color:#fff;
  border-radius:10px;
  padding:12px;
  outline:none;
}

.form textarea{
  min-height:120px;
  resize:vertical;
}

.review{
  padding:15px 0;
  border-bottom:1px solid #202d3d;
}

.review:last-child{
  border-bottom:0;
}

.review-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.stars{
  color:#ffd166;
  letter-spacing:1px;
}

.review-date{
  color:#708098;
  font-size:12px;
}

.review-text{
  color:#c6d0df;
  margin-top:8px;
  line-height:1.45;
}

.auth-tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.auth-tab{
  flex:1;
  background:#101722;
  color:#fff;
  border:1px solid #263449;
  padding:11px;
  border-radius:10px;
}

.auth-tab.active{
  background:#4d8dff;
  border-color:#4d8dff;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #202d3d;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:contain;
  background:#fff;
  border-radius:8px;
}

.cart-item-info{
  flex:1;
}

.cart-total{
  margin-top:20px;
  font-size:24px;
  font-weight:900;
  text-align:right;
}

.order{
  background:#101925;
  border:1px solid #25364c;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.order-status{
  color:#69a2ff;
  font-weight:bold;
  margin-top:8px;
}

.bottom-bar{
  position:fixed;
  z-index:200;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(12,19,30,.96);
  border:1px solid #2c405a;
  box-shadow:0 10px 40px rgba(0,0,0,.45);
  border-radius:18px;
  padding:8px;
  display:flex;
  gap:7px;
}

.bottom-btn{
  border:0;
  background:#111d2c;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
}

.bottom-btn:hover{
  background:#1c2e46;
}

.toast{
  position:fixed;
  right:20px;
  bottom:85px;
  z-index:1000;
  background:#142033;
  border:1px solid #31445f;
  color:#fff;
  padding:13px 16px;
  border-radius:12px;
  display:none;
  max-width:350px;
}

.toast.show{
  display:block;
}

.admin-tools{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.admin-tools button{
  flex:1;
}

@media(max-width:800px){

  .header-inner{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
    max-width:none;
  }

  .nav-buttons{
    margin-left:auto;
  }

  .hero h1{
    font-size:34px;
  }

  .bottom-bar{
    width:calc(100% - 20px);
    justify-content:center;
  }

  .bottom-btn{
    flex:1;
    padding:11px 7px;
    font-size:12px;
  }

}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      Nova<span>Shop</span>
    </div>

    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="Rechercher un produit..."
    >

    <div class="nav-buttons">

      <button
        class="nav-btn"
        id="accountBtn"
      >
        👤
      </button>

      <button
        class="nav-btn"
        id="ordersBtn"
      >
        📦
      </button>

      <button
        class="nav-btn"
        id="cartBtn"
      >
        🛒 <span id="cartCount">0</span>
      </button>

      <button
        class="nav-btn"
        id="adminBtn"
        style="display:none"
      >
        👑
      </button>

    </div>

  </div>

</header>


<section class="hero">

  <h1>
    NovaShop
  </h1>

  <p>
    Ton espace shopping gaming et high-tech.
  </p>

</section>


<div
  class="categories"
  id="categories"
></div>


<main
  class="products"
  id="products"
></main>


<div class="bottom-bar">

  <button
    class="bottom-btn"
    id="bottomCartBtn"
  >
    🛒 Panier
  </button>

  <button
    class="bottom-btn"
    id="bottomAccountBtn"
  >
    👤 Compte
  </button>

</div>


<div
  id="toast"
  class="toast"
></div>


<!-- AUTH -->

<div
  class="modal"
  id="authModal"
>

  <div class="modal-box">

    <button
      class="close"
      data-close="authModal"
    >
      ×
    </button>

    <div class="modal-title">
      Compte NovaShop
    </div>

    <div class="auth-tabs">

      <button
        class="auth-tab active"
        id="loginTab"
      >
        Connexion
      </button>

      <button
        class="auth-tab"
        id="registerTab"
      >
        Créer un compte
      </button>

    </div>

    <form
      class="form"
      id="authForm"
    >

      <input
        id="authEmail"
        type="email"
        placeholder="Adresse email"
        required
      >

      <input
        id="authPassword"
        type="password"
        placeholder="Mot de passe"
        required
      >

      <button
        class="btn primary"
        type="submit"
        id="authSubmit"
      >
        Se connecter
      </button>

    </form>

    <div
      id="authInfo"
      style="
        margin-top:15px;
        color:#71809a;
        font-size:13px;
      "
    ></div>

  </div>

</div>


<!-- ACCOUNT -->

<div
  class="modal"
  id="accountModal"
>

  <div class="modal-box">

    <button
      class="close"
      data-close="accountModal"
    >
      ×
    </button>

    <div class="modal-title">
      👤 Mon compte
    </div>

    <div id="accountContent"></div>

  </div>

</div>


<!-- PRODUCT REVIEWS -->

<div
  class="modal"
  id="reviewsModal"
>

  <div class="modal-box">

    <button
      class="close"
      data-close="reviewsModal"
    >
      ×
    </button>

    <div
      class="modal-title"
      id="reviewsTitle"
    >
      Avis
    </div>

    <div
      id="reviewsContent"
    ></div>

  </div>

</div>


<!-- CART -->

<div
  class="modal"
  id="cartModal"
>

  <div class="modal-box">

    <button
      class="close"
      data-close="cartModal"
    >
      ×
    </button>

    <div class="modal-title">
      🛒 Mon panier
    </div>

    <div id="cartContent"></div>

  </div>

</div>


<!-- CHECKOUT -->

<div
  class="modal"
  id="checkoutModal"
>

  <div class="modal-box">

    <button
      class="close"
      data-close="checkoutModal"
    >
      ×
    </button>

    <div class="modal-title">
      💳 Paiement
    </div>

    <form
      class="form"
      id="checkoutForm"
    >

      <input
        id="checkoutName"
        placeholder="Nom complet"
        required
      >

      <input
        id="checkoutAddress"
        placeholder="Adresse complète"
        required
      >

      <input
        id="checkoutCity"
        placeholder="Ville"
        required
      >

      <input
        id="checkoutPostal"
        placeholder="Code postal"
        required
      >

      <select
        id="checkoutPayment"
      >

        <option value="card">
          Carte bancaire
        </option>

      </select>

      <button
        class="btn primary"
        type="submit"
      >
        Confirmer la commande
      </button>

    </form>

  </div>

</div>


<!-- ORDERS -->

<div
  class="modal"
  id="ordersModal"
>

  <div class="modal-box">

    <button
      class="close"
      data-close="ordersModal"
    >
      ×
    </button>

    <div class="modal-title">
      📦 Mes commandes
    </div>

    <div
      id="ordersContent"
    ></div>

  </div>

</div>


<!-- ADMIN -->

<div
  class="modal"
  id="adminModal"
>

  <div class="modal-box">

    <button
      class="close"
      data-close="adminModal"
    >
      ×
    </button>

    <div class="modal-title">
      👑 Dashboard Admin
    </div>

    <div
      id="adminContent"
    ></div>

  </div>

</div>


<!-- ADMIN LOGIN CODE -->

<div
  class="modal"
  id="adminCodeModal"
>

  <div class="modal-box">

    <button
      class="close"
      data-close="adminCodeModal"
    >
      ×
    </button>

    <div class="modal-title">
      🔐 Accès administrateur
    </div>

    <form
      class="form"
      id="adminCodeForm"
    >

      <input
        id="adminCode"
        type="password"
        placeholder="Code administrateur"
        required
      >

      <button
        class="btn primary"
      >
        Accéder au dashboard
      </button>

    </form>

  </div>

</div>


<script
  type="module"
  src="app.js"
></script>

</body>
</html>
