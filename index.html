<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>NovaShop | Gaming & High-Tech</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Inter,Segoe UI,Arial,sans-serif;
      background:#070b12;
      color:#f4f7fb;
      min-height:100vh;
      overflow-x:hidden;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    ::selection{
      background:#2563eb;
      color:white;
    }

    .site-header{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(7,11,18,.88);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.07);
    }

    .header-inner{
      max-width:1450px;
      margin:auto;
      min-height:72px;
      padding:12px 22px;
      display:flex;
      align-items:center;
      gap:20px;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:21px;
      font-weight:800;
      white-space:nowrap;
    }

    .logo-mark{
      width:38px;
      height:38px;
      border-radius:11px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#2563eb,#60a5fa);
      box-shadow:0 8px 25px rgba(37,99,235,.28);
    }

    .logo span:last-child{
      color:#60a5fa;
    }

    .search-wrap{
      flex:1;
      max-width:650px;
      position:relative;
      margin-left:auto;
    }

    .search-wrap input{
      width:100%;
      height:44px;
      padding:0 18px 0 44px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.09);
      background:#0d1420;
      color:white;
      outline:none;
      transition:.2s;
    }

    .search-wrap input:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    .search-icon{
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      opacity:.6;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .header-btn{
      position:relative;
      min-height:42px;
      border:1px solid rgba(255,255,255,.08);
      background:#0d1420;
      color:#eef3f8;
      border-radius:11px;
      padding:0 13px;
      transition:.2s;
    }

    .header-btn:hover{
      background:#131d2d;
      border-color:rgba(96,165,250,.4);
      transform:translateY(-1px);
    }

    .cart-badge{
      position:absolute;
      right:-5px;
      top:-6px;
      min-width:19px;
      height:19px;
      padding:0 5px;
      display:grid;
      place-items:center;
      border-radius:999px;
      background:#2563eb;
      color:white;
      font-size:11px;
      font-weight:800;
      border:2px solid #070b12;
    }

    .cart-badge.pop{
      animation:badgePop .34s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes badgePop{
      0%{transform:scale(.65)}
      60%{transform:scale(1.18)}
      100%{transform:scale(1)}
    }

    .hero{
      max-width:1450px;
      margin:auto;
      padding:55px 22px 28px;
    }

    .hero-box{
      min-height:310px;
      border-radius:24px;
      padding:45px;
      display:flex;
      align-items:center;
      overflow:hidden;
      position:relative;
      background:
        radial-gradient(circle at 80% 20%,rgba(37,99,235,.23),transparent 30%),
        linear-gradient(135deg,#0d1728,#09101b);
      border:1px solid rgba(255,255,255,.07);
    }

    .hero-box::after{
      content:"";
      position:absolute;
      width:330px;
      height:330px;
      right:-120px;
      bottom:-160px;
      border-radius:50%;
      border:1px solid rgba(96,165,250,.18);
    }

    .hero-content{
      position:relative;
      z-index:2;
      max-width:700px;
    }

    .eyebrow{
      color:#60a5fa;
      font-weight:700;
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    .hero h1{
      font-size:clamp(34px,5vw,64px);
      line-height:1;
      letter-spacing:-.04em;
      margin-bottom:17px;
    }

    .hero p{
      max-width:650px;
      color:#aeb9c8;
      line-height:1.7;
      font-size:16px;
    }

    .hero-actions{
      display:flex;
      gap:12px;
      margin-top:25px;
      flex-wrap:wrap;
    }

    .primary-btn,
    .secondary-btn{
      min-height:44px;
      border-radius:11px;
      padding:0 18px;
      border:1px solid transparent;
      transition:.2s;
    }

    .primary-btn{
      background:#2563eb;
      color:white;
      box-shadow:0 8px 25px rgba(37,99,235,.18);
    }

    .primary-btn:hover{
      background:#3474ef;
      transform:translateY(-1px);
    }

    .secondary-btn{
      background:#111a28;
      color:white;
      border-color:rgba(255,255,255,.09);
    }

    .secondary-btn:hover{
      background:#172235;
    }

    .main{
      max-width:1450px;
      margin:auto;
      padding:10px 22px 80px;
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin:20px 0;
      flex-wrap:wrap;
    }

    .section-title{
      font-size:24px;
      font-weight:800;
    }

    .section-subtitle{
      color:#7f8da1;
      font-size:14px;
      margin-top:5px;
    }

    .categories{
      display:flex;
      gap:8px;
      overflow:auto;
      padding:3px 0 8px;
      scrollbar-width:none;
    }

    .categories::-webkit-scrollbar{
      display:none;
    }

    .category-btn{
      flex:none;
      padding:10px 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.08);
      background:#0c131e;
      color:#aeb9c8;
      transition:.2s;
    }

    .category-btn:hover{
      color:white;
      background:#111b2a;
    }

    .category-btn.active{
      background:#2563eb;
      color:white;
      border-color:#2563eb;
    }

    .products-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:17px;
      margin-top:22px;
    }

    .product-card{
      background:#0c131e;
      border:1px solid rgba(255,255,255,.065);
      border-radius:16px;
      overflow:hidden;
      transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
      position:relative;
    }

    .product-card:hover{
      transform:translateY(-4px);
      border-color:rgba(96,165,250,.25);
      box-shadow:0 15px 40px rgba(0,0,0,.22);
    }

    .product-image-wrap{
      height:220px;
      padding:14px;
      background:#101925;
      position:relative;
      overflow:hidden;
    }

    .product-image{
      width:100%;
      height:100%;
      object-fit:contain;
      transition:transform .35s ease;
    }

    .product-card:hover .product-image{
      transform:scale(1.035);
    }

    .product-category{
      position:absolute;
      top:12px;
      left:12px;
      padding:5px 8px;
      border-radius:7px;
      background:rgba(5,9,15,.78);
      border:1px solid rgba(255,255,255,.08);
      color:#a9b8ca;
      font-size:11px;
      backdrop-filter:blur(8px);
    }

    .product-content{
      padding:15px;
    }

    .product-name{
      min-height:44px;
      font-size:15px;
      line-height:1.45;
      font-weight:700;
    }

    .product-rating{
      display:flex;
      align-items:center;
      gap:7px;
      margin-top:9px;
      color:#f7c948;
      font-size:13px;
    }

    .review-count{
      color:#738198;
    }

    .product-bottom{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:10px;
      margin-top:15px;
    }

    .price{
      font-size:20px;
      font-weight:800;
    }

    .add-cart-btn{
      width:40px;
      height:40px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.09);
      background:#162235;
      color:white;
      transition:.2s;
      flex:none;
    }

    .add-cart-btn:hover{
      background:#2563eb;
      border-color:#2563eb;
      transform:translateY(-1px);
    }

    .add-cart-btn.added{
      animation:addButton .35s ease;
    }

    @keyframes addButton{
      0%{transform:scale(1)}
      45%{transform:scale(.9)}
      100%{transform:scale(1)}
    }

    .reviews-btn{
      width:100%;
      margin-top:10px;
      border:0;
      background:transparent;
      color:#7891ad;
      text-align:left;
      font-size:12px;
      padding:4px 0;
    }

    .reviews-btn:hover{
      color:#60a5fa;
    }

    .empty{
      grid-column:1/-1;
      padding:70px 20px;
      text-align:center;
      color:#77869b;
    }

    .modal-overlay{
      position:fixed;
      inset:0;
      z-index:2000;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.65);
      backdrop-filter:blur(8px);
      opacity:0;
      transition:opacity .25s ease;
      padding:20px;
    }

    .modal-overlay.open{
      display:flex;
      opacity:1;
    }

    .modal{
      width:min(620px,100%);
      max-height:90vh;
      overflow:auto;
      border-radius:18px;
      background:#0c131e;
      border:1px solid rgba(255,255,255,.09);
      box-shadow:0 30px 90px rgba(0,0,0,.5);
      transform:translateY(12px) scale(.985);
      transition:transform .25s ease;
    }

    .modal-overlay.open .modal{
      transform:translateY(0) scale(1);
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:19px 20px;
      border-bottom:1px solid rgba(255,255,255,.07);
    }

    .modal-head h2{
      font-size:19px;
    }

    .close-btn{
      width:34px;
      height:34px;
      border:0;
      border-radius:9px;
      background:#151f2d;
      color:#aeb9c8;
    }

    .close-btn:hover{
      background:#202c3e;
      color:white;
    }

    .modal-body{
      padding:20px;
    }

    .form{
      display:grid;
      gap:12px;
    }

    .form label{
      color:#9caabd;
      font-size:13px;
      margin-bottom:-6px;
    }

    .form input{
      width:100%;
      height:45px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.09);
      background:#101925;
      color:white;
      padding:0 13px;
      outline:none;
    }

    .form input:focus{
      border-color:#2563eb;
    }

    .form-actions{
      display:flex;
      gap:10px;
      margin-top:6px;
    }

    .form-actions button{
      flex:1;
    }

    .auth-switch{
      margin-top:14px;
      text-align:center;
      color:#7f8da1;
      font-size:13px;
    }

    .auth-switch button{
      border:0;
      background:none;
      color:#60a5fa;
    }

    .reviews-list{
      display:grid;
      gap:10px;
      max-height:55vh;
      overflow:auto;
    }

    .review{
      padding:13px;
      border-radius:11px;
      background:#101925;
      border:1px solid rgba(255,255,255,.05);
    }

    .review-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:7px;
    }

    .review-name{
      font-weight:700;
      font-size:13px;
    }

    .review-stars{
      color:#f7c948;
      font-size:12px;
    }

    .review-text{
      color:#9ba9bb;
      font-size:13px;
      line-height:1.5;
    }

    .orders-list{
      display:grid;
      gap:12px;
    }

    .order{
      padding:15px;
      border-radius:12px;
      background:#101925;
      border:1px solid rgba(255,255,255,.06);
    }

    .order-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .order-status{
      color:#60a5fa;
      font-size:12px;
    }

    .order-item{
      display:flex;
      justify-content:space-between;
      color:#a5b1c1;
      font-size:13px;
      padding:4px 0;
    }

    .order-total{
      border-top:1px solid rgba(255,255,255,.07);
      margin-top:9px;
      padding-top:9px;
      display:flex;
      justify-content:space-between;
      font-weight:800;
    }

    .cart-overlay{
      position:fixed;
      inset:0;
      z-index:3000;
      background:rgba(0,0,0,.5);
      opacity:0;
      visibility:hidden;
      transition:opacity .28s ease,visibility .28s ease;
    }

    .cart-overlay.open{
      opacity:1;
      visibility:visible;
    }

    .cart-drawer{
      position:absolute;
      top:0;
      right:0;
      width:min(430px,100%);
      height:100%;
      background:#0b121d;
      border-left:1px solid rgba(255,255,255,.09);
      box-shadow:-20px 0 60px rgba(0,0,0,.35);
      transform:translateX(100%);
      transition:transform .32s cubic-bezier(.22,.75,.2,1);
      display:flex;
      flex-direction:column;
    }

    .cart-overlay.open .cart-drawer{
      transform:translateX(0);
    }

    .cart-head{
      min-height:72px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 18px;
      border-bottom:1px solid rgba(255,255,255,.07);
      flex:none;
    }

    .cart-title{
      font-size:19px;
      font-weight:800;
    }

    .cart-items{
      flex:1;
      overflow:auto;
      padding:14px;
    }

    .cart-empty{
      height:100%;
      display:grid;
      place-items:center;
      text-align:center;
      color:#718097;
      padding:30px;
    }

    .cart-item{
      display:grid;
      grid-template-columns:65px 1fr auto;
      gap:11px;
      padding:11px 0;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .cart-item-image{
      width:65px;
      height:65px;
      object-fit:contain;
      border-radius:9px;
      background:#121c29;
    }

    .cart-item-name{
      font-size:13px;
      font-weight:700;
      line-height:1.35;
    }

    .cart-item-price{
      color:#9aa8ba;
      font-size:12px;
      margin-top:5px;
    }

    .quantity{
      display:flex;
      align-items:center;
      gap:6px;
      margin-top:8px;
    }

    .quantity button{
      width:25px;
      height:25px;
      border:1px solid rgba(255,255,255,.08);
      background:#151f2d;
      color:white;
      border-radius:6px;
    }

    .quantity span{
      min-width:20px;
      text-align:center;
      font-size:12px;
    }

    .remove-item{
      border:0;
      background:none;
      color:#66768c;
      font-size:12px;
      margin-top:5px;
    }

    .remove-item:hover{
      color:#ef6b73;
    }

    .cart-bottom{
      padding:16px;
      border-top:1px solid rgba(255,255,255,.07);
      flex:none;
    }

    .cart-total{
      display:flex;
      justify-content:space-between;
      font-size:20px;
      font-weight:800;
      margin-bottom:12px;
    }

    .checkout-btn{
      width:100%;
      height:47px;
      border:0;
      border-radius:11px;
      background:#2563eb;
      color:white;
      font-weight:700;
    }

    .checkout-btn:hover{
      background:#3474ef;
    }

    .toast-container{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:5000;
      display:grid;
      gap:9px;
      pointer-events:none;
    }

    .toast{
      min-width:260px;
      max-width:360px;
      padding:13px 15px;
      border-radius:11px;
      background:#111a28;
      border:1px solid rgba(255,255,255,.09);
      box-shadow:0 15px 40px rgba(0,0,0,.35);
      color:#e9eef5;
      font-size:13px;
      animation:toastIn .28s ease forwards;
    }

    .toast.out{
      animation:toastOut .25s ease forwards;
    }

    @keyframes toastIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes toastOut{
      from{
        opacity:1;
        transform:translateY(0);
      }
      to{
        opacity:0;
        transform:translateY(8px);
      }
    }

    .flying-product{
      position:fixed;
      z-index:6000;
      pointer-events:none;
      width:55px;
      height:55px;
      object-fit:contain;
      border-radius:10px;
      background:#121c29;
      box-shadow:0 12px 30px rgba(0,0,0,.35);
      transition:
        left .48s cubic-bezier(.4,0,.2,1),
        top .48s cubic-bezier(.4,0,.2,1),
        width .48s ease,
        height .48s ease,
        opacity .48s ease,
        transform .48s cubic-bezier(.4,0,.2,1);
    }

    .footer{
      border-top:1px solid rgba(255,255,255,.07);
      padding:30px 22px;
      text-align:center;
      color:#647287;
      font-size:13px;
    }

    .admin-panel{
      display:grid;
      gap:12px;
    }

    .admin-stat{
      padding:15px;
      background:#101925;
      border:1px solid rgba(255,255,255,.06);
      border-radius:11px;
    }

    .admin-stat strong{
      display:block;
      font-size:24px;
      margin-top:4px;
    }

    @media(max-width:1100px){
      .products-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }
    }

    @media(max-width:820px){
      .header-inner{
        flex-wrap:wrap;
      }

      .search-wrap{
        order:3;
        flex-basis:100%;
        max-width:none;
      }

      .hero-box{
        padding:32px;
      }

      .products-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:540px){
      .header-inner{
        padding:10px 14px 14px;
      }

      .header-actions{
        margin-left:auto;
      }

      .header-btn{
        padding:0 10px;
        font-size:12px;
      }

      .hero{
        padding:25px 14px 15px;
      }

      .hero-box{
        padding:27px 22px;
        min-height:290px;
      }

      .main{
        padding:5px 14px 60px;
      }

      .products-grid{
        grid-template-columns:1fr;
      }

      .product-image-wrap{
        height:260px;
      }

      .toast-container{
        right:12px;
        left:12px;
        bottom:12px;
      }

      .toast{
        min-width:0;
        max-width:none;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a class="logo" href="#">
      <span class="logo-mark">N</span>
      <span>Nova<span>Shop</span></span>
    </a>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input
        id="searchInput"
        type="search"
        placeholder="Rechercher un produit..."
        autocomplete="off"
      >
    </div>

    <div class="header-actions">

      <button class="header-btn" id="accountBtn">
        👤 Compte
      </button>

      <button class="header-btn" id="ordersBtn">
        📦 Commandes
      </button>

      <button class="header-btn" id="cartBtn">
        🛒 Panier
        <span class="cart-badge" id="cartBadge">0</span>
      </button>

      <button
        class="header-btn"
        id="adminBtn"
        style="display:none;"
      >
        👑 Admin
      </button>

    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-box">

    <div class="hero-content">
      <div class="eyebrow">NovaShop • Gaming & High-Tech</div>

      <h1>Ton setup.<br>Ton univers.</h1>

      <p>
        Composants PC, écrans, périphériques, streaming et accessoires
        sélectionnés pour construire un setup qui te ressemble.
      </p>

      <div class="hero-actions">
        <button class="primary-btn" id="heroShopBtn">
          Voir les produits
        </button>

        <button class="secondary-btn" id="heroCartBtn">
          Ouvrir le panier
        </button>
      </div>
    </div>

  </div>
</section>

<main class="main">

  <div class="toolbar">
    <div>
      <div class="section-title">Produits</div>
      <div class="section-subtitle" id="productCount">
        Découvrez notre sélection
      </div>
    </div>
  </div>

  <div class="categories" id="categories"></div>

  <div class="products-grid" id="productsGrid"></div>

</main>

<footer class="footer">
  © 2026 NovaShop • Gaming & High-Tech
</footer>


<!-- CART -->

<div class="cart-overlay" id="cartOverlay">

  <aside class="cart-drawer" id="cartDrawer">

    <div class="cart-head">
      <div class="cart-title">Votre panier</div>

      <button class="close-btn" id="closeCartBtn">
        ✕
      </button>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-bottom">
