/* =========================================================
   ENVIRONMENT UPDATE
   ========================================================= */

function chaos3UpdateEnvironment(delta){

    for(
        let i=chaos3.furniture.length-1;
        i>=0;
        i--
    ){

        const f=
            chaos3.furniture[i];

        f.update(delta);

        if(f.broken){

            chaos3.furniture.splice(
                i,
                1
            );
        }
    }

    for(const d of chaos3.doors){

        d.update(delta);
    }

    for(const p of chaos3.platforms){

        p.update(delta);
    }
}

/* =========================================================
   ENVIRONMENT DRAW
   ========================================================= */

function chaos3DrawEnvironment(){

    for(const w of chaos3.walls){
        w.draw();
    }

    for(const p of chaos3.platforms){
        p.draw();
    }

    for(const d of chaos3.doors){
        d.draw();
    }

    for(const w of chaos3.windows){
        w.draw();
    }

    for(const f of chaos3.furniture){
        f.draw();
    }
}

/* =========================================================
   OBJECT / FURNITURE COLLISION
   ========================================================= */

function chaos3ObjectFurnitureCollision(){

    for(const o of objects){

        if(o.dead || o.held)
            continue;

        for(const f of chaos3.furniture){

            if(f.broken)
                continue;

            const dx=
                o.x-f.x;

            const dy=
                o.y-f.y;

            const overlap=

                Math.abs(dx)
                <
                o.w/2+
                f.w/2

                &&

                Math.abs(dy)
                <
                o.h/2+
                f.h/2;

            if(overlap){

                const speed=
                    Math.hypot(
                        o.vx,
                        o.vy
                    );

                if(speed>200){

                    f.damage(
                        speed*.035
                    );

                    const push=
                        dx>=0 ? 1 : -1;

                    o.vx+=
                        push*
                        speed*.35;

                    o.vy-=
                        speed*.12;

                    chaos3Impact(
                        f.x,
                        f.y,
                        o.vx,
                        o.vy
                    );
                }
            }
        }
    }
}

/* =========================================================
   PLAYER / FURNITURE COLLISION
   ========================================================= */

function chaos3PlayerFurnitureCollision(){

    for(const f of chaos3.furniture){

        if(f.broken)
            continue;

        const dx=
            player.x-f.x;

        const dy=
            player.y-f.y;

        if(
            Math.abs(dx)
            <
            f.w/2+25
            &&
            Math.abs(dy)
            <
            f.h/2+55
        ){

            const speed=
                Math.abs(
                    player.vx
                );

            if(speed>300){

                f.damage(
                    speed*.025
                );

                f.vx+=
                    player.vx*.5;

                f.vy-=
                    Math.abs(
                        player.vx
                    )*.15;
            }
        }
    }
}

/* =========================================================
   ATTACK ENVIRONMENT
   ========================================================= */

function chaos3EnvironmentAttack(){

    if(player.attackTimer<=0)
        return;

    const hitX=
        player.x+
        player.facing*70;

    const hitY=
        player.y-25;

    for(const f of chaos3.furniture){

        if(f.broken)
            continue;

        if(
            Math.abs(
                f.x-hitX
            )
            <
            f.w/2+35

            &&

            Math.abs(
                f.y-hitY
            )
            <
            f.h/2+55
        ){

            f.damage(
                rand(
                    15,
                    35
                )
            );

            f.vx+=
                player.facing*
                250;

            f.vy-=150;

            chaos3Impact(
                f.x,
                f.y,
                f.vx,
                f.vy
            );
        }
    }

    for(const d of chaos3.doors){

        if(d.broken)
            continue;

        if(
            Math.abs(
                d.x-hitX
            )
            <
            d.w/2+30

            &&

            Math.abs(
                d.y-hitY
            )
            <
            d.h/2+50
        ){

            d.damage(
                rand(
                    15,
                    35
                )
            );
        }
    }

    for(const w of chaos3.windows){

        if(w.broken)
            continue;

        if(
            Math.abs(
                w.x-hitX
            )
            <
            w.w/2+30

            &&

            Math.abs(
                w.y-hitY
            )
            <
            w.h/2+50
        ){

            w.damage(
                rand(
                    15,
                    35
                )
            );
        }
    }

    for(const wall of chaos3.walls){

        if(wall.broken)
            continue;

        if(
            Math.abs(
                wall.x-hitX
            )
            <
            wall.w/2+30

            &&

            Math.abs(
                wall.y-hitY
            )
            <
            wall.h/2+50
        ){

            wall.damage(
                rand(
                    10,
                    25
                )
            );
        }
    }
}

/* =========================================================
   PROJECTILE ENVIRONMENT DAMAGE
   ========================================================= */

function chaos3ProjectileEnvironment(){

    for(const o of objects){

        if(o.dead || o.held)
            continue;

        const speed=
            Math.hypot(
                o.vx,
                o.vy
            );

        if(speed<250)
            continue;

        for(const d of chaos3.doors){

            if(d.broken)
                continue;

            if(
                Math.abs(
                    o.x-d.x
                )
                <
                d.w/2+
                o.w/2

                &&

                Math.abs(
                    o.y-d.y
                )
                <
                d.h/2+
                o.h/2
            ){

                d.damage(
                    speed*.04
                );

                o.vx*=.7;
            }
        }

        for(const w of chaos3.windows){

            if(w.broken)
                continue;

            if(
                Math.abs(
                    o.x-w.x
                )
                <
                w.w/2+
                o.w/2

                &&

                Math.abs(
                    o.y-w.y
                )
                <
                w.h/2+
                o.h/2
            ){

                w.damage(
                    speed*.04
                );

                o.vx*=.75;
                o.vy*=.75;
            }
        }

        for(const wall of chaos3.walls){

            if(wall.broken)
                continue;

            if(
                Math.abs(
                    o.x-wall.x
                )
                <
                wall.w/2+
                o.w/2

                &&

                Math.abs(
                    o.y-wall.y
                )
                <
                wall.h/2+
                o.h/2
            ){

                wall.damage(
                    speed*.025
                );

                o.vx*=-
                    .35;

                o.vy*=.65;
            }
        }
    }
}

/* =========================================================
   PLATFORM COLLISION
   ========================================================= */

function chaos3PlatformCollision(){

    for(const o of objects){

        if(o.dead || o.held)
            continue;

        for(const p of chaos3.platforms){

            if(
                o.vy>=0
                &&
                o.x+o.w/2>
                    p.x-p.w/2
                &&
                o.x-o.w/2<
                    p.x+p.w/2
                &&
                o.y+o.h/2>=
                    p.y-p.h/2
                &&
                o.y-o.h/2<
                    p.y+p.h/2
            ){

                o.y=
                    p.y-
                    p.h/2-
                    o.h/2;

                if(o.vy>150){

                    chaos3Impact(
                        o.x,
                        o.y,
                        o.vx,
                        o.vy
                    );
                }

                o.vy*=
                    -o.restitution;

                o.vx*=.94;
            }
        }
    }
}

/* =========================================================
   IMPACT HELPER
   ========================================================= */

function chaos3Impact(
    x,
    y,
    vx,
    vy
){

    const power=
        Math.hypot(
            vx,
            vy
        );

    if(power<120)
        return;

    chaos3.lastImpact=
        performance.now();

    camera.shake=
        Math.max(
            camera.shake,
            clamp(
                power*.015,
                2,
                22
            )
        );

    chaos3DebrisBurstSmall(
        x,
        y,
        clamp(
            Math.floor(
                power/100
            ),
            3,
            14
        )
    );
}

    chaos3.windows.length=0;
    chaos3.platforms.length=0;

/* =========================================================
   UPDATE LAYER
   ========================================================= */

const chaos3PreviousUpdate=
    update;

update=function(delta){

    chaos3PreviousUpdate(delta);

    chaos3UpdateEnvironment(
        delta
    );

    chaos3ObjectFurnitureCollision();

    chaos3PlayerFurnitureCollision();

    chaos3ProjectileEnvironment();

    chaos3PlatformCollision();

    chaos3EnvironmentAttack();
};

/* =========================================================
   DRAW LAYER
   ========================================================= */

const chaos3PreviousRender=
    render;

render=function(){

    chaos3PreviousRender();

    /*
       L'environnement est rendu dans une couche
       séparée pour conserver les objets et ragdolls
       visibles.
    */

function chaos4Dash(){

/* =========================================================
   DIRECTIONAL ATTACK
   ========================================================= */

function chaos4DirectionalAttack(){

    if(player.attackCooldown>0)
        return;

    player.attackCooldown=.18;

    player.attackTimer=.16;

    chaos4.attack.phase=1;

    chaos4.attack.hitTargets.clear();

    let direction=0;

    if(
        keys["a"] ||
        keys["q"]
    ){

        direction=-1;
    }

    if(keys["d"]){

        direction=1;
    }

    if(direction!==0){

        player.facing=direction;
    }

    const angle=
        Math.atan2(

            (player.y-25),
            mouse.x-
            player.x
        );

    const attackX=
        player.x+
        Math.cos(angle)*
        65;

    const attackY=
        player.y-25+
        Math.sin(angle)*
        65;

    let hit=false;

    /* enemies */

    for(const e of enemies){

        if(e.dead)
            continue;

        if(
            chaos4.attack.hitTargets
            .has(e)
        )
            continue;

        const dx=
            e.x-attackX;

        const dy=
            e.y-25-attackY;

        const d=
            Math.hypot(
                dx,
                dy
            );

        if(d<70){

            chaos4.attack.hitTargets
                .add(e);

            const strength=
                rand(

                    30

            damageEnemy(

                strength,
                Math.cos(angle)*

                        850

                Math.sin(angle)*
                    rand(

                        850
                    )-
                    180
            );

            chaos4CombatHit(
                e.x,
                e.y-30,
                strength
            );

            hit=true;
        }

    /* objects */

    for(const o of objects){

        if(
            o.dead ||
            o.held

            continue;

        const dx=
            o.x-attackX;

        const dy=
            o.y-attackY;

        const d=
            Math.hypot(
                dx,
                dy
            );

        if(d<65){

            o.vx+=
                Math.cos(angle)*
                650;

            o.vy+=
                Math.sin(angle)*
                650;

            o.angularVelocity+=
                rand(

                650
            );

            chaos4CombatHit(
                o.x,
                o.y,
                8
            );

            hit=true;
        }
    }

    if(hit){

        player.combo++;
        player.comboTimer=1.5;

        player.score+=
            20+
            player.combo*2;

        chaos4.combatScore+=
            20+
            player.combo*2;

}

/* =========================================================
   ENEMY VS ENEMY COLLISION
   ========================================================= */

function chaos4EnemyEnemyCollision(){

    for(let i=0;i<enemies.length;i++){

        const a=enemies[i];

        if(a.dead)
            continue;

        for(let j=i+1;j<enemies.length;j++){

            const b=enemies[j];

            if(b.dead)
                continue;

            const dx=
                b.x-a.x;

            const dy=
                b.y-a.y;

            const d=
                Math.hypot(
                    dx,
                    dy
                );

            const minDist=42;

            if(
                d<minDist &&
                d>0
            ){

                const n=
                    c2Normalize(
                        dx,
                        dy
                    );

                const overlap=
                    minDist-d;

                a.x-=
                    n.x*
                    overlap*.5;

                a.y-=
                    n.y*
                    overlap*.5;

                b.x+=
                    n.x*
                    overlap*.5;

                b.y+=
                    n.y*
                    overlap*.5;

                const rvx=
                    b.vx-a.vx;

                const rvy=
                    b.vy-a.vy;

                const relative=
                    rvx*n.x+
                    rvy*n.y;

                if(relative<0){

                    const impulse=
                        -relative*.6;

                    a.vx-=
                        n.x*
                        impulse;

                    a.vy-=
                        n.y*
                        impulse;

                    b.vx+=
                        n.x*
                        impulse;

                    b.vy+=
                        n.y*
                        impulse;
                }
            }
        }
    }
}

/* =========================================================

function chaos4EnemyAI(delta){

    for(const e of enemies){

        if(e.dead)
            continue;

        const dx=
            player.x-e.x;

        const dy=
            player.y-e.y;

        const d=
            Math.hypot(
                dx,
                dy
            );

        /*
           Les ennemis proches accélèrent.
        */

        if(d<500){

            const acceleration=
                500*
                chaos4.enemyAggression;

            e.vx+=
                Math.sign(dx)*
                acceleration*
                delta;

            e.vx=
                clamp(
                    e.vx,
                    -e.speed*1.8,
                    e.speed*1.8
                );
        }

        /*
           Petit saut aléatoire si le joueur
           est sur une hauteur différente.
        */

        if(
            dy<-100 &&
            e.y>=world.floor-50 &&
            Math.random()<delta*.7
        ){

            e.vy=-480;
        }
    }
}

/* =========================================================
   ENEMY PROJECTILES
   ========================================================= */

class ChaosProjectile{

    constructor(
        x,
        y,
        vx,
        vy,
        type="orb"
    ){

        this.x=x;
        this.y=y;

        this.vx=vx;
        this.vy=vy;

        this.radius=
            type==="orb"
            ? 9
            : 6;

        this.life=4;

        this.type=type;

        this.dead=false;
    }

    update(delta){

        if(this.dead)
            return;

        this.life-=delta;

        if(this.life<=0){

            this.dead=true;
            return;
        }

        this.vy+=
            world.gravity*.35*
            delta;

        this.x+=
            this.vx*
            delta;

        this.y+=
            this.vy*
            delta;

        this.vx*=.998;
        this.vy*=.998;

        if(
            this.y+
            this.radius>
            world.floor
        ){

            this.y=
                world.floor-
                this.radius;

            this.vy*=-.55;

            this.vx*=.8;
        }

        this.hitPlayer();

        this.hitObjects();
    }

    hitPlayer(){

        const d=
            Math.hypot(
                this.x-player.x,
                this.y-
                (player.y-25)
            );

        if(
            d<
            this.radius+25
        ){

            damagePlayer(
                8,
                Math.sign(
                    this.vx
                )*300
            );

            this.dead=true;

            createShockwave(
                this.x,
                this.y,
                45
            );
        }
    }

    hitObjects(){

        for(const o of objects){

            if(
                o.dead ||
                o.held
            )
                continue;

            if(
                Math.abs(
                    this.x-o.x
                )<
                this.radius+
                o.w/2

                &&

                Math.abs(
                    this.y-o.y
                )<
                this.radius+
                o.h/2
            ){

                o.vx+=
                    this.vx*.2;

                o.vy+=
                    this.vy*.2;

                impact(
                    o,
                    Math.hypot(
                        this.vx,
                        this.vy
                    )
                );

                this.dead=true;

                break;
            }
        }
    }

    draw(){

        ctx.save();

        ctx.globalAlpha=.9;

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            TAU
        );

        ctx.fill();

        ctx.globalAlpha=.15;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius*2.8,
            0,
            TAU
        );

        ctx.fill();

        ctx.restore();
    }
}

const chaos5 = {

    traps: [],
    explosions: [],

/* =========================================================
   HELPERS
   ========================================================= */

function c5Dist(a,b,c,d){
    return Math.hypot(a-c,b-d);
}

function c5Clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function c5NearestObject(x,y,maxDist=500){

    let best=null;
    let bestD=maxDist;

    for(const o of objects){

        if(o.dead || o.held) continue;

        const d=c5Dist(
            x,y,
            o.x,o.y
        );

        if(d<bestD){

            best=o;
            bestD=d;
        }
    }

    return best;
}

/* =========================================================
   PHYSICS VEHICLE
   ========================================================= */

class ChaosVehicle{

    constructor(x,y,type="cart"){

        this.x=x;
        this.y=y;

        this.vx=0;
        this.vy=0;

        this.angle=0;
        this.angularVelocity=0;

        this.w=
            type==="car"
            ? 125
            : 95;

        this.h=
            type==="car"
            ? 45
            : 38;

        this.mass=
            type==="car"
            ? 7
            : 4;

        this.type=type;

        this.hp=100;

        this.dead=false;

        this.wheelRotation=0;

        this.colorIndex=
            Math.floor(
                Math.random()*4
            );
    }

    update(delta){

        if(this.dead)
            return;

        this.vy+=
            world.gravity*
            delta;

        this.x+=
            this.vx*
            delta;

        this.y+=
            this.vy*
            delta;

        this.angle+=
            this.angularVelocity*
            delta;

        this.angularVelocity*=.995;

        this.vx*=.997;

        this.wheelRotation+=
            this.vx*
            delta/
            18;

        const floor=
            world.floor;

        if(
            this.y+
            this.h/2>
            floor
        ){

            this.y=
                floor-
                this.h/2;

            if(
                Math.abs(this.vy)>150
            ){

                this.vy*=-.38;

                this.angularVelocity+=
                    this.vx*.003;

                chaos5Impact(
                    this.x,
                    floor,
                    Math.abs(this.vy)
                );
            }
            else{

                this.vy=0;
            }

            this.vx*=.97;
        }

        this.checkPlayer();
        this.checkEnemies();
        this.checkObjects();

        if(
            Math.abs(this.vx)<.02 &&
            Math.abs(this.vy)<.02 &&
            Math.abs(this.angularVelocity)<.01
        ){

            /* véhicule reste immobile */
        }
    }

    checkPlayer(){

        const d=
            c5Dist(
                this.x,
                this.y,
                player.x,
                player.y-25
            );

        if(
            d<
            this.w/2+28
        ){

            const dir=
                Math.sign(
                    player.x-this.x
                )||1;

            player.vx+=
                dir*
                Math.abs(this.vx)*
                .35;

            player.vy-=
                80;

            if(
                Math.abs(this.vx)>300
            ){

                damagePlayer(
                    Math.min(
                        25,
                        Math.abs(this.vx)/35
                    ),
                    dir*
                    Math.abs(this.vx)*.7
                );

                chaos5Impact(
                    player.x,
                    player.y-25,
                    Math.abs(this.vx)
                );
            }
        }
    }

    checkEnemies(){

        for(const e of enemies){

            if(e.dead)
                continue;

            const d=
                c5Dist(
                    this.x,
                    this.y,
                    e.x,
                    e.y-25
                );

            if(
                d<
                this.w/2+28
            ){

                const dir=
                    Math.sign(
                        e.x-this.x
                    )||1;

                e.vx+=
                    dir*
                    Math.abs(this.vx)*
                    .8;

                e.vy-=
                    120;

                if(
                    Math.abs(this.vx)>180
                ){

                    damageEnemy(
                        e,
                        Math.min(
                            45,
                            Math.abs(this.vx)/18
                        ),
                        dir*
                        Math.abs(this.vx)*
                        1.1,
                        -350
                    );

                    chaos5Impact(
                        e.x,
                        e.y-20,
                        Math.abs(this.vx)
                    );
                }
            }
        }
    }

    checkObjects(){

        for(const o of objects){

            if(
                o.dead ||
                o.held
            )
                continue;

            const dx=
                o.x-this.x;

            const dy=
                o.y-this.y;

            const d=
                Math.hypot(dx,dy);

            if(
                d<
                this.w/2+
                Math.max(
                    o.w,
                    o.h
                )/2
            ){

                const dir=
                    Math.sign(dx)||1;

                o.vx+=
                    dir*
                    Math.abs(this.vx)*
                    .35;

                o.vy-=
                    60;

                if(
                    Math.abs(this.vx)>300
                ){

                    impact(
                        o,
                        Math.abs(this.vx)
                    );
                }
            }
        }
    }

    draw(){

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.angle
        );

        /* body */

        ctx.fillStyle=
            this.type==="car"
            ? "#242424"
            : "#303030";

        ctx.fillRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        ctx.strokeStyle=
            "#ffffff";

        ctx.lineWidth=2;

        ctx.strokeRect(
            -this.w/2,
            -this.h/2,
            this.w,
            this.h
        );

        /* windshield */

        if(
            this.type==="car"
        ){

            ctx.fillStyle=
                "#111820";

            ctx.fillRect(
                5-this.w/2,
                -this.h/2+5,
                45,
                20
            );

            ctx.fillStyle=
                "#e9e9e9";

            ctx.fillRect(
                this.w/2-15,
                -8,
                8,
                14
            );
        }

        /* wheels */

        const wheelY=
            this.h/2+4;

        const wheels=[
            -this.w*.32,
            this.w*.32
        ];

        for(const wx of wheels){

            ctx.save();

            ctx.translate(
                wx,
                wheelY
            );

            ctx.rotate(
                this.wheelRotation
            );

            ctx.fillStyle=
                "#090909";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                15,
                0,
                TAU
            );

            ctx.fill();

            ctx.strokeStyle=
                "#aaa";

            ctx.stroke();

            ctx.beginPath();

            ctx.moveTo(
                -8,
                0
            );

            ctx.lineTo(
                8,
                0
            );

            ctx.moveTo(
                0,
                -8
            );

            ctx.lineTo(
                0,
                8
            );

            ctx.stroke();

            ctx.restore();
        }

        ctx.restore();
    }
}

/* =========================================================
   ROPE / GRAPPLING
   ========================================================= */

class ChaosRope{

    constructor(x1,y1,x2,y2){

        this.x1=x1;
        this.y1=y1;

        this.x2=x2;
        this.y2=y2;

        this.length=
            Math.hypot(
                x2-x1,
                y2-y1
            );

        this.segments=[];

        const count=
            Math.max(
                5,
                Math.floor(
                    this.length/25
                )
            );

        for(let i=0;i<=count;i++){

            const t=
                i/count;

            this.segments.push({

                x:
                    x1+
                    (x2-x1)*t,

                y:
                    y1+
                    (y2-y1)*t,

                vx:0,
                vy:0
            });
        }

        this.dead=false;
    }

    update(delta){

        if(this.dead)
            return;

        const s=
            this.segments;

        if(!s.length)
            return;

        s[0].x=this.x1;
        s[0].y=this.y1;

        s[s.length-1].x=this.x2;
        s[s.length-1].y=this.y2;

        for(let i=1;i<s.length-1;i++){

            const p=s[i];

            p.vy+=
                world.gravity*.25*
                delta;

            p.x+=
                p.vx*
                delta;

            p.y+=
                p.vy*
                delta;

            p.vx*=.995;
            p.vy*=.995;
        }

        for(let iteration=0;iteration<4;iteration++){

            for(let i=0;i<s.length-1;i++){

                const a=s[i];
                const b=s[i+1];

                const dx=
                    b.x-a.x;

                const dy=
                    b.y-a.y;

                const d=
                    Math.hypot(dx,dy);

                if(d===0)
                    continue;

                const wanted=
                    this.length/
                    (s.length-1);

                const error=
                    d-wanted;

                const nx=
                    dx/d;

                const ny=
                    dy/d;

                if(i!==0){

                    a.x+=
                        nx*
                        error*
                        .35;

                    a.y+=
                        ny*
                        error*
                        .35;
                }

                if(i!==s.length-2){

                    b.x-=
                        nx*
                        error*
                        .35;

                    b.y-=
                        ny*
                        error*
                        .35;
                }
            }
        }
    }

    draw(){

        ctx.save();

        ctx.strokeStyle=
            "#d0d0d0";

        ctx.lineWidth=3;

        ctx.beginPath();

        for(
            let i=0;
            i<this.segments.length;
            i++
        ){

            const p=
                this.segments[i];

            if(i===0)
                ctx.moveTo(
                    p.x,
                    p.y
                );
            else
                ctx.lineTo(
                    p.x,
                    p.y
                );
        }

        ctx.stroke();

        ctx.restore();
    }
}

/* =========================================================
   GRAPPLING HOOK
   ========================================================= */

function chaos5Grapple(){

    if(
        chaos5.grappling.cooldown>0
    )
        return;

    const target=
        c5NearestObject(
            player.x,
            player.y-30,
            550
        );

    let tx;
    let ty;

    if(target){

        tx=target.x;
        ty=target.y;

        chaos5.grappling.target=
            target;
    }
    else{

        tx=
            mouse.x+
            camera.x;

        ty=
            mouse.y+
            camera.y;

        chaos5.grappling.target=null;
    }

    const dx=
        tx-player.x;

    const dy=
        ty-(player.y-30);

    const d=
        Math.hypot(dx,dy);

    if(d<50)
        return;

    chaos5.grappling.active=true;

    chaos5.grappling.length=d;

    chaos5.grappling.cooldown=.35;

    chaos5.rope=
        new ChaosRope(
            player.x,
            player.y-30,
            tx,
            ty
        );
}

/* =========================================================
   GRAPPLE UPDATE
   ========================================================= */

function chaos5UpdateGrapple(delta){

    if(
        chaos5.grappling.cooldown>0
    ){

        chaos5.grappling.cooldown-=delta;
    }

    if(
        !chaos5.grappling.active
    )
        return;

    const target=
        chaos5.grappling.target;

    let tx;
    let ty;

    if(target){

        if(target.dead){

            chaos5.grappling.active=false;
            chaos5.rope=null;
            return;
        }

        tx=target.x;
        ty=target.y;
    }
    else{

        tx=
            mouse.x+
            camera.x;

        ty=
            mouse.y+
            camera.y;
    }

    const px=
        player.x;

    const py=
        player.y-30;

    const dx=
        tx-px;

    const dy=
        ty-py;

    const d=
        Math.hypot(dx,dy);

    if(d>chaos5.grappling.length){

        const n=
            c2Normalize(
                dx,
                dy
            );

        const force=
            (d-
            chaos5.grappling.length)*
            14;

        player.vx+=
            n.x*
            force*
            delta;

        player.vy+=
            n.y*
            force*
            delta;

        if(target){

            target.vx-=
                n.x*
                force*
                delta/
                2;

            target.vy-=
                n.y*
                force*
                delta/
                2;
        }
    }

    if(chaos5.rope){

        chaos5.rope.x1=
            player.x;

        chaos5.rope.y1=
            player.y-30;

        chaos5.rope.x2=tx;
        chaos5.rope.y2=ty;

        chaos5.rope.length=
            chaos5.grappling.length;

        chaos5.rope.update(delta);
    }
}

/* =========================================================
   RELEASE GRAPPLE
   ========================================================= */

function chaos5ReleaseGrapple(){

    chaos5.grappling.active=false;
    chaos5.grappling.target=null;
    chaos5.rope=null;
}

/* =========================================================
   TRAPS
   ========================================================= */

class ChaosTrap{

    constructor(
        x,
        y,
        type="spring"
    ){

        this.x=x;
        this.y=y;

        this.type=type;

        this.timer=
            rand(
                0,
                1
            );

        this.cooldown=0;

        this.radius=
            type==="spring"
            ? 38
            : 55;

        this.active=false;

        this.dead=false;
    }

    update(delta){

        this.timer+=delta;

        if(
            this.cooldown>0
        ){

            this.cooldown-=delta;
        }

        const d=
            c5Dist(
                this.x,
                this.y,
                player.x,
                player.y
            );

        if(
            d<this.radius &&
            this.cooldown<=0
        ){

            this.activate();
        }

        for(const e of enemies){

            if(e.dead)
                continue;

            const ed=
                c5Dist(
                    this.x,
                    this.y,
                    e.x,
                    e.y
                );

            if(
                ed<this.radius &&
                this.cooldown<=0
            ){

                this.activateEnemy(e);
            }
        }
    }

    activate(){

        this.cooldown=1.2;
        this.active=true;

        const dx=
            player.x-this.x;

        const dy=
            player.y-this.y;

        const n=
            c2Normalize(
                dx,
                dy
            );

        const power=
            this.type==="spring"
            ? 850
            : 1100;

        player.vx+=
            n.x*
            power;

        player.vy-=
            power*.8;

        camera.shake=14;

        createShockwave(
            this.x,
            this.y,
            60
        );

        for(let i=0;i<12;i++){

            chaos5SpawnDebris(
                this.x,
                this.y
            );
        }

        player.score+=30;
    }

    activateEnemy(e){

        this.cooldown=1.2;

        const dx=
            e.x-this.x;

        const dy=
            e.y-this.y;

        const n=
            c2Normalize(
                dx,
                dy
            );

        e.vx+=
            n.x*
            850;

        e.vy-=
            600;

        damageEnemy(
            e,
            15,
            n.x*700,
            -500
        );

        createShockwave(
            this.x,
            this.y,
            55
        );
    }

    draw(){

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.strokeStyle=
            "#fff";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            this.radius,
            0,
            TAU
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            -20,
            10
        );

        ctx.lineTo(
            20,
            -10
        );

        ctx.moveTo(
            -20,
            -10
        );

        ctx.lineTo(
            20,
            10
        );

        ctx.stroke();

        ctx.restore();
    }
}

/* =========================================================
   DEBRIS
   ========================================================= */

class ChaosDebris{

    constructor(x,y){

        this.x=x;
        this.y=y;

        this.vx=
            rand(
                -500,
                500
            );

        this.vy=
            rand(
                -700,
                -100
            );

        this.size=
            rand(
                4,
                12
            );

        this.rotation=
            rand(
                0,
                TAU
            );

        this.spin=
            rand(
                -15,
                15
            );

        this.life=
            rand(
                .8,
                1.8
            );

        this.maxLife=
            this.life;
    }

    update(delta){

        this.life-=delta;

        this.vy+=
            world.gravity*
            delta;

        this.x+=
            this.vx*
            delta;

        this.y+=
            this.vy*
            delta;

        this.rotation+=
            this.spin*
            delta;

        if(
            this.y+
            this.size>
            world.floor
        ){

            this.y=
                world.floor-
                this.size;

            this.vy*=-.35;
            this.vx*=.75;
        }
    }

    draw(){

        ctx.save();

        ctx.globalAlpha=
            Math.max(
                0,
                this.life/
                this.maxLife
            );

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.rotation
        );

        ctx.fillStyle=
            "#aaa";

        ctx.fillRect(
            -this.size/2,
            -this.size/2,
            this.size,
            this.size
        );

        ctx.restore();
    }
}

function chaos5SpawnDebris(

/* =========================================================
   EXPLOSION
   ========================================================= */

class ChaosExplosion{

    constructor(
        x,
        y,
        radius=180
    ){

        this.x=x;
        this.y=y;

        this.radius=radius;

        this.current=0;

        this.life=.42;

        this.maxLife=.42;

        this.done=false;
    }

    update(delta){

        if(this.done)
            return;

        this.life-=delta;

        const progress=
            1-
            this.life/
            this.maxLife;

        this.current=
            this.radius*
            progress;

        if(progress<.35){

            this.applyForce();
        }

        if(this.life<=0){

            this.done=true;
        }
    }

    applyForce(){

        const power=
            1200;

        const check=(x,y,obj)=>{

            const dx=
                obj.x-x;

            const dy=
                obj.y-y;

            const d=
                Math.hypot(
                    dx,
                    dy
                );

            if(
                d<this.current &&
                d>0
            ){

                const n=
                    c2Normalize(
                        dx,
                        dy
                    );

                const factor=
                    1-
                    d/
                    this.current;

                obj.vx+=
                    n.x*
                    power*
                    factor;

                obj.vy+=
                    n.y*
                    power*
                    factor-
                    200*
                    factor;
            }
        };

        for(const o of objects){

            if(
                !o.dead &&
                !o.held
            ){

                check(
                    this.x,
                    this.y,
                    o
                );
            }
        }

        for(const e of enemies){

            if(!e.dead){

                check(
                    this.x,
                    this.y-20,
                    e
                );

                if(
                    c5Dist(
                        this.x,
                        this.y,
                        e.x,
                        e.y
                    )<
                    this.current
                ){

                    damageEnemy(
                        e,
                        25,
                        Math.sign(
                            e.x-this.x
                        )*600,
                        -450
                    );
                }
            }
        }

        const pd=
            c5Dist(
                this.x,
                this.y,
                player.x,
                player.y-25
            );

        if(
            pd<this.current
        ){

            const n=
                c2Normalize(
                    player.x-this.x,
                    player.y-25-this.y
                );

            player.vx+=
                n.x*
                power*
                .7;

            player.vy+=
                n.y*
                power*
                .7-
                180;
        }
    }

    draw(){

        const p=
            1-
            this.life/
            this.maxLife;

        ctx.save();

        ctx.globalAlpha=
            Math.max(
                0,
                1-p
            );

        ctx.strokeStyle=
            "#fff";

        ctx.lineWidth=
            7*
            (1-p)+2;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.current,
            0,
            TAU
        );

        ctx.stroke();

        ctx.globalAlpha=
            .08*
            (1-p);

        ctx.fillStyle=
            "#fff";

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.current*.75,
            0,
            TAU
        );

        ctx.fill();

        ctx.restore();
    }
}

/* =========================================================
   CREATE EXPLOSION
   ========================================================= */

function chaos5Explosion(
    x,
    y,
    radius=180
){

    chaos5.explosions.push(
        new ChaosExplosion(
            x,
            y,
            radius
        )
    );

    camera.shake=
        Math.max(
            camera.shake,
            25
        );

    for(let i=0;i<28;i++){

        chaos5SpawnDebris(
            x,
            y
        );
    }

    createShockwave(
        x,
        y,
        radius
    );

    chaos5.chaosPoints+=100;
}

/* =========================================================
   IMPACT
   ========================================================= */

function chaos5Impact(
    x,
    y,
    power
){

    if(power<80)
        return;

    camera.shake=
        Math.max(
            camera.shake,
            c5Clamp(
                power*.025,
                2,
                18
            )
        );

    createShockwave(
        x,
        y,
        c5Clamp(
            power*.12,
            20,
            100
        )
    );

    for(let i=0;i<6;i++){

        chaos5SpawnDebris(
            x,
            y
        );
    }

    chaos5.chaosPoints+=
        Math.floor(
            power*.05
        );
}

   UPDATE VEHICLES
   ========================================================= */

function chaos5UpdateVehicles(delta){

    for(
        let i=
            chaos5.vehicles.length-1;
        i>=0;
        i--
    ){

        const v=
            chaos5.vehicles[i];

        v.update(delta);

        if(
            v.dead
        ){

            chaos5.vehicles.splice(
                i,
                1
            );
        }
    }
}

        t.update(delta);

/* =========================================================
   GLOBAL UPDATE LAYER
   ========================================================= */

const chaos5OldUpdate=
    update;

update=function(delta){

    chaos5OldUpdate(delta);

    chaos5UpdateGrapple(delta);

    chaos5UpdateVehicles(delta);

    chaos5UpdateTraps(delta);

    chaos5UpdateDebris(delta);

    chaos5UpdateExplosions(delta);
};

/* =========================================================
   DRAW LAYER
   ========================================================= */

const chaos5OldRender=
    render;

render=function(){

    chaos5OldRender();

    ctx.save();

    for(const v of chaos5.vehicles){

        v.draw();
    }

    for(const t of chaos5.traps){

        t.draw();
    }

    if(chaos5.rope){

        chaos5.rope.draw();
    }

    for(const d of chaos5.debris){

        d.draw();
    }

    for(const e of chaos5.explosions){

        e.draw();
    }

    ctx.restore();
};

/* =========================================================
   RANDOM VEHICLE EVENTS
   ========================================================= */

let chaos5VehicleTimer=0;

const chaos5EventUpdate=
    update;

update=function(delta){

    chaos5EventUpdate(delta);

    chaos5VehicleTimer+=delta;

    if(
        chaos5VehicleTimer>12 &&
        chaos5.vehicles.length<5
    ){

        chaos5VehicleTimer=0;

        const side=
            Math.random()<.5
            ? -1
            : 1;

        const v=
            chaos5SpawnVehicle(
                Math.random()<.35
                ? "car"
                : "cart",
                player.x+
                side*
                rand(
                    600,

/* =========================================================
   STICKMAN CHAOS ARENA
   PARTIE 6/8
   ADVANCED RAGDOLL + GRAB + AI + ARENA EVENTS

const chaos6 = {

    grabs:[],
    shockwaves:[],
    movingHazards:[],
    aiState:new Map(),

    arenaEvents:[],

/* =========================================================
   UTILS
   ========================================================= */

function c6Dist(x1,y1,x2,y2){
    return Math.hypot(x2-x1,y2-y1);
}

function c6Normalize(x,y){

    const d=
        Math.hypot(x,y)||1;

    return {
        x:x/d,
        y:y/d
    };
}

function c6Random(arr){

    return arr[
        Math.floor(
            Math.random()*
            arr.length
        )
    ];
}

/* =========================================================
   ADVANCED GRAB
   ========================================================= */

class ChaosGrab{

    constructor(target){

        this.target=target;

        this.active=true;

        this.timer=0;

        this.maxTime=1.8;

        this.offsetX=
            rand(
                -8,
                8
            );

        this.offsetY=
            rand(
                -20,
                10
            );
    }

    update(delta){

        if(
            !this.active ||
            !this.target ||
            this.target.dead
        ){

            this.active=false;
            return;
        }

        this.timer+=delta;

        const tx=
            player.x+
            player.facing*
            48+
            this.offsetX;

        const ty=
            player.y-
            30+
            this.offsetY;

        const dx=
            tx-
            this.target.x;

        const dy=
            ty-
            this.target.y;

        this.target.vx+=
            dx*
            18*
            delta;

        this.target.vy+=
            dy*
            18*
            delta;

        this.target.vx*=.96;
        this.target.vy*=.96;

        if(
            this.timer>
            this.maxTime
        ){

            this.release();
        }
    }

    release(){

        this.active=false;
    }

    throwTarget(){

        if(
            !this.target ||
            this.target.dead
        ){

            this.active=false;
            return;
        }

        const dir=
            player.facing||1;

        this.target.vx=
            dir*
            900+
            player.vx*.3;

        this.target.vy=
            -520+
            player.vy*.2;

        this.target.stun=
            .8;

        chaos6Impact(
            this.target.x,
            this.target.y,
            700
        );

        this.active=false;

        chaos6.comboHits++;

        player.combo++;

        player.comboTimer=1.5;

        player.score+=
            80+
            player.combo*
            5;
    }

    draw(){

        if(
            !this.active ||
            !this.target
        )
            return;

        ctx.save();

        ctx.strokeStyle=
            "#fff";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            player.x+
            player.facing*
            35,
            player.y-35
        );

        ctx.lineTo(
            this.target.x,
            this.target.y-20
        );

        ctx.stroke();

        ctx.restore();
    }
}

/* =========================================================
   FIND ENEMY TO GRAB
   ========================================================= */

function chaos6FindGrabTarget(){

    let best=null;
    let bestD=75;

    for(const e of enemies){

        if(e.dead)
            continue;

        const d=
            c6Dist(
                player.x,
                player.y-25,
                e.x,
                e.y-25
            );

        if(d<bestD){

            best=e;
            bestD=d;
        }
    }

    return best;
}

/* =========================================================
   GRAB
   ========================================================= */

function chaos6Grab(){

    if(
        chaos6.grabs.some(
            g=>g.active
        )
    )
        return;

    const target=
        chaos6FindGrabTarget();

    if(!target)
        return;

    chaos6.grabs.push(
        new ChaosGrab(target)
    );

    target.stun=
        2;

    showMessage(
        "PRISE !"
    );
}

/* =========================================================
   UPDATE GRABS
   ========================================================= */

function chaos6UpdateGrabs(delta){

    for(
        let i=
            chaos6.grabs.length-1;
        i>=0;
        i--
    ){

        const g=
            chaos6.grabs[i];

        g.update(delta);

        if(!g.active){

            chaos6.grabs.splice(
                i,
                1
            );
        }
    }
}

/* =========================================================
   ARENA HAZARD
   ========================================================= */

class ChaosHazard{

    constructor(
        x,
        y,
        type
    ){

        this.x=x;
        this.y=y;

        this.baseX=x;
        this.baseY=y;

        this.type=type;

        this.phase=
            rand(
                0,
                TAU
            );

        this.speed=
            rand(
                .8,
                1.8
            );

        this.radius=
            type==="orb"
            ? 22
            : 30;

        this.active=true;

        this.life=30;
    }

    update(delta){

        this.phase+=
            this.speed*
            delta;

        this.life-=delta;

        if(
            this.type==="orb"
        ){

            this.x=
                this.baseX+
                Math.sin(
                    this.phase
                )*
                180;

            this.y=
                this.baseY+
                Math.cos(
                    this.phase*
                    1.7
                )*
                80;
        }

        if(
            this.type==="crusher"
        ){

            this.y=
                this.baseY+
                Math.abs(
                    Math.sin(
                        this.phase
                    )
                )*
                220;
        }

        if(
            this.type==="sweeper"
        ){

            this.x=
                this.baseX+
                Math.cos(
                    this.phase
                )*
                240;
        }

        this.checkPlayer();
        this.checkEnemies();
    }

    checkPlayer(){

        const d=
            c6Dist(
                this.x,
                this.y,
                player.x,
                player.y-25
            );

        if(
            d<
            this.radius+25
        ){

            const n=
                c6Normalize(
                    player.x-this.x,
                    player.y-25-this.y
                );

            player.vx+=
                n.x*
                700;

            player.vy+=
                n.y*
                700-
                150;

            damagePlayer(
                5,
                n.x*500
            );

            chaos6Impact(
                this.x,
                this.y,
                400
            );
        }
    }

    checkEnemies(){

        for(const e of enemies){

            if(e.dead)
                continue;

            const d=
                c6Dist(
                    this.x,
                    this.y,
                    e.x,
                    e.y-25
                );

            if(
                d<
                this.radius+25
            ){

                const n=
                    c6Normalize(
                        e.x-this.x,
                        e.y-25-this.y
                    );

                e.vx+=
                    n.x*
                    600;

                e.vy+=
                    n.y*
                    500-
                    150;

                damageEnemy(
                    e,
                    10,
                    n.x*600,
                    -350
                );
            }
        }
    }

    draw(){

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.strokeStyle=
            "#fff";

        ctx.lineWidth=3;

        if(
            this.type==="crusher"
        ){

            ctx.fillStyle=
                "#292929";

            ctx.fillRect(
                -45,
                -25,
                90,
                50
            );

            for(
                let i=-35;
                i<=35;
                i+=14
            ){

                ctx.beginPath();

                ctx.moveTo(
                    i,
                    25
                );

                ctx.lineTo(
                    i+7,
                    38
                );

                ctx.lineTo(
                    i+14,
                    25
                );

                ctx.stroke();
            }
        }
        else{

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                this.radius,
                0,
                TAU
            );

            ctx.stroke();

            ctx.beginPath();

            ctx.moveTo(
                -this.radius,
                0
            );

            ctx.lineTo(
                this.radius,
                0
            );

            ctx.moveTo(
                0,
                -this.radius
            );

            ctx.lineTo(
                0,
                this.radius
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}

/* =========================================================
   IMPACT
   ========================================================= */

function chaos6Impact(
    x,
    y,
    power
){

    chaos6.shockwaves.push({

        x,
        y,

        radius:10,

        maxRadius:
            c6Clamp(
                power*.18,
                35,
                220
            ),

        life:.45,

        maxLife:.45
    });

    camera.shake=
        Math.max(
            camera.shake,
            c6Clamp(
                power*.025,
                3,
                25
            )
        );

    for(let i=0;i<10;i++){

        if(
            typeof chaos5SpawnDebris===
            "function"
        ){

            chaos5SpawnDebris(
                x,
                y
            );
        }
    }
}

/* =========================================================
   SHOCKWAVES
   ========================================================= */

function chaos6UpdateShockwaves(delta){

    for(
        let i=
            chaos6.shockwaves.length-1;
        i>=0;
        i--
    ){

        const s=
            chaos6.shockwaves[i];

        s.life-=delta;

        const progress=
            1-
            s.life/
            s.maxLife;

        s.radius=
            s.maxRadius*
            progress;

        if(s.life<=0){

            chaos6.shockwaves.splice(
                i,
                1
            );
        }
    }
}

function chaos6DrawShockwaves(){

    for(
        const s of
        chaos6.shockwaves
    ){

        ctx.save();

        ctx.globalAlpha=
            s.life/
            s.maxLife;

        ctx.strokeStyle=
            "#fff";

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.radius,
            0,
            TAU
        );

        ctx.stroke();

        ctx.restore();
    }
}

/* =========================================================
   ENEMY AI STATES
   ========================================================= */

function chaos6GetAI(e){

    if(
        !chaos6.aiState.has(e)
    ){

        chaos6.aiState.set(
            e,
            {
                state:"chase",
                timer:0,
                attackCooldown:
                    rand(
                        .5,
                        1.5
                    )
            }
        );
    }

    return chaos6.aiState.get(e);
}

/* =========================================================
   SMART AI
   ========================================================= */

function chaos6SmartAI(delta){

    for(const e of enemies){

        if(e.dead)
            continue;

        const ai=
            chaos6GetAI(e);

        ai.timer+=delta;

        ai.attackCooldown-=delta;

        const dx=
            player.x-e.x;

        const dy=
            player.y-e.y;

        const d=
            Math.hypot(
                dx,
                dy
            );

        if(
            e.stun &&
            e.stun>0
        ){

            ai.state="stunned";
            continue;
        }

        if(
            d<65 &&
            ai.attackCooldown<=0
        ){

            ai.state="attack";

            ai.attackCooldown=
                rand(
                    1.1,
                    2
                );

            e.vx+=
                Math.sign(dx)*
                220;

            e.vy-=
                180;

            damagePlayer(
                rand(
                    4,
                    9
                ),
                Math.sign(dx)*
                250
            );

            chaos6Impact(
                player.x,
                player.y-25,
                160
            );

            continue;
        }

        if(d<180){

            ai.state="pressure";

            e.vx+=
                Math.sign(dx)*
                260*
                delta;
        }
        else{

            ai.state="chase";

            e.vx+=
                Math.sign(dx)*
                380*
                delta;
        }

        if(
            Math.abs(dy)>100 &&
            e.y>=world.floor-80
        ){

            if(
                Math.random()<
                delta*.5
            ){

                e.vy=-500;
            }
        }

        e.vx=
            c6Clamp(
                e.vx,
                -500,
                500
            );
    }
}

/* =========================================================
   ENEMY RAGDOLL KO
   ========================================================= */

function chaos6EnemyKO(e){

    if(!e || e.dead)
        return;

    e.dead=true;

    e.vx+=

    chaos6.score+=100;

    chaos6Impact(
        e.x,
        e.y,
        650
    );

    chaos6.aiState.delete(e);
}

/* =========================================================

const chaos6OldDamageEnemy=

damageEnemy=function(

/* =========================================================
   APPLY SPECIAL GRAVITY
   ========================================================= */

const chaos6BaseGravity=

function chaos6ApplyGravity(){

    world.gravity=
        chaos6BaseGravity*
        chaos6.gravityMultiplier;
}

/* =========================================================
   CAMERA FOLLOW
   ========================================================= */

function chaos6CameraFollow(){

    chaos6.cameraTargetX=
        player.x;

    chaos6.cameraTargetY=
        player.y;

    if(
        chaos6.movingHazards.length
    ){

        for(const h of
            chaos6.movingHazards
        ){

            if(
                c6Dist(
                    player.x,
                    player.y,
                    h.x,
                    h.y
                )<400
            ){

                chaos6.cameraTargetX=
                    (player.x+h.x)/2;

                chaos6.cameraTargetY=
                    (player.y+h.y)/2;

                break;
            }
        }
    }
}

   UPDATE

update=function(delta){

    chaos6ApplyGravity();

    chaos6UpdateGrabs(delta);

    chaos6SmartAI(delta);

    chaos6UpdateHazards(delta);

    chaos6UpdateShockwaves(delta);

    chaos6GravityEvent(delta);

    chaos6CameraFollow();
};

/* =========================================================
   KEY CONTROLS
   ========================================================= */

addEventListener(
    "keydown",
    e=>{

        const k=
            e.key.toLowerCase();

        /*
         F = grab
        */

        if(k==="f"){

            chaos6Grab();
        }

        /*
         R = throw while grabbed
        */

        if(
            k==="r" &&
            chaos6.grabs.length
        ){

            const g=
                chaos6.grabs[
                    chaos6.grabs.length-1
                ];

            g.throwTarget();

            chaos6.grabs=[];
        }

        /*
         M = arena event
        */

        if(k==="m"){

            chaos6SpawnEvent();
        }

        /*
         N = multiple hazards

class ChaosBoss{

    constructor(x,y){

        this.angle=0;

        this.attackTimer=1;

        this.jumpTimer=2;

        this.stun=0;

        this.dead=false;

        this.flash=0;
    }

    update(delta){

        if(this.dead)
            return;

        if(this.stun>0){

            this.stun-=delta;

            this.vx*=.94;
        }

        this.vy+=
            world.gravity*
            delta;

        this.x+=
            this.vx*
            delta;

        this.y+=
            this.vy*
            delta;

        this.vx*=.992;

        this.angle+=
            this.vx*.001;

        if(
            this.y+
            this.radius>
            world.floor

            this.y=
                world.floor-
                this.radius;

            if(
                Math.abs(this.vy)>200
            ){

                this.vy*=-.45;

                chaos7Impact(
                    this.x,
                    this.y,
                    Math.abs(this.vy)
                );
            }
            else{

                this.vy=0;
            }
        }

        if(this.x<-2500)
            this.x=-2500;

        if(this.x>2500)
            this.x=2500;

        this.updatePhase();

        if(this.stun<=0){

            this.attackTimer-=delta;
            this.jumpTimer-=delta;

            this.ai(delta);
        }

        if(this.flash>0)
            this.flash-=delta;
    }

    updatePhase(){

        const ratio=
            this.hp/
            this.maxHp;

        if(ratio>.66)
            this.phase=1;
        else if(ratio>.33)
            this.phase=2;
        else
            this.phase=3;
    }

    ai(delta){

        const dx=
            player.x-this.x;

        const dy=
            player.y-this.y;

        const d=
            Math.hypot(
                dx,
                dy
            );

        const dir=
            Math.sign(dx)||1;

        this.vx+=
            dir*
            180*
            delta;

        this.vx=
            c7Clamp(
                this.vx,
                -350,
                350
            );

        if(
            this.jumpTimer<=0 &&
            Math.abs(dy)>80
        ){

            this.vy=
                -650;

            this.jumpTimer=
                this.phase===3
                ? .9
                : 1.8;
        }

        if(
            this.attackTimer<=0

            this.attack();

                this.phase===1

                : this.phase===2
                ? 1.5
                : .9;

            this.phase===1

            c7Random(attacks);

        }
    }

    damage(amount,vx=0,vy=0){

            return;

            Math.max(

            );

        this.vx+=

class ChaosDestructionZone{

    constructor(x,y,radius){

        this.x=x;
        this.y=y;

        this.radius=radius;

        this.life=2;

        this.maxLife=2;
    }

    update(delta){

        this.life-=delta;

        for(const o of objects){

            if(
                o.dead ||
                o.held
            )
                continue;

            const d=
                c7Distance(
                    this.x,
                    this.y,
                    o.x,
                    o.y
                );

            if(d<this.radius){

                const n=
                    c7Norm(
                        o.x-this.x,
                        o.y-this.y
                    );

                o.vx+=
                    n.x*
                    300*
                    delta;

                o.vy+=
                    n.y*
                    300*
                    delta;
            }
        }
    }

    draw(){

        ctx.save();

        ctx.globalAlpha=
            .15*
            this.life/
            this.maxLife;

        ctx.strokeStyle="#fff";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            TAU
        );

        ctx.stroke();

        ctx.restore();
    }
}

function chaos7ObjectBossCollision(){
